// ═══════════════════════════════════════════════════════════
async function loadTribalCommanders() {
  goPanel(2);
  const tribeName = S.tribeName || S.tribe || 'Creature';
  const tribeEn   = S.tribe || tribeName;  // inglés para query
  // En tribal usamos S.tribeColors; en otros modos S.colors
  const tribalColors = S.tribeColors || [];
  const colorPart = tribalColors.length ? `color=${tribalColors.join('')}` : (S.colors.length ? `color=${S.colors.join('')}` : '');

  document.getElementById('p2c').innerHTML = `
    <div class="info-banner">🐉 <strong>Mazo Tribal: ${tribeName}</strong><br>
    Buscando los mejores comandantes para un mazo de ${tribeName}...</div>
    <div class="ldc"><div class="spin-big"></div>Consultando Scryfall...</div>`;

  // Buscar comandantes que sinergizan con la tribu
  // 1. Comandantes que mencionan el tipo de tribu en su texto
  // 2. Comandantes que son de ese tipo
  const tribeQ1 = `is:commander t:legendary t:creature ${colorPart} (o:"${tribeEn}" OR t:"${tribeEn}")`;
  const tribeQ2 = `is:commander t:legendary t:creature ${colorPart} o:"${tribeEn}"`;
  const tribeQ3 = `is:commander t:legendary t:creature ${colorPart} t:"${tribeEn}"`;

  let cards = await sfQ(tribeQ1);
  if (cards.length < 4) { const ex=await sfQ(tribeQ2); const s=new Set(cards.map(c=>c.id)); for(const c of ex) if(!s.has(c.id)) cards.push(c); }
  if (cards.length < 4) { const ex=await sfQ(tribeQ3); const s=new Set(cards.map(c=>c.id)); for(const c of ex) if(!s.has(c.id)) cards.push(c); }
  // Sin filtro de color si hay pocos
  if (cards.length < 4) {
    const ex=await sfQ(`is:commander t:legendary t:creature (o:"${tribeEn}" OR t:"${tribeEn}") -is:extra`);
    const s=new Set(cards.map(c=>c.id)); for(const c of ex) if(!s.has(c.id)) cards.push(c);
  }

  cards = cards
    .filter(c => !c.edhrec_rank || c.edhrec_rank <= (RANK_LIMITS[S.bracket]||6000) * 2)
    .sort((a,b) => (a.edhrec_rank||9999)-(b.edhrec_rank||9999))
    .slice(0, 36);

  if (!cards.length) {
    document.getElementById('p2c').innerHTML = `<div class="ebox">No se encontraron comandantes para la tribu "${tribeName}". Prueba con otro nombre en inglés.</div>`;
    return;
  }

  document.getElementById('p2c').innerHTML = `
    <div class="info-banner">🐉 <strong>Tribal ${tribeName}</strong> — ${cards.length} comandantes encontrados<br>
    Selecciona el comandante para tu mazo tribal</div>
    <div class="cmd-grid" id="cmdgrid"></div>
    <div class="nav">
      <button class="btn btn-g" onclick="renderP1();goPanel(1)">← Atrás</button>
      <button class="btn btn-p" id="btn2" onclick="showBuildChoice('tribal')" disabled>Construir mazo tribal →</button>
    </div>`;

  const grid = document.getElementById('cmdgrid');
  cards.forEach(c => {
    const img = c.image_uris?.normal || c.card_faces?.[0]?.image_uris?.normal || '';
    const ci = (c.color_identity||[]).map(x=>`<span class="pip pip-${x}" style="width:10px;height:10px"></span>`).join(' ');
    const rk = c.edhrec_rank ? `#${c.edhrec_rank.toLocaleString()}` : 'Nuevo';
    const el = document.createElement('div');
    el.className = 'cmd-card'; el.id = 'cc-'+c.id;
    el.innerHTML = `<div class="chkv">✓</div>
      ${img ? `<img src="${img}" alt="${c.name}" loading="lazy">` : `<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:34px">🃏</div>`}
      <div class="ci">
        <div class="ci-name">${c.name}</div>
        <div class="ci-type">${ci} <span style="font-size:9px">${(c.type_line||'').replace('Legendary Creature — ','')}</span></div>
        <div class="ci-pills"><span class="spill sp-e">${rk} EDHREC</span></div>
        <div class="ci-ai" id="ai-${c.id}">${fallbackAI(c,getPrimaryStrategy())}</div>
      </div>`;
    el.addEventListener('mouseenter', e => showZ(e, img, c.name, c.oracle_text||c.card_faces?.[0]?.oracle_text||''));
    el.addEventListener('mouseleave', hideZ);
    el.onclick = () => {
      document.querySelectorAll('.cmd-card').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); S.cmdData = c;
      document.getElementById('btn2').disabled = false;
    };
    grid.appendChild(el);
  });
}

async function startWorkshopTribal() {
  // Forzar estrategia compatible con tribal si no hay una seleccionada
  if (!S.strategy) S.strategy = 'aggro';
  // Añadir cartas esenciales al workshop y pools como prioritarias
  if (S._essentialsPending?.length) {
    S._essentialsPending.forEach(card => {
      const t = (card.type_line||'').toLowerCase();
      const sid = t.includes('creature') ? 'creatures'
        : t.includes('instant')||t.includes('sorcery') ? 'spells'
        : t.includes('artifact') ? 'artifacts'
        : t.includes('enchantment') ? 'enchants'
        : t.includes('land') ? 'lands' : 'creatures';
      if (!S.wk[sid]) S.wk[sid] = [];
      if (!S.wk[sid].find(c=>c.id===card.id)) S.wk[sid].push(card);
    });
    S._essentialsPending = [];
  }
  startWorkshop();
}

// SAVED DECKS — localStorage persistence
// ═══════════════════════════════════════════════════════════
const SAVED_KEY = 'mtg_commander_saved_decks';

function getSavedDecks(){
  try { return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]'); } catch(e){ return []; }
}

function saveDeckToStorage(deckObj, customName){
  const cmd = S.cmdData;
  const partner = S.partnerData;
  const strat = getPrimaryStrategy();
  const decks = getSavedDecks();
  const id = 'deck_'+Date.now();
  const entry = {
    id,
    name: customName || (cmd ? cmd.name + (partner?' + '+partner.name:'') : 'Mazo sin nombre'),
    cmdName: cmd ? cmd.name + (partner?' + '+partner.name:'') : '',
    cmdImg: cmd?.image_uris?.art_crop || cmd?.card_faces?.[0]?.image_uris?.art_crop || '',
    strat: strat?.name || '',
    bracket: S.bracket,
    total: deckObj?.total || 0,
    savedAt: Date.now(),
    // Save the full deck export list
    exportList: buildExportText(deckObj),
    // Save state for reloading
    state: {
      mode: S.mode,
      strategies: S.strategies,
      bracket: S.bracket,
      cmdName: cmd?.name || '',
      partnerName: partner?.name || '',
    }
  };
  decks.unshift(entry);
  // Keep max 20 decks
  if(decks.length > 20) decks.splice(20);
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(decks)); return true; } catch(e){ return false; }
}

function buildExportText(deck){
  if(!deck) return '';
  const cmds = deck.commanders || [];
  const all = [
    {s:'Comandante(s)',c:cmds},
    {s:'Tierras',c:deck.lands||[]},
    {s:'Ramp',c:deck.sections?.ramp||[]},
    {s:'Criaturas',c:deck.sections?.creatures||[]},
    {s:'Conjuros',c:deck.sections?.spells||[]},
    {s:'Artefactos',c:deck.sections?.artifacts||[]},
    {s:'Encantamientos',c:deck.sections?.enchants||[]},
  ];
  let txt = '';
  all.forEach(({s,c})=>{if(!c.length)return;txt+=`// ${s}\n`;c.forEach(x=>txt+=`1 ${x.name||'Forest'}\n`);txt+='\n';});
  return txt;
}

function deleteSavedDeck(id){
  const decks = getSavedDecks().filter(d=>d.id!==id);
  try { localStorage.setItem(SAVED_KEY, JSON.stringify(decks)); } catch(e){}
  renderHome();
}

function clearAllSavedDecks(){
  if(!confirm('¿Borrar todos los mazos guardados?')) return;

async function analyzeOptimize(){
  const raw = document.getElementById('opt-input').value.trim();
  if(!raw){ alert('Pega tu lista de mazo primero'); return; }
  const resultEl = document.getElementById('opt-result');
  resultEl.innerHTML=`<div class="ldc"><div class="spin-big"></div>Analizando tu mazo con EDHREC e IA...</div>`;

  // Parse card names from the list
  const cardNames = [];
  raw.split('\n').forEach(line => {
    line = line.trim();
    if(!line || line.startsWith('//') || line.startsWith('#')) return;
    // Strip quantity prefix: "1 Sol Ring", "4x Sol Ring", "Sol Ring"
    const m = line.match(/^\d+[xX]?\s+(.+)/) || line.match(/^(.+)/);
    if(m) {
      const name = m[1].replace(/\s*\*CMDR\*.*/, '').trim();
      if(name) cardNames.push(name);
    }
  });

  if(cardNames.length < 5){
    resultEl.innerHTML=`<div class="ebox">Necesitas al menos 5 cartas para analizar el mazo.</div>`;
    return;
  }

  // Detect commander (card marked *CMDR* is authoritative, otherwise first legendary creature in original list)
  let cmdName = '';
  const cmdrMatch = raw.match(/^\d+[xX]?\s+(.+?)\s+\*CMDR\*/im);
  if(cmdrMatch) cmdName = cmdrMatch[1].trim();

  // Fetch card data from Scryfall to get color identity, oracle text, etc.
  resultEl.innerHTML=`<div class="ldc"><div class="spin-big"></div>Consultando Scryfall para ${cardNames.length} cartas...</div>`;

  const cardData = {};
  const batchSize = 8;
  for(let i=0; i<Math.min(cardNames.length, 60); i+=batchSize){
    const batch = cardNames.slice(i, i+batchSize);
    const q = batch.map(n=>`!"${n}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => { cardData[card.name.toLowerCase()] = card; });
  }

  // Detect commander from data if not marked — only consider cards in the first 20 lines to avoid
  // picking up newly-added cards (which get appended at the end without *CMDR*)
  if(!cmdName){
    const earlyNames = cardNames.slice(0, 20);
    const legendary = earlyNames.find(n => {
      const d = cardData[n.toLowerCase()];
      return d && (d.type_line||'').includes('Legendary') && (d.type_line||'').includes('Creature');
    });
    if(legendary) cmdName = legendary;
  }

  // Get color identity from commander
  const cmdCard = cmdName ? cardData[cmdName.toLowerCase()] : null;
  const ci = cmdCard?.color_identity || ['W','U','B','R','G'];
  const colorStr = ci.join('');

  resultEl.innerHTML=`<div class="ldc"><div class="spin-big"></div>Buscando mejoras en EDHREC para ${cmdName||'tu mazo'}...</div>`;

  // Fetch EDHREC recommendations for this commander
  let edhRecs = [];
  if(cmdName){
    edhRecs = await fetchEdhrecForCommander(cmdName);
  }

  // Find cards in EDHREC top list that aren't in the deck
  const deckSet = new Set(cardNames.map(n=>n.toLowerCase()));
  const missing = edhRecs
    .filter(r => r.name && !deckSet.has(r.name.toLowerCase()))
    .sort((a,b) => (b.num_decks||b.inclusion||0) - (a.num_decks||a.inclusion||0))
    .slice(0, 30);

  // Also find high-synergy staples not in deck
  const cfColor = `color<=${colorStr} legal:commander -is:extra`;
  const staplePool = await sfQ(`(o:"draw" o:"card" OR o:"search your library" OR o:"counter target" OR o:"destroy all") ${cfColor}`);
  const missStaples = staplePool
    .filter(c => !deckSet.has(c.name.toLowerCase()) && (c.edhrec_rank||9999) < 500)
    .sort((a,b)=>(a.edhrec_rank||9999)-(b.edhrec_rank||9999))
    .slice(0,20);

  // Fetch images for missing cards
  const allMissing = [...missing.slice(0,20)];
  const missingImgs = {};
  for(let i=0; i<allMissing.length; i+=8){
    const batch = allMissing.slice(i,i+8);
    const q = batch.map(c=>`!"${c.name}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => { missingImgs[card.name.toLowerCase()] = card; });
  }

  // Build AI analysis if API key available
  let aiAnalysis = '';
  if(S.apiKey && cmdName){
    const deckList = cardNames.slice(0,40).join(', ');
    const topMissing = allMissing.slice(0,10).map(c=>c.name).join(', ');
    try{
      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:
          `Experto MTG Commander. Analiza este mazo y sugiere mejoras específicas en español.
Comandante: ${cmdName}
Cartas actuales (muestra): ${deckList}
Cartas recomendadas por EDHREC no incluidas: ${topMissing}

En 3-4 párrafos breves:
1. Debilidades principales del mazo actual
2. Las 3-5 cartas más importantes que faltan y por qué
3. Qué cartas del mazo actual podrían salir para hacerles hueco`}]})
      });
      if(res.ok){const d=await res.json();aiAnalysis=d.content?.[0]?.text||'';}
    }catch(e){}
  }

  // Render results
  const deckStats = {
    total: cardNames.length,
    creatures: cardNames.filter(n=>(cardData[n.toLowerCase()]?.type_line||'').includes('Creature')).length,
    lands: cardNames.filter(n=>(cardData[n.toLowerCase()]?.type_line||'').includes('Land')).length,
    cmd: cmdName,
    colors: colorStr,
  };

  resultEl.innerHTML=`
    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px">
      <div class="stat-box"><div class="stn">${deckStats.total}</div><div class="stl">cartas detectadas</div></div>
      <div class="stat-box"><div class="stn">${deckStats.creatures}</div><div class="stl">criaturas</div></div>
      <div class="stat-box"><div class="stn">${deckStats.lands}</div><div class="stl">tierras</div></div>
      <div class="stat-box"><div class="stn">${edhRecs.length}</div><div class="stl">datos EDHREC</div></div>
    </div>

    ${cmdName?`<div class="info-banner">Comandante detectado: <strong>${cmdName}</strong> · Colores: <strong>${colorStr||'Sin color'}</strong></div>`:'<div class="info-banner">⚠ No se detectó comandante. Márcalo con *CMDR* en la lista para mejores resultados.</div>'}

    ${aiAnalysis?`
    <div class="strategy-analysis" style="margin-bottom:16px">
      <div class="sa-title">🤖 Análisis IA del mazo</div>
      <div class="sa-body" style="display:block">${aiAnalysis.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^## (.+)$/gm,'<div style="font-size:13px;font-weight:700;color:var(--gold);margin:12px 0 4px">$1</div>').replace(/\*\*(.+?)\*\*/g,'<strong style="color:var(--text)">$1</strong>').replace(/\n/g,'<br>')}</div>
    </div>`:''}

    <!-- Cartas recomendadas de EDHREC que faltan -->
    ${allMissing.length?`
    <div class="must-panel">
      <div class="must-title">⭐ Cartas recomendadas por EDHREC que no tienes</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:12px">Pasa el ratón sobre una carta para ver qué hace · Haz clic en + para sugerir el swap</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px" id="opt-missing-grid">
        ${allMissing.slice(0,24).map(item=>{
          const card = missingImgs[item.name?.toLowerCase()];
          const img = card?.image_uris?.normal||card?.card_faces?.[0]?.image_uris?.normal||'';
          const pct = item.inclusion?item.inclusion+'%':item.num_decks?(item.num_decks/1000).toFixed(1)+'k mazos':'';
          const safeId = (item.name||'').replace(/[^a-z0-9]/gi,'_');
          const oracle = card?.oracle_text||card?.card_faces?.[0]?.oracle_text||'';
          return `<div class="must-card" id="optcard-${safeId}" style="position:relative"
            data-name="${(item.name||'').replace(/"/g,'&quot;')}"
            data-img="${img}"
            data-oracle="${oracle.replace(/"/g,'&quot;').replace(/\n/g,' ')}">
            <div class="ess-add-btn" onclick="addOptCard('${(item.name||'').replace(/'/g,"\\'")}','${safeId}')" title="Sugerir swap">+</div>
            ${img?`<img src="${img}" alt="${item.name}" loading="lazy">`:'<div style="aspect-ratio:5/7;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px">🃏</div>'}
            <div class="mc-info">
              <div class="mc-name">${item.name}</div>
              <div class="mc-pct">${pct}</div>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`:''}

    <!-- Staples que faltan -->
    ${missStaples.length?`
    <div class="must-panel" style="margin-top:14px">
      <div class="must-title">🔮 Staples de Commander que no tienes</div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:10px">Cartas con EDHREC rank &lt; 500 en tus colores · pasa el ratón para ver qué hacen</div>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${missStaples.map(c=>`<span style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:4px 10px;font-size:11px;color:var(--text2);cursor:pointer"
          onmouseenter="showZByName(event,'${c.name.replace(/'/g,"\\'")}','')" onmouseleave="hideZ()">
          ${c.name} <span style="color:var(--text3)">#${c.edhrec_rank}</span>
        </span>`).join('')}
      </div>
    </div>`:''}

    <div style="margin-top:16px;display:flex;gap:8px">
      <button class="btn btn-g btn-sm" onclick="renderOptimize()">← Nueva lista</button>
      <button class="btn btn-g btn-sm" onclick="goPanel('home');renderHome()">🏠 Inicio</button>
    </div>`;

  // Attach zoom events to optimizer cards (needs to be done after innerHTML is set)
  setTimeout(()=>{
    document.querySelectorAll('#opt-missing-grid .must-card').forEach(el=>{
      const name = el.dataset.name;
      const img = el.dataset.img;
      const oracle = el.dataset.oracle;
      el.addEventListener('mouseenter', e => showZ(e, img, name, oracle));
      el.addEventListener('mouseleave', hideZ);
    });
  }, 50);
}

async function addOptCard(name, safeId){
  // Mark the card as "processing"
  const el = document.getElementById('optcard-'+safeId);
  const btn = el?.querySelector('.ess-add-btn');
  if(btn){ btn.textContent='⏳'; btn.style.background='var(--gold)'; btn.style.color='#120e00'; btn.onclick=null; }

  // Get or create the swap result panel
  let swapPanel = document.getElementById('opt-swap-panel');
  if(!swapPanel){
    swapPanel = document.createElement('div');
    swapPanel.id = 'opt-swap-panel';
    swapPanel.style.cssText = 'margin-top:16px';
    document.getElementById('opt-result').prepend(swapPanel);
  }
  swapPanel.innerHTML = `<div class="auto-build-panel">
    <div class="ab-header">
      <div>
        <div class="ab-title">Analizando qué sacar para meter <strong style="color:var(--gold)">${name}</strong>...</div>
        <div class="ab-sub">La IA busca la carta de menor sinergia en tu mazo</div>
      </div>
    </div>
    <div class="ab-log" id="swap-log" style="min-height:80px"></div>
  </div>`;

  const logEl = document.getElementById('swap-log');
  const log = (msg, done=true) => {
    const d = document.createElement('div'); d.className='ab-log-line';
    d.innerHTML = done ? `<span class="check">✓</span><span>${msg}</span>`
                       : `<div class="spin-xs"></div><span>${msg}</span>`;
    logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  };

  // Get the current deck list from the textarea
  const raw = document.getElementById('opt-input')?.value || '';
  const cardNames = [];
  raw.split('\n').forEach(line => {
    line = line.trim();
    if(!line || line.startsWith('//') || line.startsWith('#')) return;
    const m = line.match(/^\d+[xX]?\s+(.+)/) || line.match(/^(.+)/);
    if(m){
      const n = m[1].replace(/\s*\*CMDR\*.*/,'').trim();
      if(n) cardNames.push(n);
    }
  });

  if(cardNames.length < 5){
    log('No hay suficientes cartas en la lista para analizar.');
    return;
  }

  log(`Leyendo ${cardNames.length} cartas del mazo...`);

  // Fetch data for the deck cards to get oracle text + EDHREC rank
  const cardData = {};
  for(let i=0; i<Math.min(cardNames.length,80); i+=8){
    const batch = cardNames.slice(i,i+8);
    const q = batch.map(n=>`!"${n}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => { cardData[card.name.toLowerCase()] = card; });
  }
  log(`Datos obtenidos para ${Object.keys(cardData).length} cartas`);

  // Find commander
  const cmdrMatch = raw.match(/^\d+[xX]?\s+(.+?)\s+\*CMDR\*/im);
  let cmdName = cmdrMatch?.[1]?.trim();
  if(!cmdName){
    // Only look at early lines to avoid picking up recently-added cards
    const earlyNames = cardNames.slice(0, 20);
    cmdName = earlyNames.find(n => {
      const d = cardData[n.toLowerCase()];
      return d && (d.type_line||'').includes('Legendary') && (d.type_line||'').includes('Creature');
    });
  }
  const cmdOracle = cmdName ? (cardData[cmdName.toLowerCase()]?.oracle_text||'').toLowerCase() : '';

  log(`Comandante detectado: ${cmdName||'desconocido'}`);
  log('Calculando sinergia de cada carta con el mazo...', false);

  // Score every non-commander, non-land card for synergy with commander + deck
  const scored = [];
  const strat = getPrimaryStrategy() || {id:'aggro',synQ:''};

  cardNames.forEach(n => {
    const card = cardData[n.toLowerCase()];
    if(!card) return;
    const t = (card.type_line||'').toLowerCase();
    // Skip commanders and basic lands from cut candidates
    if(n.toLowerCase() === cmdName?.toLowerCase()) return;
    if(t.includes('basic land') || ['plains','island','swamp','mountain','forest'].includes(n.toLowerCase())) return;
    if(raw.toLowerCase().includes(n.toLowerCase()+'  *cmdr*') || raw.includes('*CMDR*') && raw.includes(n)) return;

    const oracle = ((card.oracle_text||'')+(card.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
    let sc = 0;

    // EDHREC rank — alta popularidad = alta sinergia
    const rank = card.edhrec_rank || 9999;
    sc += Math.max(0, 3000-rank)/300;  // 0-10 pts

    // Coincidencia con oracle del comandante
    ['whenever','trigger','each','draw','token','counter','sacrifice','graveyard','tap','untap'].forEach(kw => {
      if(cmdOracle.includes(kw) && oracle.includes(kw)) sc += 1.5;
    });

    // Sinergias con el mazo completo (otras cartas)
    const deckOracle = Object.values(cardData).map(c=>((c.oracle_text||'')).toLowerCase()).join(' ');
    ['whenever','enters the battlefield','dies','sacrifice','draw','token','counter'].forEach(kw => {
      if(oracle.includes(kw) && deckOracle.includes(kw)) sc += 0.5;
    });

    // Penalizar cartas muy situacionales
    const situational = ['destroy target','exile target','return target'];
    const isSituational = situational.some(kw => oracle.includes(kw)) && !oracle.includes('whenever') && !oracle.includes('each');
    if(isSituational) sc -= 2;

    // Penalizar CMC alto sin payoff
    if((card.cmc||0) >= 7 && !oracle.includes('draw') && !oracle.includes('win') && !oracle.includes('each player')) sc -= 1.5;

    // Penalizar si no interactúa con el comandante
    if(cmdOracle && !oracle.includes(cmdOracle.split(' ').filter(w=>w.length>5)[0]||'____')) sc -= 0.3;

    scored.push({ name: n, card, sc: Math.max(0, sc) });
  });

  scored.sort((a,b) => a.sc - b.sc); // menor sinergia primero

  const weakest = scored[0];
  if(!weakest){
    log('No se encontró candidato para sacar.');
    if(btn){ btn.textContent='✓'; btn.style.background='var(--green)'; btn.style.color='#0a2012'; }
    return;
  }

  log(`Carta con menor sinergia: ${weakest.name} (score ${weakest.sc.toFixed(1)})`);

  // Build explanation — local first, then AI if available
  const wOracle = ((weakest.card?.oracle_text||'')+(weakest.card?.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  const situational = ['destroy target','exile target','return target'].some(kw=>wOracle.includes(kw));
  const highCMC = (weakest.card?.cmc||0) >= 6;
  const noTrigger = !wOracle.includes('whenever') && !wOracle.includes('each');
  const noSynCmd = cmdOracle && !wOracle.includes(cmdOracle.split(' ').filter(w=>w.length>5)[0]||'____');

  let localReason = `<strong>${weakest.name}</strong> tiene la menor sinergia del mazo porque `;
  const reasons = [];
  if(situational) reasons.push('es una carta situacional que solo actúa en respuesta a amenazas específicas');
  if(highCMC) reasons.push(`su coste de maná es muy alto (${weakest.card?.cmc}) sin generar ventaja continua`);
  if(noTrigger) reasons.push('no tiene habilidades desencadenadas que generen valor a lo largo de la partida');
  if(noSynCmd && cmdName) reasons.push(`no interactúa directamente con las habilidades de ${cmdName}`);
  if(weakest.card?.edhrec_rank && weakest.card.edhrec_rank > 3000) reasons.push(`no es muy popular en Commander (EDHREC rank #${weakest.card.edhrec_rank.toLocaleString()})`);
  if(!reasons.length) reasons.push('su impacto en el tablero es menor comparado con el resto del mazo');
  localReason += reasons.join(' y ') + '.';

  let explanation = localReason;

  // AI explanation if available
  if(S.apiKey){
    log('Generando explicación detallada con Claude...', false);
    try{
      const res = await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:200,messages:[{role:'user',content:
          `MTG Commander experto. Explica en 2-3 frases directas en español por qué "${weakest.name}" es la carta de menor sinergia en un mazo de ${cmdName||'Commander'} con esta estrategia.
Texto de oráculo de la carta: ${weakest.card?.oracle_text||'sin texto'}
EDHREC rank: ${weakest.card?.edhrec_rank||'sin datos'}
Di concretamente por qué no encaja: si es situacional, si no genera valor continuo, si no interactúa con el comandante, etc.`}]})
      });
      if(res.ok){
        const d=await res.json();
        const aiTxt=d.content?.[0]?.text||'';
        if(aiTxt) explanation = aiTxt;
      }
    }catch(e){}
    log('Explicación generada');
  }

  // Render the swap suggestion
  const newCardData = await sfQ(`!"${name}" -is:extra`);
  const newImg = newCardData[0]?.image_uris?.normal||newCardData[0]?.card_faces?.[0]?.image_uris?.normal||'';
  const weakImg = weakest.card?.image_uris?.normal||weakest.card?.card_faces?.[0]?.image_uris?.normal||'';

  swapPanel.innerHTML = `<div class="auto-build-panel" style="border-color:rgba(212,168,67,.3)">
    <div style="font-size:13px;font-weight:700;color:var(--gold);margin-bottom:14px">💱 Cambio sugerido</div>

    <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;margin-bottom:16px">
      <!-- Sale -->
      <div style="background:rgba(224,85,85,.08);border:1px solid rgba(224,85,85,.25);border-radius:var(--radius);padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--red);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">❌ SALE</div>
        ${weakImg?`<img src="${weakImg}" style="width:100%;max-width:120px;border-radius:8px;margin-bottom:8px">`:''}
        <div style="font-size:12px;font-weight:700;color:var(--text)">${weakest.name}</div>
        ${weakest.card?.mana_cost?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${weakest.card.mana_cost}</div>`:''}
      </div>

      <!-- Arrow -->
      <div style="font-size:28px;color:var(--gold)">⇄</div>

      <!-- Entra -->
      <div style="background:rgba(76,175,125,.08);border:1px solid rgba(76,175,125,.25);border-radius:var(--radius);padding:12px;text-align:center">
        <div style="font-size:10px;color:var(--green);font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px">✅ ENTRA</div>
        ${newImg?`<img src="${newImg}" style="width:100%;max-width:120px;border-radius:8px;margin-bottom:8px">`:''}
        <div style="font-size:12px;font-weight:700;color:var(--text)">${name}</div>
        ${newCardData[0]?.mana_cost?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${newCardData[0].mana_cost}</div>`:''}
      </div>
    </div>

    <!-- Explicación -->
    <div style="background:rgba(0,0,0,.3);border-radius:var(--rsm);padding:12px;font-size:12px;color:var(--text2);line-height:1.7;margin-bottom:14px">
      <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Por qué sacar ${weakest.name}</div>
      ${explanation}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-gold btn-sm" onclick="confirmSwap('${weakest.name.replace(/'/g,"\\'")}','${name.replace(/'/g,"\\'")}')">
        ✅ Aplicar cambio en mi lista
      </button>
      <button class="btn btn-g btn-sm" onclick="this.parentElement.parentElement.parentElement.remove()">
        Cancelar
      </button>
    </div>
  </div>`;

  // Mark the added card as pending
  if(btn){ btn.textContent='⏳'; btn.style.background='rgba(212,168,67,.5)'; }
}

function confirmSwap(outCard, inCard){
  const ta = document.getElementById('opt-input');
  if(!ta) return;
  let text = ta.value;

  // Remove the card going out (all variations: "1 Card", "4x Card", "Card")
  const escapedOut = outCard.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  text = text.replace(new RegExp(`^\\d+[xX]?\\s+${escapedOut}\\s*$`, 'gim'), '');
  text = text.replace(new RegExp(`^${escapedOut}\\s*$`, 'gim'), '');
  // Clean up double blank lines
  text = text.replace(/\n{3,}/g, '\n\n').trim();

  // Add the new card at the END of the list (not top, so it doesn't get mistaken for commander)
  text = text + '\n1 ' + inCard;

  ta.value = text;

  // Update UI
  const swapPanel = document.getElementById('opt-swap-panel');
  if(swapPanel){
    swapPanel.innerHTML = `<div class="info-banner" style="border-color:rgba(76,175,125,.4);background:rgba(76,175,125,.07)">
      ✅ <strong>${outCard}</strong> eliminado y <strong>${inCard}</strong> añadido a tu lista. 
      <button class="btn btn-g btn-sm" style="margin-left:10px" onclick="analyzeOptimize()">Reanalizar mazo</button>
    </div>`;
  }
}

async function sfQ(q,page=1){
  try{const r=await fetch(`${SF}/cards/search?q=${encodeURIComponent(q)}&order=edhrec&dir=desc&unique=cards&page=${page}`);if(!r.ok)return[];const d=await r.json();return d.data||[];}catch(e){return[];}
}
function isOK(card,br){
  if(!card||card._basic) return true;
  const n=(card.name||'').toLowerCase();
  if(['plains','island','swamp','mountain','forest'].includes(n)) return true;
  const rk=card.edhrec_rank; if(!rk) return true;
  return rk<=(RANK_LIMITS[br]||6000);
}
async function fetchEdhrec(stratId){
  const s=STRATEGIES.find(x=>x.id===stratId);
  try{const r=await fetch(`${EDHREC_BASE}/pages/commanders/${s.tag}.json`,{headers:{'Accept':'application/json'}});
    if(!r.ok)return[];const d=await r.json();
    const cl=d?.container?.json_dict?.cardlists||d?.cardlists||[];
    for(const l of cl){const c=l.cardviews||l.cards||[];if(c.length>0)return c;}
    return[];
  }catch(e){return[];}
}
async function aiAnalysis(card,strat,bracket,partner){
  if(!S.apiKey) return null;
  const bdata=BRACKETS.find(b=>b.n===bracket);
  const o1=card.oracle_text||card.card_faces?.map(f=>f.oracle_text).join(' / ')||'';
  const o2=partner?(partner.oracle_text||partner.card_faces?.map(f=>f.oracle_text).join(' / ')||''):'';
  const desc=partner?`${card.name}: ${o1}\n${partner.name}: ${o2}`:`${card.name}: ${o1}`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:110,messages:[{role:'user',content:`MTG Commander experto. 2 frases directas: ${desc}\nEstrategia: ${strat.name}, Bracket ${bracket} (${bdata.name}). ¿Encaja? ¿Combos?`}]})
    });
    if(!res.ok) return null;
    const d=await res.json(); return d.content?.[0]?.text||null;
  }catch(e){return null;}
}
function fallbackAI(c,strat){
  const t=((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join('')).toLowerCase();
  const pts=[];
  if(t.includes('token'))pts.push('Genera tokens');
  if(t.includes('draw'))pts.push('Roba cartas');
  if(t.includes('counter target'))pts.push('Puede contrarrestar');
  if(t.includes('search your library'))pts.push('Tutoriza');
  if(t.includes('graveyard'))pts.push('Opera desde el cementerio');
  if(t.includes('whenever'))pts.push('Habilidades desencadenadas');
  if(!pts.length)pts.push(`Sinergiza con ${strat.name}`);
  return pts.slice(0,2).map(p=>`• ${p}.`).join(' ');
}

// PRECIOS — Scryfall precios en EUR (CardMarket) y USD (TCGPlayer)
// ═══════════════════════════════════════════════════════════
async function loadPrices(deck) {
  const allCards = [
    ...deck.commanders,
    ...deck.lands,
    ...Object.values(deck.sections).flat()
  ].filter(c => !c._basic);

  // Scryfall da precios en el objeto de cada carta que ya tenemos
  // Pero si no tienen precio (cartas básicas o sin datos), las ignoramos
  const priceData = [];
  let totalEur = 0, totalUsd = 0, count = 0;

  allCards.forEach(card => {
    const eur = parseFloat(card.prices?.eur || card.prices?.eur_foil || '0') || 0;
    const usd = parseFloat(card.prices?.usd || card.prices?.usd_foil || '0') || 0;
    if (eur > 0 || usd > 0) {
      priceData.push({ name: card.name, eur, usd, avg: ((eur + (usd * 0.92)) / 2) });
      totalEur += eur;
      totalUsd += usd;
      count++;
    }
  });

  // Si muchas cartas no tienen precio, hacer fetch adicional por ID
  const missing = allCards.filter(c => !c.prices && c.id && c.id.length > 10);
  if (missing.length > 0 && missing.length <= 20) {
    const fetched = await Promise.allSettled(
      missing.slice(0, 15).map(c =>
        fetch(`${SF}/cards/${c.id}`).then(r => r.ok ? r.json() : null).catch(() => null)
      )
    );
    fetched.forEach((res, i) => {
      if (res.status === 'fulfilled' && res.value) {
        const card = res.value;
        const eur = parseFloat(card.prices?.eur || '0') || 0;
        const usd = parseFloat(card.prices?.usd || '0') || 0;
        if (eur > 0 || usd > 0) {
          priceData.push({ name: card.name, eur, usd, avg: ((eur + (usd * 0.92)) / 2) });
          totalEur += eur; totalUsd += usd; count++;
        }
      }
    });
  }

  priceData.sort((a, b) => b.avg - a.avg);
  const avgTotal = ((totalEur + (totalUsd * 0.92)) / 2);

  // Render
  const loadEl = document.getElementById('pp-loading');
  const listEl = document.getElementById('pp-list');
  const totalEl = document.getElementById('pp-total');
  const barEl = document.getElementById('pp-budget-bar');
  if (!loadEl || !listEl) return;

  loadEl.style.display = 'none';
  listEl.style.display = 'block';

  // Total
  totalEl.textContent = avgTotal > 0 ? `~${avgTotal.toFixed(0)}€` : 'Sin datos';

  // Barra de presupuesto por rangos
  const cheap = priceData.filter(c => c.avg < 1).length;
  const mid   = priceData.filter(c => c.avg >= 1 && c.avg < 10).length;
  const exp   = priceData.filter(c => c.avg >= 10).length;
  const tot   = priceData.length || 1;
  barEl.innerHTML = `
    <div style="width:${(cheap/tot*100).toFixed(0)}%;background:#4caf7d" title="< 1€: ${cheap} cartas"></div>
    <div style="width:${(mid/tot*100).toFixed(0)}%;background:#d4a843" title="1-10€: ${mid} cartas"></div>
    <div style="width:${(exp/tot*100).toFixed(0)}%;background:#e05555" title="> 10€: ${exp} cartas"></div>`;

  // Leyenda de colores
  barEl.insertAdjacentHTML('afterend', `
    <div style="display:flex;gap:10px;font-size:10px;color:var(--text3);margin-bottom:10px">
      <span><span style="display:inline-block;width:8px;height:8px;background:#4caf7d;border-radius:50%;margin-right:3px"></span>< 1€ (${cheap})</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#d4a843;border-radius:50%;margin-right:3px"></span>1-10€ (${mid})</span>
      <span><span style="display:inline-block;width:8px;height:8px;background:#e05555;border-radius:50%;margin-right:3px"></span>> 10€ (${exp})</span>
    </div>`);

  if (!priceData.length) {
    listEl.innerHTML = '<div style="color:var(--text3);font-size:11px">Sin datos de precio disponibles. Asegúrate de buscar cartas con nombre exacto.</div>';
    return;
  }

  listEl.innerHTML = `
    <div style="display:flex;gap:4px;font-size:10px;color:var(--text3);padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:4px">
      <span style="flex:1">Carta</span>
      <span style="min-width:52px;text-align:right;color:#4a9edd">CM (€)</span>
      <span style="min-width:52px;text-align:right;color:#4caf7d">TCP ($)</span>
      <span style="min-width:52px;text-align:right;color:var(--gold)">Media</span>
    </div>
    ${priceData.map(p => {
      const col = p.avg < 1 ? '#4caf7d' : p.avg < 10 ? '#d4a843' : '#e05555';
      return `<div class="price-row">
        <div class="pr-dot" style="background:${col}"></div>
        <span class="pr-name">${p.name}</span>
        <span class="pr-cm">${p.eur > 0 ? p.eur.toFixed(2)+'€' : '—'}</span>
        <span class="pr-usd">${p.usd > 0 ? '$'+p.usd.toFixed(2) : '—'}</span>
        <span class="pr-avg">${p.avg > 0 ? '~'+p.avg.toFixed(2)+'€' : '—'}</span>
      </div>`;
    }).join('')}
    <div style="text-align:right;padding-top:8px;font-size:11px;border-top:1px solid var(--border)">
      <span style="color:var(--text2)">CardMarket total: </span><span style="color:#4a9edd;font-weight:700">${totalEur.toFixed(0)}€</span>
      &nbsp;&nbsp;
      <span style="color:var(--text2)">TCGPlayer total: </span><span style="color:#4caf7d;font-weight:700">$${totalUsd.toFixed(0)}</span>
    </div>`;
}

// INDISPENSABLES — top cartas de EDHREC para este comandante
// ═══════════════════════════════════════════════════════════
async function loadMustHave(deck) {
  const cmdName = deck.commanders[0]?.name || '';
  const loadEl = document.getElementById('must-loading');
  const gridEl = document.getElementById('must-grid');
  if (!loadEl || !gridEl) return;

  const edhList = await fetchEdhrecForCommander(cmdName);

  if (!edhList.length) {
    loadEl.textContent = 'No se encontraron datos de EDHREC para este comandante.';
    return;
  }

  // Top 16 cartas más jugadas con este comandante
  const top = edhList
    .filter(c => c.name)
    .sort((a, b) => (b.num_decks || b.inclusion || 0) - (a.num_decks || a.inclusion || 0))
    .slice(0, 16);

  // Obtener imágenes de Scryfall para estas cartas
  const cardDetails = {};
  for (let i = 0; i < top.length; i += 6) {
    const batch = top.slice(i, i + 6);
    const nameQ = batch.map(c => `!"${c.name}"`).join(' OR ');
    const r = await sfQ(`(${nameQ}) -is:extra`);
    r.forEach(card => { cardDetails[card.name.toLowerCase()] = card; });
  }

  // Verificar cuáles ya están en el mazo
  const inDeck = new Set([
    ...deck.commanders,
    ...deck.lands,
    ...Object.values(deck.sections).flat()
  ].map(c => c.name?.toLowerCase()));

  loadEl.style.display = 'none';
  gridEl.style.display = 'grid';
  gridEl.innerHTML = '';

  top.forEach(item => {
    const card = cardDetails[item.name?.toLowerCase()];
    const img = card?.image_uris?.normal || card?.card_faces?.[0]?.image_uris?.normal || '';
    const pct = item.inclusion ? `${item.inclusion}%` : item.num_decks ? `${item.num_decks.toLocaleString()} mazos` : '';
    const alreadyIn = inDeck.has(item.name?.toLowerCase());
    const el = document.createElement('div');
    el.className = 'must-card' + (alreadyIn ? ' in-deck' : '');
    el.id = 'must-' + (item.name||'').replace(/[^a-z0-9]/gi,'_');
    el.innerHTML = `
      <span class="must-in-badge">✓ En el mazo</span>
      ${img ? `<img src="${img}" alt="${item.name}" loading="lazy">` : `<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:28px">🃏</div>`}
      ${!alreadyIn ? `<div class="must-add" onclick="addMustCard('${(item.name||'').replace(/'/g,"\\'")}')">+ Añadir al mazo</div>` : ''}
      <div class="mc-info">
        <div class="mc-name">${item.name}</div>
        <div class="mc-pct">${pct}</div>
      </div>`;
    el.addEventListener('mouseenter', e => showZ(e, img, item.name, card?.oracle_text || card?.card_faces?.[0]?.oracle_text || ''));
    el.addEventListener('mouseleave', hideZ);
    gridEl.appendChild(el);
  });
}

async function addMustCard(cardName) {
  // Buscar la carta y añadirla al mazo actual
  const r = await sfQ(`!"${cardName}" -is:extra`);
  if (!r.length) return;
  const card = r[0];
  // Determinar en qué sección va
  const t = (card.type_line||'').toLowerCase();
  const sid = t.includes('creature') ? 'creatures'
    : t.includes('instant') || t.includes('sorcery') ? 'spells'
    : t.includes('artifact') ? 'artifacts'
    : t.includes('enchantment') ? 'enchants'
    : t.includes('land') ? 'lands' : 'creatures';

  if (!S.wk[sid]) S.wk[sid] = [];
  if (S.wk[sid].find(c => c.id === card.id || c.name === card.name)) return; // ya está

  S.wk[sid].push(card);
  // Marcar el deck actual
  if (S.deck) {
    if (t.includes('land')) S.deck.lands.push(card);
    else if (S.deck.sections[sid]) S.deck.sections[sid].push(card);
    S.deck.total++;
  }

  // Actualizar UI
  const el = document.getElementById('must-' + cardName.replace(/[^a-z0-9]/gi,'_'));
  if (el) {
    el.classList.add('in-deck');
    const addBtn = el.querySelector('.must-add');
    if (addBtn) addBtn.style.display = 'none';
    const badge = el.querySelector('.must-in-badge');
    if (badge) badge.style.display = 'block';
  }
}

// COMBOS — Commander Spellbook API
// ═══════════════════════════════════════════════════════════
async function loadCombos(deck) {
  const ci = S._ci || [];
  const colorStr = ci.join('') || 'WUBRG';
  const loadEl = document.getElementById('combo-loading');
  const listEl = document.getElementById('combo-list');
  if (!loadEl || !listEl) return;

  let combos = [];

  // URLs a intentar en orden (backend.commanderspellbook.com es la API oficial actual)
  const endpoints = [
    // API oficial v4 — backend
    `https://backend.commanderspellbook.com/variants/?q=coloridentity%3C%3D${colorStr}&limit=200&ordering=-popularity`,
    // Alias sin ordering
    `https://backend.commanderspellbook.com/variants/?q=coloridentity%3C%3D${colorStr}&limit=200`,
    // Nombre alternativo de parámetro
    `https://backend.commanderspellbook.com/variants/?coloridentity=${colorStr}&limit=200`,
  ];

  for (const url of endpoints) {
    try {
      const r = await fetch(url, { headers: { 'Accept': 'application/json' } });
      if (!r.ok) continue;
      const d = await r.json();
      const raw = d.results || d.variants || d.data || [];
      if (raw.length > 0) { combos = raw; break; }
    } catch(e) { continue; }
  }

  if (!combos.length) {
    loadEl.style.display = 'none';
    listEl.style.display = 'block';
    listEl.innerHTML = `<div style="color:var(--text3);font-size:12px;padding:8px">
      No se encontraron combos disponibles para los colores ${colorStr}.<br>
      <a href="https://commanderspellbook.com/?q=coloridentity%3C%3D${colorStr}" target="_blank" style="color:var(--blue)">
        Ver combos en Commander Spellbook →
      </a>
    </div>`;
    return;
  }

  // Normalizar estructura — la API puede devolver campos distintos según versión
  const normalizeCombo = (combo) => {
    // Cartas: puede estar en uses[].card.name o en cards[]
    let cardNames = [];
    if (combo.uses && combo.uses.length) {
      cardNames = combo.uses
        .map(u => u.card?.name || u.template?.name || u.name || '')
        .filter(Boolean);
    } else if (combo.cards) {
      cardNames = combo.cards.map(c => c.name || c).filter(Boolean);
    }

    // Resultado del combo: produces[].feature.name o results[]
    let produces = '';
    if (combo.produces && combo.produces.length) {
      produces = combo.produces.map(p => p.feature?.name || p.name || '').filter(Boolean).join(' · ');
    } else if (combo.results) {
      produces = Array.isArray(combo.results)
        ? combo.results.map(r => r.name || r).join(' · ')
        : String(combo.results);
    }

    // Pasos/descripción
    const steps = combo.description || combo.steps || combo.otherPrerequisites || '';

    return { ...combo, _cardNames: cardNames, _produces: produces, _steps: steps };
  };

  const normalized = combos.map(normalizeCombo).filter(c => c._cardNames.length >= 2);

  // Cartas del mazo para puntuar cuántas ya tiene el jugador
  const deckCardNames = new Set([
    ...deck.commanders,
    ...deck.lands,
    ...Object.values(deck.sections).flat()
  ].map(c => (c.name||'').toLowerCase()));

  const scored = normalized.map(combo => {
    const names = combo._cardNames.map(n => n.toLowerCase());
    const inDeck = names.filter(n => deckCardNames.has(n)).length;
    const total = names.length;
    return { ...combo, _inDeck: inDeck, _total: total, _pct: total > 0 ? inDeck/total : 0 };
  });

  scored.sort((a, b) => {
    // Primero los combos con más cartas ya en el mazo
    if (b._pct !== a._pct) return b._pct - a._pct;
    // Luego los combos más cortos (2-3 piezas)
    return a._total - b._total;
  });

  const top = scored.slice(0, 25);

  loadEl.style.display = 'none';
  listEl.style.display = 'block';

  if (!top.length) {
    listEl.innerHTML = '<div style="color:var(--text3);font-size:12px">No se encontraron combos para estos colores.</div>';
    return;
  }

  // Precargar imágenes de las cartas de los combos
  const allComboCardNames = [...new Set(top.flatMap(combo => combo._cardNames))];
  const comboCardImgs = {};
  for (let i = 0; i < Math.min(allComboCardNames.length, 80); i += 8) {
    const batch = allComboCardNames.slice(i, i+8);
    const q = batch.map(n => `!"${n}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => {
      comboCardImgs[card.name.toLowerCase()] = card.image_uris?.small || card.card_faces?.[0]?.image_uris?.small || '';
    });
  }

  listEl.innerHTML = '';

  top.forEach((combo, idx) => {
    const cardNames = combo._cardNames;
    const produces = combo._produces;
    const steps = combo._steps;
    const missing = cardNames.filter(n => !deckCardNames.has(n.toLowerCase()));
    const alreadyAdded = combo._added || false;

    const div = document.createElement('div');
    div.className = 'combo-item';
    div.id = 'combo-' + idx;

    div.innerHTML = `
      <div class="combo-top">
        <div style="flex:1;min-width:0">
          <div class="combo-produces">♾️ ${produces || 'Combo infinito'}</div>
          <div class="combo-cards">
            ${cardNames.map(n => {
              const img = comboCardImgs[n.toLowerCase()] || '';
              const inD = deckCardNames.has(n.toLowerCase());
              return `<span class="combo-card-chip" style="${inD ? 'border-color:rgba(76,175,125,.4);color:var(--green)' : ''}"
                onmouseenter="showZByName(event,'${n.replace(/'/g,"\\'")}','${img}')" onmouseleave="hideZ()">
                ${img ? `<img src="${img}" alt="${n}">` : ''}
                ${n}${inD ? ' ✓' : ''}
              </span>`;
            }).join('')}
          </div>
          ${missing.length > 0
            ? `<div class="combo-missing">Faltan: <span>${missing.join(', ')}</span></div>`
            : '<div style="font-size:10px;color:var(--green);margin-bottom:4px">✓ Todas las cartas ya están en tu mazo</div>'
          }
        </div>
        <button class="btn-add-combo ${alreadyAdded ? 'added' : ''}" onclick="addCombo(${idx})">
          ${alreadyAdded ? '✓ Añadido' : missing.length === 0 ? '✓ Completo' : '+ Añadir combo'}
        </button>
      </div>
      ${steps ? `<div class="combo-steps"><strong style="color:var(--text2)">Cómo funciona:</strong><br>${steps.slice(0,400)}${steps.length>400?'…':''}</div>` : ''}`;

    listEl.appendChild(div);
  });

  window._combosData = { top, comboCardImgs };
}

async function addCombo(idx) {
  if (!window._combosData) return;
  const combo = window._combosData.top[idx];
  if (!combo) return;
  const uses = combo.uses || [];
  const cardNames = uses.map(u => u.card?.name || u.name || '').filter(Boolean);
  const deckCardNames = new Set([
    ...S.deck.commanders,
    ...S.deck.lands,
    ...Object.values(S.deck.sections).flat()
  ].map(c => (c.name||'').toLowerCase()));
  const missing = cardNames.filter(n => !deckCardNames.has(n.toLowerCase()));

  // Buscar cartas que faltan y añadirlas a sus secciones
  for (const name of missing) {
    const r = await sfQ(`!"${name}" -is:extra`);
    if (!r.length) continue;
    const card = r[0];
    const t = (card.type_line||'').toLowerCase();
    const sid = t.includes('creature') ? 'creatures'
      : t.includes('instant') || t.includes('sorcery') ? 'spells'
      : t.includes('artifact') ? 'artifacts'
      : t.includes('enchantment') ? 'enchants'
      : t.includes('land') ? 'lands' : 'creatures';
    if (!S.wk[sid]) S.wk[sid] = [];
    if (!S.wk[sid].find(c => c.id === card.id)) {
      S.wk[sid].push(card);
      if (S.deck) {
        if (t.includes('land')) S.deck.lands.push(card);
        else if (S.deck.sections[sid]) S.deck.sections[sid].push(card);
        S.deck.total++;
      }
    }
  }

  // Marcar combo como añadido
  window._combosData.top[idx]._added = true;
  const btn = document.querySelector(`#combo-${idx} .btn-add-combo`);
  if (btn) { btn.textContent = '✓ Añadido'; btn.classList.add('added'); }
}

async function showZByName(e, name, imgUrl) {
  // If we have cached data, use it; otherwise fetch
  if(zCache[name]){
    const d = zCache[name];
    showZ(e, d.i||imgUrl, name, d.o||'');
  } else {
    showZ(e, imgUrl, name, ''); // Show immediately with img, load oracle async
  }
}

</script>

<script>
// ═══════════════════════════════════════════════════════════
// PWA: Manifest + Service Worker (inline, no server needed)
// ═══════════════════════════════════════════════════════════
(function(){
  // Inyectar manifest como blob si no hay manifest.json externo
  const manifest = {
    name: "Commander Deck Builder",
    short_name: "CMD Builder",
    description: "Constructor de mazos de Commander MTG con EDHREC e IA",
    start_url: "./",
    display: "standalone",
    background_color: "#04030c",
    theme_color: "#04030c",
    orientation: "portrait-primary",
    icons: [
      {
        src: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%2304030c'/><text y='340' x='50%' text-anchor='middle' font-size='320' font-family='serif'>⚔️</text></svg>`),
        sizes: "512x512",
        type: "image/svg+xml",
        purpose: "any maskable"
      }
    ],
    categories: ["games", "utilities"]
  };

  try {
    const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    // Sólo si no hay ya un manifest externo
    if(!document.querySelector('link[rel="manifest"]')) {
      const link = document.createElement('link');
      link.rel = 'manifest'; link.href = url;
      document.head.appendChild(link);
    } else {
      // Actualizar el href del manifest existente con el blob
      document.querySelector('link[rel="manifest"]').href = url;
    }
  } catch(e){}

  // Service Worker inline (cache de la propia página)
  if('serviceWorker' in navigator){
    const swCode = `
const CACHE = 'cmd-builder-v1';
const SELF_URL = self.location.href;
self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE).then(c => c.add(SELF_URL)).catch(()=>{})
  );
  self.skipWaiting();
});
self.addEventListener('activate', e => {
  e.waitUntil(caches.keys().then(keys =>
    Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))
  ));
  self.clients.claim();
});
self.addEventListener('fetch', e => {
  // Cache-first para el propio HTML
  if(e.request.mode === 'navigate'){
    e.respondWith(
      caches.match(e.request).then(r => r || fetch(e.request).then(res => {
        const clone = res.clone();
        caches.open(CACHE).then(c => c.put(e.request, clone));
        return res;
      })).catch(() => caches.match(SELF_URL))
    );
    return;
  }
  // Network-first para APIs externas (Scryfall, EDHREC)
  if(e.request.url.includes('scryfall') || e.request.url.includes('edhrec') || e.request.url.includes('anthropic')){
    e.respondWith(fetch(e.request).catch(()=>new Response('',{status:503})));
    return;
  }
});
`;
    try {
      const swBlob = new Blob([swCode], {type:'text/javascript'});
      const swUrl = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl, {scope:'./'})
        .then(()=>console.log('CMD Builder: SW registrado'))
        .catch(()=>{});
    } catch(e){}
  }

  // Banner "Añadir a pantalla de inicio" en iOS Safari (no hay beforeinstallprompt)
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandalone = window.navigator.standalone === true;
  if(isIOS && !isInStandalone && !localStorage.getItem('pwa-ios-dismissed')){
    setTimeout(()=>{
      const banner = document.createElement('div');
      banner.id = 'pwa-ios-banner';
      banner.innerHTML = `<div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(8,6,20,.97);backdrop-filter:blur(16px);border-top:1px solid rgba(212,168,67,.3);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;animation:fadeUp .3s ease">
        <div style="font-size:28px">⚔️</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#eeeef8;margin-bottom:2px">Instalar en iPhone</div>
          <div style="font-size:11px;color:#9494b8;line-height:1.4">Pulsa <strong style="color:#d4a843">Compartir</strong> <span style="font-size:14px">⎙</span> y luego <strong style="color:#d4a843">Añadir a inicio</strong></div>
        </div>
        <button onclick="document.getElementById('pwa-ios-banner').remove();localStorage.setItem('pwa-ios-dismissed','1')" style="background:none;border:none;color:#9494b8;font-size:20px;cursor:pointer;padding:4px;line-height:1">✕</button>
      </div>`;
      document.body.appendChild(banner);
    }, 3000);
  }

  // Banner "Instalar" en Android/Chrome (beforeinstallprompt)
  let deferredPrompt;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    if(localStorage.getItem('pwa-installed')) return;
    setTimeout(()=>{
      const banner = document.createElement('div');
      banner.id = 'pwa-install-banner';
      banner.innerHTML = `<div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;background:rgba(8,6,20,.97);backdrop-filter:blur(16px);border-top:1px solid rgba(212,168,67,.3);padding:14px 16px;padding-bottom:max(14px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;animation:fadeUp .3s ease">
        <div style="font-size:28px">⚔️</div>
        <div style="flex:1">
          <div style="font-size:13px;font-weight:700;color:#eeeef8;margin-bottom:2px">Instalar app</div>
          <div style="font-size:11px;color:#9494b8">Añade Commander Builder a tu pantalla de inicio</div>
        </div>
        <button onclick="deferredPrompt.prompt();deferredPrompt.userChoice.then(r=>{if(r.outcome==='accepted')localStorage.setItem('pwa-installed','1');document.getElementById('pwa-install-banner')?.remove();})" style="background:linear-gradient(135deg,#b8881e,#e8c060);color:#120e00;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer">Instalar</button>
        <button onclick="document.getElementById('pwa-install-banner').remove()" style="background:none;border:none;color:#9494b8;font-size:20px;cursor:pointer;padding:4px;line-height:1">✕</button>
      </div>`;
      document.body.appendChild(banner);
    }, 3000);
  });
})();
</script>
