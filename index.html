let _wkEssCache = null;   // array de {name, num_decks, inclusion}
let _wkEssImgs  = {};     // name.toLowerCase() -> card data (con type_line, oracle_text, etc.)

// Detecta a qué sección del workshop pertenece una carta
function cardToSid(card){
  const t = (card.type_line||'').toLowerCase();
  if(t.includes('creature')) return 'creatures';
  if(t.includes('instant')||t.includes('sorcery')) return 'spells';
  if(t.includes('artifact') && !t.includes('creature')) return 'artifacts';
  if(t.includes('enchantment')) return 'enchants';
  if(t.includes('land')) return 'lands';
  // Si no está claro, heurística por oráculo
  const oracle = ((card.oracle_text||'')+(card.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  if((oracle.includes('search your library') && oracle.includes('land')) ||
     (oracle.includes('add') && oracle.includes('mana'))) return 'ramp';
  return 'spells';
}

// Carga las esenciales de EDHREC (llamada al entrar al workshop)
async function loadEssentialsSection() {
  const cmdName = S.cmdData?.name || '';
  if(!cmdName){ skipEssentials(); return; }

  _wkEssCache = await fetchEdhrecForCommander(cmdName);
  _wkEssCache = _wkEssCache
    .filter(c => c.name)
    .sort((a,b) => (b.num_decks||b.inclusion||0) - (a.num_decks||a.inclusion||0))
    .slice(0, 24);

  // Fetch card data de Scryfall para tener type_line, imágenes, oracle
  for(let i = 0; i < _wkEssCache.length; i += 6){
    const batch = _wkEssCache.slice(i, i+6);
    const q = batch.map(c => `!"${c.name}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => { _wkEssImgs[card.name.toLowerCase()] = card; });
  }

  // Si estamos viendo la sección essentials, renderizarla
  if(S.activeSec === 'essentials'){
    const right = document.getElementById('wkright');
    if(right) renderEssentialsSection(right);
  }
  renderLeft(); // actualizar sidebar
}

function skipEssentials(){
  S._essentialsDone = true;
  S.activeSec = 'lands';
  renderLeft();
  renderRight('lands');
}

// Renderiza la pantalla de esenciales
function renderEssentialsSection(right){
  if(!_wkEssCache){
    right.innerHTML=`<div style="padding:20px;text-align:center;color:var(--text3)"><span class="isp"></span> Cargando esenciales de EDHREC...</div>`;
    return;
  }
  if(!_wkEssCache.length){
    right.innerHTML=`<div style="padding:20px;text-align:center;color:var(--text3)">Sin datos de EDHREC para este comandante.</div>
      <button class="btn btn-p" onclick="skipEssentials()">Continuar a Tierras →</button>`;
    return;
  }

  // Agrupar por sección
  const groups = {creatures:[],spells:[],artifacts:[],enchants:[],ramp:[],lands:[]};
  const secMeta = {
    creatures:{name:'Criaturas',      icon:'🐉', col:'#d4a843'},
    spells:   {name:'Conjuros e Inst.',icon:'⚡', col:'#4a9edd'},
    artifacts:{name:'Artefactos',     icon:'⚙️', col:'#9b9bcc'},
    enchants: {name:'Encantamientos', icon:'✨', col:'#e07ac0'},
    ramp:     {name:'Ramp',           icon:'🌿', col:'#4caf7d'},
    lands:    {name:'Tierras',        icon:'🏔️', col:'#7a7a9a'},
  };

  _wkEssCache.forEach(item => {
    const card = _wkEssImgs[item.name?.toLowerCase()];
    if(!card) return;
    const sid = cardToSid(card);
    // ramp: si es criatura que da mana, va a ramp en vez de creatures
    const oracle = ((card.oracle_text||'')+(card.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
    const finalSid = (sid==='creatures' && oracle.includes('add') && oracle.includes('mana') && card.cmc<=3) ? 'ramp' : sid;
    if(groups[finalSid]) groups[finalSid].push({...item, _card:card, _sid:finalSid});
  });

  const cmdName = S.cmdData?.name || 'este comandante';
  right.innerHTML = `
    <div class="wk-title"><span>⭐</span>Esenciales EDHREC — ${cmdName}</div>
    <div class="wk-sub" style="margin-bottom:14px">Las cartas más jugadas con este comandante. Marca las que quieras incluir — se añadirán automáticamente a su categoría.</div>
    <div id="ess-section-groups"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)">
      <button class="btn btn-gold" onclick="proceedFromEssentials()">Continuar a Tierras →</button>
      <button class="btn btn-g btn-sm" onclick="addAllEssentialsAll()">+ Añadir todas</button>
    </div>`;

  const groupsEl = document.getElementById('ess-section-groups');

  Object.entries(groups).forEach(([sid, items]) => {
    if(!items.length) return;
    const meta = secMeta[sid];
    const tgt = getTarget(sid);
    const already = S.wk[sid]?.length || 0;

    const section = document.createElement('div');
    section.style.cssText = 'margin-bottom:16px';
    section.id = 'ess-group-' + sid;

    const addedInGroup = items.filter(item =>
      (S.wk[sid]||[]).some(c => c.name.toLowerCase() === item.name.toLowerCase())
    ).length;

    section.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <div style="font-size:12px;font-weight:700;color:${meta.col}">${meta.icon} ${meta.name}
          <span id="ess-cnt-${sid}" style="font-size:10px;font-weight:400;color:var(--text3);margin-left:6px">${already}/${tgt} en mazo · ${addedInGroup} de ${items.length} esenciales seleccionadas</span>
        </div>
        <button class="btn btn-xs" style="background:rgba(255,255,255,.05);color:var(--text2);border:1px solid var(--border2)" onclick="addAllEssGroup('${sid}')">+ Todas</button>
      </div>
      <div class="cpg" id="ess-cpg-${sid}" style="max-height:240px"></div>`;

    groupsEl.appendChild(section);
    renderEssGroupGrid(sid, items);
  });
}

function renderEssGroupGrid(sid, items){
  const grid = document.getElementById('ess-cpg-' + sid);
  if(!grid) return;
  grid.innerHTML = '';
  items.forEach(item => {
    const card = item._card;
    const img = card?.image_uris?.normal || card?.card_faces?.[0]?.image_uris?.normal || '';
    const pct = item.inclusion ? `${item.inclusion}%` : item.num_decks ? `${(item.num_decks/1000).toFixed(0)}k mazos` : '';
    const isIn = (S.wk[sid]||[]).some(c => c.name.toLowerCase() === item.name.toLowerCase());
    const el = document.createElement('div');
    el.className = 'cp' + (isIn ? ' picked' : '');
    el.id = 'essg-' + sid + '-' + item.name.replace(/[^a-z0-9]/gi,'_');
    el.innerHTML = `
      <div class="cp-ov">✓</div>
      ${isIn ? `<div class="cp-rm" onclick="event.stopPropagation();toggleEssCard('${sid}','${item.name.replace(/'/g,"\\'")}')">✕</div>` : ''}
      ${img ? `<img src="${img}" alt="${item.name}" loading="lazy">` : `<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px">🃏</div>`}
      <div class="cp-info">
        <div class="cp-name">${item.name}</div>
        <div class="cp-meta">${pct}</div>
      </div>`;
    el.addEventListener('mouseenter', e => showZ(e, img, item.name, card?.oracle_text || card?.card_faces?.[0]?.oracle_text || ''));
    el.addEventListener('mouseleave', hideZ);
    el.onclick = () => toggleEssCard(sid, item.name);
    grid.appendChild(el);
  });
}

function toggleEssCard(sid, cardName){
  const card = _wkEssImgs[cardName.toLowerCase()];
  if(!card) return;
  const w = S.wk[sid] || (S.wk[sid] = []);
  const idx = w.findIndex(c => c.name.toLowerCase() === cardName.toLowerCase());
  if(idx >= 0) w.splice(idx, 1); else w.push(card);
  // Refrescar solo el grupo afectado
  const groupItems = _wkEssCache
    .filter(item => _wkEssImgs[item.name?.toLowerCase()] && cardToSid(_wkEssImgs[item.name.toLowerCase()]) === sid)
    .map(item => ({...item, _card:_wkEssImgs[item.name.toLowerCase()], _sid:sid}));
  renderEssGroupGrid(sid, groupItems);
  updEssCnt(sid);
  updTotal();
  renderLeft();
}

function updEssCnt(sid){
  const el = document.getElementById('ess-cnt-' + sid);
  if(!el) return;
  const tgt = getTarget(sid);
  const already = S.wk[sid]?.length || 0;
  const groupItems = _wkEssCache.filter(item => {
    const card = _wkEssImgs[item.name?.toLowerCase()];
    return card && cardToSid(card) === sid;
  });
  const addedInGroup = groupItems.filter(item =>
    (S.wk[sid]||[]).some(c => c.name.toLowerCase() === item.name.toLowerCase())
  ).length;
  el.textContent = `${already}/${tgt} en mazo · ${addedInGroup} de ${groupItems.length} esenciales seleccionadas`;
}

function addAllEssGroup(sid){
  const items = _wkEssCache.filter(item => {
    const card = _wkEssImgs[item.name?.toLowerCase()];
    return card && cardToSid(card) === sid;
  });
  const w = S.wk[sid] || (S.wk[sid] = []);
  const picked = new Set(w.map(c => c.name.toLowerCase()));
  items.forEach(item => {
    const card = _wkEssImgs[item.name?.toLowerCase()];
    if(card && !picked.has(item.name.toLowerCase())){
      w.push(card); picked.add(item.name.toLowerCase());
    }
  });
  const groupItems = items.map(item => ({...item, _card:_wkEssImgs[item.name.toLowerCase()], _sid:sid}));
  renderEssGroupGrid(sid, groupItems);
  updEssCnt(sid);
  updTotal();
  renderLeft();
}

function addAllEssentialsAll(){
  Object.keys(S.wk).forEach(sid => addAllEssGroup(sid));
}

function proceedFromEssentials(){
  S._essentialsDone = true;
  S.activeSec = 'lands';
  renderLeft();
  renderRight('lands');
}

// Cuenta cuántas esenciales están añadidas en total (para sidebar)
function countEssentialsAdded(){
  if(!_wkEssCache) return 0;
  return _wkEssCache.filter(item => {
    const card = _wkEssImgs[item.name?.toLowerCase()];
    if(!card) return false;
    const sid = cardToSid(card);
    return (S.wk[sid]||[]).some(c => c.name.toLowerCase() === item.name.toLowerCase());
  }).length;
}

// Devuelve el total de tierras: especiales seleccionadas + básicas manuales
function getTotalLands(){
  const specials=S.wk['lands']?.length||0;
  const basics=Object.values(S.basicCounts).reduce((a,b)=>a+b,0);
  return specials+basics;
}

function adjBasic(col, delta){
  S.basicCounts[col]=Math.max(0,(S.basicCounts[col]||0)+delta);
  // Actualizar display
  const el=document.getElementById('bc-'+col);
  if(el) el.textContent=S.basicCounts[col];
  // Actualizar slot counter y sidebar
  const sec=WK_SECS.find(s=>s.id==='lands');
  const sc=document.querySelector('.slot-ctr');
  if(sc) sc.outerHTML=slotCtr(getTotalLands(),S.landCount,sec.col);
  renderLeft(); updTotal(); updLandBd();
}

function slotCtr(pk,tgt,col){
  const ov=pk>tgt; const pct=Math.min(100,Math.round((pk/tgt)*100));
  return `<div class="slot-ctr">
    <span class="slot-txt" style="color:${ov?'var(--red)':pk===tgt?'var(--green)':'var(--gold)'}">${pk}/${tgt}</span>
    <div class="slot-bar"><div class="slot-fill" style="width:${pct}%;background:${ov?'var(--red)':pk===tgt?'var(--green)':col}"></div></div>
    <span class="slot-tgt" style="color:${ov?'var(--red)':'var(--text3)'}">objetivo ${tgt}</span>
  </div>`;
}

function updLands(v){
  S.landCount=parseInt(v);
  document.getElementById('lnd-n').textContent=v;
  updLandBd();
  const sec=WK_SECS.find(s=>s.id==='lands');
  const sc=document.querySelector('.slot-ctr');
  if(sc) sc.outerHTML=slotCtr(getTotalLands(),S.landCount,sec.col);
  renderLeft(); updTotal();
}

// Calcula puntuación de sinergia de una carta con la estrategia y el comandante
function synergyScore(card, stratId, cmdOracleText){
  const txt = ((card.oracle_text||'')+(card.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  const cmdTxt = (cmdOracleText||'').toLowerCase();
  const typeLine = (card.type_line||'').toLowerCase();
  let sc = 0;

  // Bonus por rank EDHREC global (más popular = más probado)
  const rank = card.edhrec_rank || 9999;
  sc += Math.max(0, 3000 - rank) / 300; // hasta +10

  // Keywords por estrategia
  const stratKeys = {
    tokens:    ['token','create','populate','convoke','anthem','+1/+1 counter','go wide','create a'],
    ramp:      ['add','mana','search your library for','land','ramp','landfall','treasure'],
    control:   ['counter target','draw','flash','return target','destroy all','exile all','scry'],
    combo:     ['untap','infinite','whenever','each time','tap','add','copy','storm'],
    aggro:     ['haste','double strike','trample','first strike','menace','vigilance','attack','whenever attacks'],
    voltron:   ['equipment','equip','attach','equipped creature','aura','enchant creature','double strike','indestructible','protection from','shroud','hexproof','living weapon'],
    legendary: ['legendary','whenever a legendary','legendary creature','legendary artifact','historic','each time a legendary','hero'],
    reanimate: ['graveyard','dies','sacrifice','unearth','undying','reanimate','return from your graveyard','mill'],
    stax:      ["players can't",'opponents can','each player','spells cost','more to cast','enters the battlefield tapped'],
    spells:    ['magecraft','whenever you cast','instant or sorcery','prowess','copy','storm','cantrip'],
    artifacts: ['artifact enters','whenever an artifact','metalcraft','affinity','improvise','artifact creature','artifact token'],
  }[stratId] || [];
  stratKeys.forEach(kw => { if(txt.includes(kw) || typeLine.includes(kw)) sc += 3; });

  // Para estrategia legendaria: bonus extra a cartas legendarias
  if(stratId === 'legendary' || stratId === 'voltron'){
    if(typeLine.includes('legendary')) sc += 5;
    if(typeLine.includes('equipment')) sc += 4;
    if(txt.includes('equip') || txt.includes('attach')) sc += 3;
    if(txt.includes('indestructible') || txt.includes('hexproof') || txt.includes('shroud')) sc += 2;
  }

  // Coincidencias con habilidades del comandante
  const cmdKeys = ['whenever','trigger','each','draw','token','counter','sacrifice','graveyard','tap','untap','legendary','equip','attach'];
  cmdKeys.forEach(kw => { if(cmdTxt.includes(kw) && txt.includes(kw)) sc += 1.5; });

  // Bonus por ser staple (nombre en la lista de siempre-incluir)
  const staples = ['sol ring','arcane signet','command tower','cyclonic rift','swords to plowshares','path to exile',
    'counterspell','cultivate','kodama\'s reach','lightning greaves','swiftfoot boots','rhystic study','smothering tithe',
    'mystic remora','sylvan library','demonic tutor','vampiric tutor','mystical tutor','enlightened tutor',
    'tutored','mana crypt','chrome mox','mox diamond','dark ritual','cabal ritual','birds of paradise',
    'llanowar elves','elvish mystic','fyndhorn elves','rampant growth','farseek','nature\'s lore','three visits',
    'windfall','wheel of fortune','sensei\'s divining top','skullclamp','mind\'s eye','phyrexian arena',
    'eternal witness','reclamation sage','beast within','naturalize','krosan grip',
    'sword of','blackblade reforged','captain\'s claws','embercleave','hammer of nazahn',
    'blackblade reforged','whispersilk cloak','mask of avacyn','nim deathmantle'];
  if(staples.some(s => (card.name||'').toLowerCase().includes(s))) sc += 8;

  return sc;
}

async function sfQAll(q) {
  // Busca hasta 3 páginas para obtener más resultados
  let all = [];
  for(let page = 1; page <= 3; page++) {
    const r = await sfQ(q, page);
    if(!r.length) break;
    const seen = new Set(all.map(c=>c.id));
    for(const c of r) if(!seen.has(c.id)) all.push(c);
    if(r.length < 175) break; // página incompleta = última
  }
  return all;
}

async function fetchPool(sid){
  const ci = S._ci || [];
  const colorStr = ci.length ? ci.join('') : 'WUBRG';
  // IMPORTANTE: para tierras NO usar color<= porque excluye Command Tower, Mana Confluence, etc.
  // Para el resto, color<= sin legal:commander para máxima cobertura
  const cfColor = `color<=${colorStr} -is:extra -is:funny`;
  const cfColorLegal = `${cfColor} legal:commander`;
  // Para tierras: solo legalidad, sin filtro de color
  const cfLands = `-is:extra -is:funny legal:commander`;

  const br = S.bracket;
  const strat = getPrimaryStrategy();
  const cmdName = S.cmdData?.name || '';
  const cmdOracle = (S.cmdData?.oracle_text || S.cmdData?.card_faces?.map(f=>f.oracle_text).join(' ') || '').toLowerCase();

  // ── CAPA 1: EDHREC por comandante específico ─────────────────────────
  let edhrecCards = [];
  if(cmdName && sid !== 'lands') {
    const edhList = await fetchEdhrecForCommander(cmdName);
    if(edhList.length > 3) {
      const typeFilters = {
        ramp: '',  // ramp puede ser criatura, artefacto, conjuro — sin filtro de tipo
        creatures: 't:creature',
        spells: '(t:instant OR t:sorcery)',
        artifacts: 't:artifact',
        enchants: 't:enchantment'
      };
      const tf = typeFilters[sid] || '';
      const topNames = edhList.sort((a,b) => b.num_decks - a.num_decks).slice(0, 40).map(c => c.name);
      for(let i = 0; i < topNames.length; i += 6) {
        const batch = topNames.slice(i, i+6);
        const nameQ = batch.map(n => `!"${n}"`).join(' OR ');
        const q = tf ? `(${nameQ}) ${tf} -is:extra` : `(${nameQ}) -is:extra`;
        const r = await sfQ(q);
        const seen = new Set(edhrecCards.map(c=>c.id));
        for(const c of r) if(!seen.has(c.id)) edhrecCards.push({...c, _fromEdhrec:true});
      }
    }
  }

  // ── CAPA 2: Scryfall con múltiples queries amplias ────────────────────
  let sfCards = [];
  const addCards = async (...queries) => {
    for(const q of queries) {
      const r = await sfQAll(q);
      const seen = new Set(sfCards.map(c=>c.id));
      for(const c of r) if(!seen.has(c.id)) sfCards.push(c);
    }
  };

  if(sid === 'lands') {
    // Tierras SIN filtro de color — Command Tower, Mana Confluence, fetches, shocks, etc. son incoloras
    // Luego filtramos las que no sirven para estos colores manualmente
    await addCards(
      // Tierras multicolor / incoloras que van en cualquier mazo
      `t:land -t:basic ${cfLands} (o:"add" OR o:"enter" OR o:"tap" OR o:"untap")`,
      // Tierras de los colores del comandante específicamente
      ci.length ? `t:land -t:basic ${cfLands} (${ci.map(c=>`id:${c}`).join(' OR ')})` : `t:land -t:basic ${cfLands}`,
      // Fetches, shocks, duals — algunos de los más jugados
      `t:land -t:basic ${cfLands} (o:"search your library for" OR o:"pay 2 life" OR o:"add one mana of any")`,
      // Command Tower y similares
      `t:land -t:basic ${cfLands} (o:"any color" OR o:"any type of mana" OR o:"mana of any")`,
    );
    // Para tierras, filtrar que sean realmente útiles: tienen que tener edhrec_rank razonable
    // o ser conocidas staples (Command Tower, etc.)
    const landStaples = ['command tower','mana confluence','arcane sanctum','exotic orchard',
      'city of brass','reflecting pool','forbidden orchard','grand coliseum','vivid',
      'opulent palace','jungle shrine','savage lands','crumbling necropolis','seaside citadel'];
    sfCards = sfCards.filter(c => {
      const n = (c.name||'').toLowerCase();
      if(landStaples.some(s => n.includes(s))) return true;
      if(!c.edhrec_rank) return true;
      return c.edhrec_rank <= 8000;
    });

  } else if(sid === 'ramp') {
    // RAMP: artefactos de mana, conjuros de buscar tierras, criaturas que dan mana
    // Excluye encantamientos (van en su propia sección)
    await addCards(
      `t:artifact (o:"add" o:"mana") ${cfColorLegal} -t:creature -t:enchantment`,
      `t:artifact cmc=0 ${cfColorLegal} -t:creature`,
      `t:artifact cmc=1 ${cfColorLegal} -t:creature -t:enchantment`,
      `t:artifact cmc=2 (o:"add" OR o:"mana") ${cfColorLegal} -t:creature -t:enchantment`,
      `(t:sorcery OR t:instant) (o:"search your library for" o:"land") ${cfColorLegal}`,
      `(t:sorcery OR t:instant) (o:"add" o:"mana") ${cfColorLegal} -o:"counter target"`,
      `t:creature (o:"add" o:"mana" OR o:"search your library for" o:"land") ${cfColorLegal} cmc<=4`,
    );

  } else if(sid === 'creatures') {
    // CRIATURAS: usar sfQAll (3 páginas) para obtener suficientes candidatas
    // sin filtro de tipo artefacto para incluir criaturas artefacto también
    const cr1 = await sfQAll(`t:creature ${cfColorLegal}`);
    const cr2 = await sfQAll(`t:creature ${cfColorLegal} -t:artifact`);
    const seenCr = new Set(sfCards.map(c=>c.id));
    for(const c of [...cr1, ...cr2]) if(!seenCr.has(c.id)){ seenCr.add(c.id); sfCards.push(c); }
    // TRIBAL: si hay tribu activa, añadir criaturas del tipo con prioridad
    if (S.tribe) {
      const tribeCards = await sfQAll(`t:creature t:"${S.tribe}" ${cfColorLegal}`);
      const tribeCards2 = await sfQAll(`t:creature (o:"${S.tribe}") ${cfColorLegal}`);
      for(const c of [...tribeCards, ...tribeCards2]) if(!seenCr.has(c.id)){ seenCr.add(c.id); sfCards.unshift(c); }
    }
    // Extra por estrategia
    const extras = {
      tokens:    `t:creature (o:"create" o:"token" OR o:"populate" OR o:"convoke" OR o:"anthem") ${cfColorLegal}`,
      ramp:      `t:creature (o:"add" o:"mana" OR o:"search your library for" o:"land" OR o:"landfall") ${cfColorLegal}`,
      control:   `t:creature (o:"flash" OR o:"counter target" OR o:"draw" OR o:"enters the battlefield") ${cfColorLegal}`,
      combo:     `t:creature (o:"untap" OR o:"tap" o:"add" OR o:"whenever" o:"draw" OR o:"copy") ${cfColorLegal}`,
      aggro:     `t:creature (o:"haste" OR o:"double strike" OR o:"trample" OR o:"first strike" OR o:"menace") ${cfColorLegal}`,
      voltron:   `t:creature (o:"equip" OR o:"whenever equipped" OR o:"attach" OR o:"hexproof" OR o:"indestructible" OR o:"double strike") ${cfColorLegal}`,
      legendary: `t:creature t:legendary ${cfColorLegal}`,
      reanimate: `t:creature (o:"graveyard" OR o:"dies" OR o:"unearth" OR o:"undying" OR o:"persist") ${cfColorLegal}`,
      stax:      `t:creature (o:"each opponent" OR o:"players can't" OR o:"enters the battlefield" o:"tapped") ${cfColorLegal}`,
      spells:    `t:creature (o:magecraft OR o:"whenever you cast" OR o:"prowess" OR o:"storm") ${cfColorLegal}`,
    };
    if(extras[strat.id]) {
      const ex = await sfQAll(extras[strat.id]);
      for(const c of ex) if(!seenCr.has(c.id)){ seenCr.add(c.id); sfCards.push(c); }
    }
    // Para legendary matters: bonus de puntaje a criaturas legendarias
    if(strat.id === 'legendary' || strat.id === 'voltron'){
      sfCards = sfCards.map(c => {
        const isLeg = (c.type_line||'').toLowerCase().includes('legendary');
        return isLeg ? {...c, _legendaryBonus: 8} : c;
      });
    }

  } else if(sid === 'spells') {
    // CONJUROS E INSTANTÁNEOS: usar sfQAll para máxima cobertura
    const spellQueries = [
      // Interacción: removal, counterspells, barridos
      `(t:instant OR t:sorcery) (o:"counter target" OR o:"destroy target" OR o:"exile target") ${cfColorLegal}`,
      `(t:instant OR t:sorcery) (o:"destroy all" OR o:"exile all" OR o:"return all") ${cfColorLegal}`,
      // Draw de cartas
      `(t:instant OR t:sorcery) (o:"draw" o:"card") ${cfColorLegal} -o:"basic land"`,
      // Tutores
      `(t:instant OR t:sorcery) (o:"search your library") ${cfColorLegal} -o:"basic land" -o:"forest" -o:"island" -o:"swamp" -o:"mountain" -o:"plains"`,
      // Copiar/storm/extra turnos
      `(t:instant OR t:sorcery) (o:"copy target" OR o:"storm" OR o:"take an extra turn") ${cfColorLegal}`,
      // Conjuros baratos eficientes (no ramp)
      `(t:instant OR t:sorcery) ${cfColorLegal} cmc<=2 -o:"search your library for" -o:"add" -o:"mana pool"`,
    ];
    const seenSp = new Set(sfCards.map(c=>c.id));
    for(const q of spellQueries){
      const r = await sfQAll(q);
      for(const c of r) if(!seenSp.has(c.id)){ seenSp.add(c.id); sfCards.push(c); }
    }

  } else if(sid === 'artifacts') {
    // ARTEFACTOS: excluir las piezas de mana puro (ya están en ramp) y criaturas
    // También excluir artefactos que solo añaden mana (Sol Ring, Signet, etc. ya en ramp)
    await addCards(
      // Equipamiento — NUNCA es ramp, siempre va aquí
      `t:equipment ${cfColorLegal}`,
      // Artefactos de utilidad que no sean mana puro
      `t:artifact (o:"draw" o:"card") ${cfColorLegal} -t:creature -o:"add" -o:"mana"`,
      `t:artifact (o:"search your library") ${cfColorLegal} -t:creature -o:"basic land"`,
      `t:artifact (o:"whenever" OR o:"enters the battlefield") ${cfColorLegal} -t:creature -o:"add" -o:"mana"`,
      `t:artifact (o:"sacrifice") ${cfColorLegal} -t:creature`,
      // Artefactos generales populares que no sean piedras de mana simples
      `t:artifact ${cfColorLegal} -t:creature -o:"add" -o:"mana" cmc>=3`,
      // Artefactos de 2 CMC con habilidades (no mana stones simples)
      `t:artifact ${cfColorLegal} -t:creature cmc=2 (o:"draw" OR o:"search" OR o:"whenever" OR o:"counter")`,
    );
    // Para voltron/legendary: añadir artefactos legendarios y equipos específicos
    if(strat.id === 'voltron' || strat.id === 'legendary'){
      await addCards(
        `t:equipment t:legendary ${cfColorLegal}`,
        `t:artifact t:legendary ${cfColorLegal} -t:creature`,
        `t:equipment (o:"equipped creature" o:"double strike" OR o:"equipped creature" o:"indestructible" OR o:"equipped creature" o:"hexproof" OR o:"equipped creature" o:"trample") ${cfColorLegal}`,
      );
    }

  } else if(sid === 'enchants') {
    // ENCANTAMIENTOS: usar sfQAll para máxima cobertura
    const enchQueries = [
      `t:enchantment (o:"draw" o:"card") ${cfColorLegal} -t:artifact`,
      `t:enchantment (o:"whenever" o:"creature") ${cfColorLegal} -t:artifact`,
      `t:enchantment (o:"each" o:"upkeep" OR o:"each" o:"turn" OR o:"at the beginning") ${cfColorLegal} -t:artifact`,
      `t:enchantment (o:"+1/+1 counter" OR o:"token" OR o:"create") ${cfColorLegal} -t:artifact`,
      `t:enchantment (o:"search your library" OR o:"tutor") ${cfColorLegal} -t:artifact`,
      `t:enchantment (o:"double" OR o:"copy" OR o:"extra") ${cfColorLegal} -t:artifact`,
      `t:enchantment t:aura ${cfColorLegal}`,
      `t:enchantment t:saga ${cfColorLegal}`,
      `t:enchantment ${cfColorLegal} -t:artifact`,
    ];
    const seenEn = new Set(sfCards.map(c=>c.id));
    for(const q of enchQueries){
      const r = await sfQAll(q);
      for(const c of r) if(!seenEn.has(c.id)){ seenEn.add(c.id); sfCards.push(c); }
    }
  }

  // ── MERGE + SCORING ──────────────────────────────────────────────────
  const seen = new Set();     // por id
  const seenNames = new Set(); // por nombre (evita duplicados de distintas impresiones)
  const merged = [];

  // EDHREC del comandante: máxima prioridad
  for(const c of edhrecCards) {
    const name = (c.name||'').toLowerCase();
    if(!seen.has(c.id) && !seenNames.has(name)) {
      seen.add(c.id); seenNames.add(name);
      merged.push({...c, _prio: 3, _syn: synergyScore(c, strat.id, cmdOracle)});
    }
  }
  // Scryfall general
  for(const c of sfCards) {
    const name = (c.name||'').toLowerCase();
    if(!seen.has(c.id) && !seenNames.has(name)) {
      seen.add(c.id); seenNames.add(name);
      merged.push({...c, _prio: 1, _syn: synergyScore(c, strat.id, cmdOracle)});
    }
  }

  // Para tierras y ramp aplicar filtro de rank (calidad del pool es crítica)
  // Para criaturas/conjuros/encantamientos NO filtrar por rank — una carta con rank
  // alto puede ser perfecta para este comandante específico. La sinergia es el filtro real.
  const needsRankFilter = (sid === 'lands' || sid === 'ramp');
  const filtered = needsRankFilter ? merged.filter(c => isOK(c, br)) : merged;

  return filtered
    .sort((a, b) => {
      // Ordenar: primero EDHREC del comandante, luego por sinergia + bonus legendario, luego por rank global
      if(b._prio !== a._prio) return b._prio - a._prio;
      const synA = (a._syn||0) + (a._legendaryBonus||0);
      const synB = (b._syn||0) + (b._legendaryBonus||0);
      if(synB !== synA) return synB - synA;
      return (a.edhrec_rank||9999) - (b.edhrec_rank||9999);
    })
    .slice(0, 80);  // mostrar hasta 80 candidatas
}
function toEdhSlug(name){
  return (name||'').toLowerCase()
    .replace(/[',\.]/g,'')
    .replace(/\s+/g,'-')
    .replace(/[^a-z0-9\-]/g,'')
    .replace(/-+/g,'-');
}

// Carga las mejores cartas para el comandante desde EDHREC
async function fetchEdhrecForCommander(cmdName){
  const slug=toEdhSlug(cmdName);
  const urls=[
    `${EDHREC_BASE}/pages/commanders/${slug}.json`,
    `${EDHREC_BASE}/pages/commanders/${slug.replace(/-/g,'')}.json`,
  ];
  for(const url of urls){
    try{
      const r=await fetch(url,{headers:{'Accept':'application/json'}});
      if(!r.ok) continue;
      const d=await r.json();
      // Estructura EDHREC: container.json_dict.cardlists[].cardviews[]
      const cardlists=d?.container?.json_dict?.cardlists||d?.cardlists||[];
      const all=[];
      for(const list of cardlists){
        const views=list.cardviews||list.cards||[];
        for(const v of views){
          const name=v.name||v.names?.[0]||'';
          if(name) all.push({name, num_decks:v.num_decks||0, inclusion:v.inclusion||0});
        }
      }
      if(all.length>5) return all; // éxito
    }catch(e){}
  }
  return [];
}


function renderCands(sid){

  const pk=new Set((S.wk[sid]||[]).map(c=>c.id));
  if(!pool.length){grid.innerHTML='<div style="color:var(--text3);font-size:11px;padding:10px">Sin candidatas. Usa la búsqueda manual.</div>';return;}
  grid.innerHTML='';
  pool.forEach(c=>{
    const img=c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||'';
    const isPk=pk.has(c.id);
    const el=document.createElement('div');
    el.className='cp'+(isPk?' picked':''); el.id='cp-'+sid+'-'+c.id;
    const rk=c.edhrec_rank?`#${c.edhrec_rank.toLocaleString()}`:'';
    // Sinergia visual: alta >12, media >6, baja resto
    const syn=c._syn||0;
    const synBadge = syn>=12
      ? `<span style="position:absolute;top:4px;left:${isPk?'26px':'4px'};font-size:8px;padding:1px 4px;border-radius:4px;background:rgba(212,168,67,.9);color:#120e00;font-weight:700;z-index:3">★ Alta</span>`
      : syn>=6
      ? `<span style="position:absolute;top:4px;left:${isPk?'26px':'4px'};font-size:8px;padding:1px 4px;border-radius:4px;background:rgba(76,175,125,.8);color:#0a2012;font-weight:700;z-index:3">✓ Media</span>`
      : '';
    const edhBadge = c._fromEdhrec
      ? `<span style="position:absolute;top:4px;right:4px;font-size:7px;padding:1px 4px;border-radius:4px;background:rgba(124,92,191,.9);color:#fff;font-weight:700;z-index:3;${isPk?'display:none':''}">EDHREC</span>`
      : '';
    el.innerHTML=`<div class="cp-ov">✓</div>
      <div class="cp-rm" onclick="rmCard('${sid}','${c.id}',event)">✕</div>
      ${synBadge}${edhBadge}
      ${img?`<img src="${img}" alt="${c.name}" loading="lazy">`:`<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:26px">🃏</div>`}
      <div class="cp-info">
        <div class="cp-name">${c.name}</div>
        <div class="cp-meta">${rk}${c.mana_cost?' · '+c.mana_cost:''}</div>
      </div>`;
    el.addEventListener('mouseenter',e=>showZ(e,img,c.name,c.oracle_text||c.card_faces?.[0]?.oracle_text||''));
    el.addEventListener('mouseleave',hideZ);
    el.addEventListener('click',()=>togCard(sid,c,el));
    grid.appendChild(el);
  });
}

function togCard(sid,card,el){
  const w=S.wk; if(!w[sid]) w[sid]=[];
  const i=w[sid].findIndex(c=>c.id===card.id);
  if(i>=0){w[sid].splice(i,1);el.classList.remove('picked');}
  else{w[sid].push(card);el.classList.add('picked');}
  updCounters(sid);
}
function rmCard(sid,cid,ev){
  ev.stopPropagation();
  S.wk[sid]=S.wk[sid].filter(c=>c.id!==cid);
  document.getElementById('cp-'+sid+'-'+cid)?.classList.remove('picked');
  updCounters(sid);
}
function updCounters(sid){
  const sec=WK_SECS.find(s=>s.id===sid);
  const tgt=getTarget(sid);
  const pkCount=sid==='lands'?getTotalLands():(S.wk[sid]?.length||0);
  const sc=document.querySelector('.slot-ctr');

function addAll(sid){
  const pool = S.pools[sid] || [];
  if (!pool.length) return;
  const w = S.wk;
  if (!w[sid]) w[sid] = [];
  const target = getTarget(sid);
  const currentCount = w[sid].length;
  const canAdd = Math.max(0, target - currentCount);
  if (canAdd === 0) {
    // Ya llegamos al límite — avisar
    const hint = document.querySelector('.wk-sub');
    if (hint) {
      const orig = hint.textContent;
      hint.style.color = 'var(--gold)';
      hint.textContent = `⚠ Ya tienes ${currentCount}/${target} cartas en esta sección (límite alcanzado)`;
      setTimeout(() => { hint.style.color = ''; hint.textContent = orig; }, 2500);
    }
    return;
  }
  const pk = new Set(w[sid].map(c => c.id));
  // El pool ya está ordenado por sinergia (_syn) + EDHREC rank desde fetchPool
  // Añadir solo las que faltan hasta el target
  let added = 0;
  for (const card of pool) {
    if (added >= canAdd) break;
    if (!pk.has(card.id)) {
      w[sid].push(card);
      pk.add(card.id);
      document.getElementById('cp-' + sid + '-' + card.id)?.classList.add('picked');
      added++;
    }
  }
  updCounters(sid);
}

async function manSearch(sid){
  const el=document.getElementById('ms-'+sid);

  // Búsqueda por nombre: primero exacta, luego fuzzy
  let res=await sfQ(`"${q}"${typeFilter} ${cf}`);
  if(!res.length) res=await sfQ(`${q}${typeFilter} ${cf}`);

function addManual(sid,idx){

function finalize(){
  const cmd=S.cmdData; const partner=S.partnerData;
  const ci=S._ci||[];
  const usedIds=new Set([cmd.id,...(partner?[partner.id]:[])]);
  const addU=pool=>{const r=[];for(const c of pool){if(!usedIds.has(c.id)){usedIds.add(c.id);r.push(c);}}return r;};

  // Tierras especiales seleccionadas (no básicas)
  let landPool=addU([...S.wk.lands]);

  // Básicas manuales añadidas con los botones +/−
  const bm={W:'Plains',U:'Island',B:'Swamp',R:'Mountain',G:'Forest'};
  const basicImgMap={
    W:'https://cards.scryfall.io/normal/front/e/0/e0c9e93d-81a3-4f2e-a7b2-c8cb3b7d7936.jpg',
    U:'https://cards.scryfall.io/normal/front/4/d/4d8edc59-ab9c-4f74-aafd-90c3a5c9b46e.jpg',
    B:'https://cards.scryfall.io/normal/front/6/1/619b2d83-0e83-4f7b-8fa4-9a8a4fa3c4b8.jpg',
    R:'https://cards.scryfall.io/normal/front/b/a/bad5dab5-7e43-4c28-9a33-66b34f8a4fd9.jpg',
    G:'https://cards.scryfall.io/normal/front/6/2/62d4b0bf-2cc2-4c17-bfe0-32b9c3cfddaf.jpg'
  };
  Object.entries(S.basicCounts).forEach(([col,count])=>{
    for(let i=0;i<count;i++){
      landPool.push({
        id:`basic-${col}-${i}`,
        name:bm[col]||'Forest',
        type_line:'Basic Land',
        cmc:0, mana_cost:'', _basic:true,
        image_uris:{normal:basicImgMap[col]||''}
      });
    }
  });

  // Si aún faltan para llegar al target, rellenar con básicas de los colores del comandante
  const activeCols=ci.length?ci:['G'];
  let bi=0;
  while(landPool.length<S.landCount){
    const col=activeCols[bi%activeCols.length]; bi++;
    landPool.push({id:`bfill-${landPool.length}`,name:bm[col]||'Forest',type_line:'Basic Land',cmc:0,mana_cost:'',_basic:true,image_uris:{normal:basicImgMap[col]||''}});
  }
  landPool=landPool.slice(0,S.landCount);

  const deck={
    commanders:[cmd,...(partner?[partner]:[])],
    lands:landPool,
    sections:{
      ramp:addU([...S.wk.ramp]),
      creatures:addU([...S.wk.creatures]),
      spells:addU([...S.wk.spells]),
      artifacts:addU([...S.wk.artifacts]),
      enchants:addU([...S.wk.enchants])
    }
  };
  deck.total=deck.commanders.length+deck.lands.length+Object.values(deck.sections).reduce((a,b)=>a+b.length,0);
  // Rellenar hasta 100 si falta
  while(deck.total<100){
    const col=activeCols[deck.total%activeCols.length];
    deck.lands.push({id:'fill-'+deck.total,name:bm[col]||'Forest',type_line:'Basic Land',cmc:0,mana_cost:'',_basic:true});
    deck.total++;
  }
  S.deck=deck;
  renderDeck(deck);
}

// ═══════════════════════════════════════════════════════════
// CALCULAR POWER LEVEL REAL DEL MAZO (EDHPowerLevel)
// ═══════════════════════════════════════════════════════════
function calcPowerLevel(deck, allNL, avgCmc) {
  const allCards = [...deck.commanders, ...allNL];
  const oracleAll = allCards.map(c =>
    ((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase()
  ).join(' ');
  const names = allCards.map(c => (c.name||'').toLowerCase());
  const avgCmcNum = parseFloat(avgCmc) || 3.5;

  let score = 0;
  const factors = [];

  // ── CMC medio ────────────────────────────────────────────
  if (avgCmcNum <= 1.8) { score += 3; factors.push(`CMC medio muy bajo (${avgCmc}) — muy rápido`); }
  else if (avgCmcNum <= 2.4) { score += 2; factors.push(`CMC medio bajo (${avgCmc}) — ágil`); }
  else if (avgCmcNum <= 3.2) { score += 1; factors.push(`CMC medio moderado (${avgCmc})`); }
  else { factors.push(`CMC medio alto (${avgCmc}) — más lento`); }

  // ── Ramp y aceleración ───────────────────────────────────
  const rampCount = deck.sections.ramp.length;
  if (rampCount >= 12) { score += 2; factors.push(`Ramp abundante (${rampCount} piezas)`); }
  else if (rampCount >= 8) { score += 1; factors.push(`Ramp sólido (${rampCount} piezas)`); }

  // ── Tutores ───────────────────────────────────────────────
  const tutorCount = allCards.filter(c =>
    ((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase()
    .includes('search your library')
  ).length;
  if (tutorCount >= 5) { score += 3; factors.push(`Muchos tutores (${tutorCount}) — consistente`); }
  else if (tutorCount >= 3) { score += 2; factors.push(`Tutores presentes (${tutorCount})`); }
  else if (tutorCount >= 1) { score += 1; factors.push(`Pocos tutores (${tutorCount})`); }

  // ── Combos infinitos (texto de oráculo) ───────────────────
  const hasInfinite = oracleAll.includes('infinite') ||
    (oracleAll.includes('untap') && oracleAll.includes('add') && oracleAll.includes('mana'));
  if (hasInfinite) { score += 2; factors.push('Potencial de combo infinito detectado'); }

  // ── Contraespeles ─────────────────────────────────────────
  const counterCount = allCards.filter(c =>
    ((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase()
    .includes('counter target')
  ).length;
  if (counterCount >= 5) { score += 2; factors.push(`Alta interacción en pila (${counterCount} counterespeles)`); }
  else if (counterCount >= 2) { score += 1; factors.push(`Interacción en pila moderada (${counterCount})`); }

  // ── Cartas de EDHREC rank < 200 (los staples más poderosos) ──
  const topStaples = allCards.filter(c => c.edhrec_rank && c.edhrec_rank < 200).length;
  if (topStaples >= 10) { score += 2; factors.push(`Muchos staples de alto nivel (${topStaples})`); }
  else if (topStaples >= 5) { score += 1; factors.push(`Algunos staples poderosos (${topStaples})`); }

  // ── Barridos / Wipes ─────────────────────────────────────
  const wipeCount = allCards.filter(c =>
    ((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase()
    .match(/destroy all|exile all|each player sacrifices/)
  ).length;
  if (wipeCount >= 3) { score += 1; factors.push(`Control del tablero (${wipeCount} barridos)`); }

  // ── Mana 0 / Mox / Crypt ─────────────────────────────────
  const fastMana = allCards.filter(c => (c.cmc === 0 || c.cmc === 0.5) && c.type_line?.includes('Artifact')).length;
  if (fastMana >= 2) { score += 3; factors.push(`Mana rápido (${fastMana} artefactos de 0 mana) — muy poderoso`); }
  else if (fastMana >= 1) { score += 1; factors.push('Algo de mana rápido (0 cost artifact)'); }

  // ── Bracket seleccionado por el usuario como ajuste ──────
  const userBracket = S.bracket || 2;
  score += (userBracket - 1) * 0.6;

  // ── Mapear score a bracket 1-5 ───────────────────────────
  score = Math.min(10, Math.max(1, Math.round(score)));
  let bracket, name, desc, color, gradient;
  if (score <= 2) {
    bracket=1; name='Casual'; color='#4caf7d';
    desc='Mazo casual con pocas sinergias fuertes. Ideal para grupos relajados.';
    gradient='rgba(76,175,125,.08)';
  } else if (score <= 4) {
    bracket=2; name='Mejorado'; color='#4a9edd';
    desc='Mazo competente con buenas sinergias. Puede ganar consistentemente.';
    gradient='rgba(74,158,221,.08)';
  } else if (score <= 6) {
    bracket=3; name='Poderoso'; color='#d4a843';
    desc='Mazo potente con interacción fuerte y posibles combos. Apto para mesas competitivas.';
    gradient='rgba(212,168,67,.08)';
  } else if (score <= 8) {
    bracket=4; name='Optimizado'; color='#e05555';
    desc='Mazo de alto nivel. Combos explosivos, tutores y fuerte interacción.';
    gradient='rgba(224,85,85,.08)';
  } else {
    bracket=5; name='cEDH'; color='#c026d3';
    desc='Máximo poder. Mana de coste 0, combos de turno 1-3 y contraespeles masivos. Solo para mesas cEDH.';
    gradient='rgba(192,38,211,.08)';
  }

  return { score, bracket, name, desc, color, gradient, factors };
}

function p(a,b){return b?Math.round(a/b*100):0;}

function dsec(title,cards,col){
  if(!cards?.length) return '';
  // Agrupar tierras básicas por nombre para mostrar "6x Forest" en vez de 6 filas
  const grouped = [];
  const countMap = {};
  cards.forEach(c => {
    const key = c.name||'Forest';
    if(c._basic){
      if(!countMap[key]){ countMap[key]=0; grouped.push({...c,_qty:0,_isGrouped:true}); }
      countMap[key]++;
      const entry = grouped.find(x=>x._isGrouped&&x.name===key);
      if(entry) entry._qty = countMap[key];
    } else {
      grouped.push({...c,_qty:1});
    }
  });
  // Remove duplicate grouped entries
  const seen = new Set();
  const deduped = grouped.filter(c => {
    if(c._isGrouped){
      if(seen.has(c.name)) return false;
      seen.add(c.name); return true;
    }
    return true;
  });
  return `<div class="dsbox">
    <div class="dsh" style="color:${col}">${title}</div>
    ${deduped.map(c=>`<div class="dcr"
        data-name="${(c.name||'').replace(/"/g,'&quot;')}"
        data-img="${c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||''}"
        data-oracle="${(c.oracle_text||c.card_faces?.[0]?.oracle_text||'').replace(/"/g,'&quot;').replace(/\n/g,' ')}">
      <div class="dcr-dot" style="background:${col};opacity:.7"></div>
      <span class="dcr-q">${c._qty||1}x</span>
      <span class="dcr-n">${c.name||'Forest'}</span>
      <span class="dcr-m">${c.mana_cost||''}</span>
    </div>`).join('')}
  </div>`;
}

function showAnalysis(txt){
  const loadEl = document.getElementById('sa-loading');
  const bodyEl = document.getElementById('sa-body');
  if(loadEl) loadEl.style.display = 'none';
  if(bodyEl){
    bodyEl.style.display = 'block';
    // Renderizar markdown básico: ## headers y **bold**
    bodyEl.innerHTML = txt
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^## (.+)$/gm, '<div style="font-size:13px;font-weight:700;color:var(--gold);margin:14px 0 5px">$1</div>')
      .replace(/\*\*(.+?)\*\*/g, '<strong style="color:var(--text)">$1</strong>')
      .replace(/\n/g, '<br>');
  }
}

function buildLocalAnalysis(deck, strat, bdata){
  const cmds = deck.commanders;
  const allCards = [...Object.values(deck.sections).flat()];

  // Analizar texto de oráculo de cada carta para detectar patrones reales
  const analyzeCard = (c) => {
    const t = ((c.oracle_text||'') + (c.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
    return {
      name: c.name, cost: c.mana_cost||'', cmc: c.cmc||0, t,
      makesToken:     t.includes('create') && t.includes('token'),
      drawsCards:     t.includes('draw') && t.includes('card'),
      counters:       t.includes('counter target'),
      destroys:       t.includes('destroy target') || t.includes('exile target'),
      destroysAll:    t.includes('destroy all') || t.includes('exile all'),
      ramps:          (t.includes('add') && t.includes('mana')) || (t.includes('search') && t.includes('land')),
      graveyard:      t.includes('graveyard') || t.includes('dies') || t.includes('unearth'),
      loopsInfinite:  t.includes('untap') && (t.includes('add') || t.includes('draw')),
      triggerWhenever:t.includes('whenever'),
      haste:          t.includes('haste'),
      tutors:         t.includes('search your library'),
      protection:     t.includes('hexproof') || t.includes('indestructible') || t.includes('shroud'),
    };
  };

  const cmdOracle = analyzeCard(cmds[0]);
  const analyzed = allCards.map(analyzeCard);

  // Sinergias detectadas automáticamente
  const tokenMakers   = analyzed.filter(c => c.makesToken).slice(0,3);
  const drawers       = analyzed.filter(c => c.drawsCards).slice(0,3);
  const removal       = analyzed.filter(c => c.destroys || c.destroysAll).slice(0,4);
  const rampCards     = deck.sections.ramp.slice(0,4);
  const tutorCards    = analyzed.filter(c => c.tutors).slice(0,3);
  const loopCards     = analyzed.filter(c => c.loopsInfinite).slice(0,3);
  const triggerCards  = analyzed.filter(c => c.triggerWhenever).slice(0,4);
  const protectCards  = analyzed.filter(c => c.protection).slice(0,2);
  const creatureList  = deck.sections.creatures.slice(0,5).map(c=>c.name).join(', ');
  const earlyRamp     = rampCards.slice(0,3).map(c=>c.name).join(', ');

  let txt = '';

  txt += `## 1. VISIÓN GENERAL\n`;
  txt += `El mazo gira alrededor de **${cmds.map(c=>c.name).join(' y ')}` ;
  if(cmdOracle.makesToken)  txt += `, que genera tokens para construir una masa crítica`;
  if(cmdOracle.drawsCards)  txt += `, que genera ventaja de cartas constante`;
  if(cmdOracle.ramps)       txt += `, que acelera el desarrollo de mana`;
  if(cmdOracle.triggerWhenever) txt += `, cuyas habilidades desencadenadas crean valor acumulado`;
  txt += `**. La estrategia principal es **${strat.name}** en un entorno de bracket ${S.bracket} (${bdata.name}).\n\n`;

  txt += `## 2. PLAN DE JUEGO POR FASES\n`;
  txt += `**Turno 1-3 (Early):** ${earlyRamp ? `Desarrolla mana con **${earlyRamp}**` : 'Establece tu base de mana'}. `;
  if(tutorCards.length) txt += `Usa **${tutorCards[0].name}** para buscar piezas clave. `;
  txt += `Prioriza piezas de aceleración y establece presencia discreta.\n`;
  txt += `**Turno 4-6 (Mid):** ${cmds[0].cmc <= 4 ? `Juega a **${cmds[0].name}** (${cmds[0].mana_cost||''}) y activa su habilidad` : `Prepara el terreno antes de sacar a **${cmds[0].name}** (${cmds[0].mana_cost||''}) — es una carta de CMC alto`}. `;
  if(triggerCards.length) txt += `Establece **${triggerCards[0].name}** para generar valor cada turno. `;
  txt += `Mantén mana abierto para interactuar si es necesario.\n`;
  txt += `**Turno 7+ (Late):** ${loopCards.length ? `Ejecuta el loop con **${loopCards[0].name}** para ganar de forma explosiva.` : creatureList ? `Abruma con tus amenazas principales: **${creatureList}**.` : `Cierra con la ventaja acumulada.`}\n\n`;

  txt += `## 3. SINERGIAS CLAVE\n`;
  if(tokenMakers.length && cmdOracle.makesToken){
    txt += `**${cmds[0].name}** + **${tokenMakers[0].name}**: ambos generan tokens, creando una masa crítica que es difícil de gestionar para los rivales.\n`;
  }
  if(drawers.length && triggerCards.length){
    txt += `**${triggerCards[0].name}** + **${drawers[0].name}**: las habilidades desencadenadas generan recursos que el draw convierte en más acciones.\n`;
  }
  if(tutorCards.length && loopCards.length){
    txt += `**${tutorCards[0].name}** → **${loopCards[0].name}**: los tutores acortan el camino hasta las piezas de combo.\n`;
  }
  if(removal.length >= 2){
    txt += `**${removal[0].name}** + **${removal[1].name}**: suite de interacción para gestionar las amenazas más peligrosas de los rivales.\n`;
  }
  if(protectCards.length){
    txt += `**${protectCards[0].name}**: protege al comandante o piezas clave de la interacción rival.\n`;
  }
  if(!tokenMakers.length && !drawers.length){
    txt += `Explora las sinergias entre las criaturas y el comandante — las habilidades desencadenadas se potencian mutuamente.\n`;
  }
  txt += '\n';

  txt += `## 4. COMBOS Y RUTAS DE VICTORIA\n`;
  if(loopCards.length){
    txt += `**Combo detectado:** **${loopCards[0].name}** puede generar recursos ilimitados si se combina con las piezas correctas. Busca las condiciones para activar el loop y terminar la partida en ese mismo turno.\n`;
  } else {
    txt += `El mazo no tiene combo infinito detectado. La victoria llega por acumulación: genera más recursos que los rivales con **${strat.name}** hasta que la diferencia sea insalvable.\n`;
  }
  if(removal.filter(c=>c.destroysAll).length){
    txt += `**${removal.filter(c=>c.destroysAll)[0].name}** puede reiniciar el tablero y recuperar el control cuando estés en desventaja.\n`;
  }
  txt += '\n';

  txt += `## 5. CARTAS ESTRELLA\n`;
  const stars = [
    ...deck.sections.creatures.filter(c=>analyzeCard(c).drawsCards || analyzeCard(c).tutors),
    ...deck.sections.enchants.filter(c=>analyzeCard(c).drawsCards),
    ...deck.sections.artifacts.filter(c=>analyzeCard(c).drawsCards || analyzeCard(c).tutors),
    ...deck.sections.spells.filter(c=>analyzeCard(c).tutors || analyzeCard(c).destroysAll),
  ].slice(0,4);
  if(stars.length){
    stars.forEach(c => {
      const a = analyzeCard(c);
      const why = a.tutors ? 'busca cualquier pieza del mazo' : a.drawsCards ? 'genera ventaja de cartas constante' : a.destroysAll ? 'resetea el tablero' : 'pieza fundamental';
      txt += `**${c.name}**: ${why}.\n`;
    });
  } else {
    deck.sections.creatures.slice(0,3).forEach(c => txt += `**${c.name}**: criatura central de la estrategia.\n`);
  }
  txt += '\n';

  txt += `## 6. DEBILIDADES\n`;
  txt += `- **Interacción masiva**: si los rivales tienen muchos barridos o removal dirigido al comandante, puede ser difícil mantener presión.\n`;
  txt += `- **Velocidad**: el mazo tiene CMC medio de ${(allCards.reduce((a,c)=>a+(c.cmc||0),0)/Math.max(allCards.length,1)).toFixed(1)} — decks más agresivos pueden ganar antes de que despliegues tu plan.\n`;
  if(!removal.filter(c=>c.counters).length) txt += `- **Sin contraespeles**: el mazo tiene poca interacción en la pila, sé cuidadoso en mesa con mucho control.\n`;
  txt += '\n';

  txt += `## 7. MULLIGAN Y MANO IDEAL\n`;
  txt += `Busca: **3 tierras**, **1-2 piezas de ramp** (${earlyRamp||'aceleración de mana'}), y **1 carta de valor** (draw o tutor). `;
  txt += `Con esa base puedes comenzar a ejecutar el plan desde el turno 1. Haz mulligan si tienes menos de 3 tierras o ninguna pieza de aceleración.\n\n`;

  txt += `## 8. CONSEJOS AVANZADOS\n`;
  txt += `- No saques al comandante a menos que puedas aprovecharlo de inmediato o tengas protección.\n`;
  txt += `- Guarda al menos una respuesta para el turno en que alguien intente ganar — las mesas de Commander suelen decidirse en un único turno explosivo.\n`;
  if(loopCards.length) txt += `- El combo con **${loopCards[0].name}** es tu as en la manga — no lo reveles hasta tener todo listo.\n`;

  return txt;
}

          <div style="font-size:11px;font-weight:600;color:var(--gold);margin-bottom:6px">💰 Presupuesto total del mazo <span style="font-weight:400;color:var(--text3)">(opcional)</span></div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:10px">
            <div style="display:flex;align-items:center;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);overflow:hidden;flex:1">
              <span style="padding:6px 8px;font-size:12px;color:var(--text3);border-right:1px solid var(--border)">€</span>
              <input type="number" id="budget-input" min="10" max="5000" step="5"
                placeholder="Sin límite"
                value="${S.budget||''}"
                oninput="S.budget=this.value?parseFloat(this.value):null"
                style="flex:1;background:transparent;border:none;padding:6px 8px;color:var(--text);font-size:12px;outline:none;width:80px">
            </div>
          </div>
          <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">
            ${[20,50,100,200].map(v=>`<button onclick="setBudget(${v})" data-val="${v}" class="btn btn-xs budget-btn" style="background:rgba(212,168,67,.1);color:var(--gold);border:1px solid rgba(212,168,67,.25);transition:all .15s">${v}€</button>`).join('')}
            <button onclick="setBudget(null)" data-val="null" class="btn btn-xs btn-g budget-btn" style="transition:all .15s">Sin límite</button>
          </div>
          <button class="btn btn-gold" style="width:100%" onclick="buildAutomatic('${tribalMode || ''}')">⚡ Construir automáticamente</button>
        </div>
      </div>
    </div>

    <div class="nav">
      <button class="btn btn-g" onclick="goPanel(${S.mode==='scratch'?2:1})">← Cambiar comandante</button>
    </div>`;
}

function setBudget(val){
  S.budget = val;
  const inp = document.getElementById('budget-input');
  if(inp) inp.value = val || '';
  // Actualizar estado visual de los botones de presupuesto
  document.querySelectorAll('.budget-btn').forEach(b=>{
    const bv = b.dataset.val;
    const active = (val===null&&bv==='null')||(val!==null&&parseInt(bv)===val);
    b.style.background = active ? 'rgba(212,168,67,.35)' : 'rgba(212,168,67,.1)';
    b.style.borderColor = active ? 'var(--gold)' : 'rgba(212,168,67,.25)';
    b.style.fontWeight = active ? '700' : '';
  });
}

// ═══════════════════════════════════════════════════════════
// BUILD AUTOMÁTICO — EDHREC % inclusión + Scryfall
// ═══════════════════════════════════════════════════════════
async function buildAutomatic(tribalMode) {
  const cmd = S.cmdData; const partner = S.partnerData;
  if(!cmd){ alert('Selecciona un comandante primero.'); return; }
  const ci1 = cmd?.color_identity||[]; const ci2 = partner?.color_identity||[];
  S._ci = [...new Set([...ci1,...ci2])];
  S._cf = `color<=${S._ci.length?S._ci.join(''):'WUBRG'} legal:commander -is:extra -is:funny`;
  const strat = getPrimaryStrategy();
  const stratDisplay = (S.strategies?.length > 1)
    ? S.strategies.map(id=>{ const s=STRATEGIES.find(x=>x.id===id); return s?`${s.icon} ${s.name}`:''; }).join(' · ')
    : `${strat.icon} ${strat.name}`;
  const colorStr = S._ci.length ? S._ci.join('') : 'WUBRG';
  const cfLegal = `color<=${colorStr} legal:commander -is:extra -is:funny`;
  const budget = S.budget; // null = sin límite

  const cmdImg = cmd?.image_uris?.art_crop || cmd?.image_uris?.normal || '';

  document.getElementById('p3c').innerHTML = `
    <div class="auto-build-panel" id="abp">
      <div class="ab-header">
        ${cmdImg ? `<img src="${cmdImg}" class="ab-cmd-img">` : ''}
        <div>
          <div class="ab-title">Construyendo mazo de ${cmd.name}${partner?' + '+partner.name:''}</div>
          <div class="ab-sub">${stratDisplay} · Bracket ${S.bracket}${budget?` · 💰 Presupuesto: ${budget}€`:''}</div>
        </div>
      </div>
      <div class="ab-progress">
        <div class="ab-progress-bar"><div class="ab-progress-fill" id="ab-fill" style="width:0%"></div></div>
        <div class="ab-progress-txt" id="ab-pct">0%</div>
      </div>
      <div class="ab-sections">
        ${[
          {id:'lands',    name:'Tierras',       icon:'🏔️', target:S.landCount||36},
          {id:'ramp',     name:'Ramp',          icon:'🌿', target:getTarget('ramp')},
          {id:'creatures',name:'Criaturas',     icon:'🐉', target:getTarget('creatures')},
          {id:'spells',   name:'Conjuros',      icon:'⚡', target:getTarget('spells')},
          {id:'artifacts',name:'Artefactos',    icon:'⚙️', target:getTarget('artifacts')},
          {id:'enchants', name:'Encantamientos',icon:'✨', target:getTarget('enchants')},
        ].map(s => `<div class="ab-sec" id="abs-${s.id}">
          <div class="ab-sec-icon">${s.icon}</div>
          <div class="ab-sec-name">${s.name}</div>
          <div class="ab-sec-count" id="absc-${s.id}">0/${s.target}</div>
        </div>`).join('')}
      </div>
      <div class="ab-log" id="ab-log"></div>
    </div>`;

  const setProgress = (pct) => {
    document.getElementById('ab-fill').style.width = pct+'%';
    document.getElementById('ab-pct').textContent = Math.round(pct)+'%';
  };
  const secState = (id, state) => {
    const el = document.getElementById('abs-'+id);
    if (el) el.className = 'ab-sec ' + (state||'');
  };
  const secCount = (id, n, t) => {
    const el = document.getElementById('absc-'+id);
    if (el) el.textContent = n+'/'+t;
  };
  const log = (msg, done=true) => {
    const logEl = document.getElementById('ab-log');
    if (!logEl) return;
    const d = document.createElement('div');
    d.className = 'ab-log-line';
    d.innerHTML = done
      ? `<span class="check">✓</span><span>${msg}</span>`
      : `<div class="spin-xs"></div><span>${msg}</span>`;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    return d;
  };
  const updateLastLog = (msg) => {
    const logEl = document.getElementById('ab-log');
    if (!logEl) return;
    const lines = logEl.querySelectorAll('.ab-log-line');
    const last = lines[lines.length-1];
    if (last) last.innerHTML = `<span class="check">✓</span><span>${msg}</span>`;
  };

  // Reset estado
  S.wk = {lands:[],ramp:[],creatures:[],spells:[],artifacts:[],enchants:[]};
  S.basicCounts = {W:0,U:0,B:0,R:0,G:0};
  S.landCount = 36;
  _wkEssCache = null;
  _wkEssImgs  = {};
  calcTargets(); // targets dinámicos

  const usedIds = new Set([cmd.id, ...(partner?[partner.id]:[])]);
  const addUnique = (pool, max) => {
    const r = [];
    for (const c of pool) {
      if (r.length >= max) break;
      if (!usedIds.has(c.id)) { usedIds.add(c.id); r.push(c); }
    }
    return r;
  };

  // ── PASO 1: Cargar datos EDHREC del comandante ─────────────────────
  log(`Cargando datos de sinergia de EDHREC${budget?` · Presupuesto: ${budget}€`:''}...`, false);
  setProgress(5);

  const edhList = await fetchEdhrecForCommander(cmd.name);
  let edhByName = {};
  edhList.forEach(item => {
    if (item.name) edhByName[item.name.toLowerCase()] = {
      num_decks: item.num_decks || 0,
      inclusion: item.inclusion || 0,
    };
  });
  const edhCount = Object.keys(edhByName).length;
  updateLastLog(`EDHREC: ${edhCount} cartas con datos de sinergia para ${cmd.name}`);
  setProgress(15);

  // Función para puntuar una carta por sinergia EDHREC
  const edhScore = (card) => {
    const data = edhByName[(card.name||'').toLowerCase()];
    if (data) {
      // inclusion va de 0-100%, num_decks es número absoluto
      return data.inclusion > 0 ? data.inclusion : Math.min(data.num_decks / 100, 99);
    }
    // Sin datos EDHREC: usar rank global como proxy (invertido)
    const rank = card.edhrec_rank || 9999;
    return Math.max(0, 100 - rank/100);
  };

  // Budget is TOTAL deck price. Derive per-card ceiling to keep total under budget.
  // ~64 non-basic, non-commander slots. Ceiling = budget / 15 lets some pricier staples
  // through while blocking the most expensive cards (e.g. 200€ → 13€/card max).
  const perCardCeiling = budget ? budget / 15 : null;

  const cardPrice = (c) => {
    const eur = parseFloat(c.prices?.eur||'0')||0;
    const usd = parseFloat(c.prices?.usd||'0')||0;
    return eur > 0 ? eur : usd * 0.92;
  };

  const fetchAndScore = async (q) => {
    const cards = await sfQAll(q);
    return cards
      .filter(c => {
        if (usedIds.has(c.id)) return false;
        // Per-card ceiling derived from total budget
        if (perCardCeiling) {
          const price = cardPrice(c);
          if (price > 0 && price > perCardCeiling) return false;
        }
        return true;
      })
      .map(c => ({...c, _edh: edhScore(c)}))
      .sort((a,b) => b._edh - a._edh);
  };

  // ── PASO 2: TIERRAS ────────────────────────────────────────────────
  secState('lands', 'building');
  log('Seleccionando tierras (sinergia EDHREC)...', false);
  setProgress(20);

  // Tierras especiales por sinergia
  const landPool = await fetchAndScore(`t:land ${cfLegal} -t:basic`);
  const specialLands = addUnique(landPool, 22);

  // Básicas para llegar a 36
  const bm = {W:'Plains',U:'Island',B:'Swamp',R:'Mountain',G:'Forest'};
  const activeCols = S._ci.length ? S._ci : ['G'];
  const basicPerColor = Math.max(1, Math.floor((36 - specialLands.length) / activeCols.length));
  activeCols.forEach(col => { S.basicCounts[col] = basicPerColor; });
  // Ajustar para llegar exactamente a 36
  let totalBas = activeCols.length * basicPerColor;
  let bi = 0;
  while (totalBas + specialLands.length < 36) { S.basicCounts[activeCols[bi%activeCols.length]]++; totalBas++; bi++; }

  S.wk.lands = specialLands;
  S.landCount = 36;
  secState('lands', 'done');
  secCount('lands', 36, 36);
  updateLastLog(`Tierras: ${specialLands.length} especiales + ${totalBas} básicas`);
  setProgress(30);

  // ── PASO 3: RAMP ───────────────────────────────────────────────────
  secState('ramp', 'building');
  log('Seleccionando ramp por sinergia EDHREC...', false);

  const rampPools = await Promise.all([
    fetchAndScore(`t:artifact (o:"add" o:"mana") ${cfLegal} cmc<=3 -t:creature -t:enchantment`),
    fetchAndScore(`t:artifact cmc<=2 ${cfLegal} -t:creature`),
    fetchAndScore(`(o:"search your library for" o:"land") ${cfLegal} (t:sorcery OR t:instant OR t:creature)`),
  ]);
  const rampMerged = [];
  rampPools.flat().forEach(c => { if(!rampMerged.find(x=>x.id===c.id)) rampMerged.push(c); });
  rampMerged.sort((a,b) => b._edh - a._edh);
  S.wk.ramp = addUnique(rampMerged, getTarget('ramp'));
  secState('ramp', 'done'); secCount('ramp', S.wk.ramp.length, getTarget('ramp'));
  updateLastLog(`Ramp: ${S.wk.ramp.length} piezas (top por % inclusión EDHREC)`);
  setProgress(45);

  // ── PASO 4: CRIATURAS ──────────────────────────────────────────────
  secState('creatures', 'building');
  log('Seleccionando criaturas por sinergia EDHREC...', false);

  // Obtener criaturas de múltiples queries para máxima cobertura
  const creaturePage1 = await fetchAndScore(`t:creature ${cfLegal}`);
  const creaturePage2 = await fetchAndScore(`t:creature ${cfLegal} cmc<=4`);
  const creaturePage3 = await fetchAndScore(`t:creature ${cfLegal} cmc>=5`);
  const creaturePool = [];
  const seenCrAuto = new Set();
  for(const c of [...creaturePage1, ...creaturePage2, ...creaturePage3]){
    if(!seenCrAuto.has(c.id)){ seenCrAuto.add(c.id); creaturePool.push(c); }
  }
  // Si hay tribu, añadir bonus a criaturas del tipo al frente
  if (S.tribe) {
    const tribePool = await fetchAndScore(`t:creature t:"${S.tribe}" ${cfLegal}`);
    tribePool.forEach(c => { if(!seenCrAuto.has(c.id)){ seenCrAuto.add(c.id); creaturePool.unshift({...c, _edh: c._edh+10}); }});
  }
  // Para legendary matters y voltron: bonus a criaturas legendarias
  const stratId = getPrimaryStrategy()?.id || '';
  if(stratId === 'legendary' || stratId === 'voltron'){
    const legPool = await fetchAndScore(`t:creature t:legendary ${cfLegal}`);
    legPool.forEach(c => { if(!seenCrAuto.has(c.id)){ seenCrAuto.add(c.id); creaturePool.unshift({...c, _edh: c._edh+10}); }});
    // También subir puntuación de los legendarios ya en el pool
    creaturePool.forEach(c => {
      if((c.type_line||'').toLowerCase().includes('legendary')) c._edh = (c._edh||0) + 8;
    });
  }
  creaturePool.sort((a,b) => b._edh - a._edh);

  S.wk.creatures = addUnique(creaturePool, getTarget('creatures'));

  // Fallback: si el pool no era suficiente, buscar con queries más amplias sin filtros de sinergia
  const crTarget = getTarget('creatures');
  if (S.wk.creatures.length < crTarget) {
    const needed = crTarget - S.wk.creatures.length;
    const fallbackPool = await fetchAndScore(`t:creature ${cfLegal} -t:legendary`);
    const fallback2 = await fetchAndScore(`t:creature ${cfLegal} t:legendary`);
    for(const c of [...fallbackPool, ...fallback2]){
      if(!seenCrAuto.has(c.id)){ seenCrAuto.add(c.id); creaturePool.push(c); }
    }
    const extra = addUnique(creaturePool.filter(c => !S.wk.creatures.find(x=>x.id===c.id)), needed);
    extra.forEach(c => S.wk.creatures.push(c));
  }

  secState('creatures', 'done'); secCount('creatures', S.wk.creatures.length, crTarget);
  updateLastLog(`Criaturas: ${S.wk.creatures.length} seleccionadas`);
  setProgress(60);

  // ── PASO 5: CONJUROS E INSTANTÁNEOS ──────────────────────────────
  secState('spells', 'building');
  log('Seleccionando conjuros por sinergia EDHREC...', false);

  const spellQAuto = [
    `(t:instant OR t:sorcery) (o:"counter target" OR o:"destroy target" OR o:"exile target" OR o:"destroy all" OR o:"exile all") ${cfLegal}`,
    `(t:instant OR t:sorcery) (o:"draw" o:"card") ${cfLegal} -o:"basic land"`,
    `(t:instant OR t:sorcery) (o:"search your library") ${cfLegal} -o:"basic land"`,
    `(t:instant OR t:sorcery) ${cfLegal} cmc<=2`,
    `(t:instant OR t:sorcery) ${cfLegal} cmc<=4`,
  ];
  const spellMerged = [];
  const seenSpAuto = new Set();
  for(const q of spellQAuto){
    const r = await fetchAndScore(q);
    for(const c of r) if(!seenSpAuto.has(c.id)){ seenSpAuto.add(c.id); spellMerged.push(c); }
  }
  spellMerged.sort((a,b) => b._edh - a._edh);
  S.wk.spells = addUnique(spellMerged, getTarget('spells'));
  // Fallback conjuros: si no llega al target añadir cualquier instant/sorcery legal
  if (S.wk.spells.length < getTarget('spells')) {
    const spFallback = await fetchAndScore(`(t:instant OR t:sorcery) ${cfLegal}`);
    const spExtra = addUnique(spFallback.filter(c => !S.wk.spells.find(x=>x.id===c.id)), getTarget('spells') - S.wk.spells.length);
    spExtra.forEach(c => S.wk.spells.push(c));
  }
  secState('spells', 'done'); secCount('spells', S.wk.spells.length, getTarget('spells'));
  updateLastLog(`Conjuros: ${S.wk.spells.length} seleccionados`);
  setProgress(73);

  // ── PASO 6: ARTEFACTOS ────────────────────────────────────────────
  secState('artifacts', 'building');
  log('Seleccionando artefactos por sinergia EDHREC...', false);

  const artQAuto = [
    fetchAndScore(`t:equipment ${cfLegal}`),
    fetchAndScore(`t:artifact -t:creature -o:"add" -o:"mana" ${cfLegal} cmc>=2`),
    fetchAndScore(`t:artifact ${cfLegal} -t:creature`),
  ];
  const artPools = await Promise.all(artQAuto);
  const artMerged = [];
  const seenArAuto = new Set();
  artPools.flat().forEach(c => { if(!seenArAuto.has(c.id)){ seenArAuto.add(c.id); artMerged.push(c); }});
  artMerged.sort((a,b) => b._edh - a._edh);
  S.wk.artifacts = addUnique(artMerged, getTarget('artifacts'));
  // Fallback artefactos
  if (S.wk.artifacts.length < getTarget('artifacts')) {
    const arFallback = await fetchAndScore(`t:artifact ${cfLegal}`);
    const arExtra = addUnique(arFallback.filter(c => !S.wk.artifacts.find(x=>x.id===c.id)), getTarget('artifacts') - S.wk.artifacts.length);
    arExtra.forEach(c => S.wk.artifacts.push(c));
  }
  secState('artifacts', 'done'); secCount('artifacts', S.wk.artifacts.length, getTarget('artifacts'));
  updateLastLog(`Artefactos: ${S.wk.artifacts.length} seleccionados`);
  setProgress(85);

  // ── PASO 7: ENCANTAMIENTOS ────────────────────────────────────────
  secState('enchants', 'building');
  log('Seleccionando encantamientos por sinergia EDHREC...', false);

  const enchQAuto = [
    `t:enchantment (o:"draw" o:"card" OR o:"whenever" o:"creature" OR o:"each" o:"upkeep") ${cfLegal}`,
    `t:enchantment ${cfLegal} -t:artifact`,
    `t:enchantment t:aura ${cfLegal}`,
    `t:enchantment t:saga ${cfLegal}`,
  ];
  const enchMerged = [];
  const seenEnAuto = new Set();
  for(const q of enchQAuto){
    const r = await fetchAndScore(q);
    for(const c of r) if(!seenEnAuto.has(c.id)){ seenEnAuto.add(c.id); enchMerged.push(c); }
  }
  enchMerged.sort((a,b) => b._edh - a._edh);
  S.wk.enchants = addUnique(enchMerged, getTarget('enchants'));
  // Fallback encantamientos
  if (S.wk.enchants.length < getTarget('enchants')) {
    const enFallback = await fetchAndScore(`t:enchantment ${cfLegal}`);
    const enExtra = addUnique(enFallback.filter(c => !S.wk.enchants.find(x=>x.id===c.id)), getTarget('enchants') - S.wk.enchants.length);
    enExtra.forEach(c => S.wk.enchants.push(c));
  }
  secState('enchants', 'done'); secCount('enchants', S.wk.enchants.length, getTarget('enchants'));
  updateLastLog(`Encantamientos: ${S.wk.enchants.length} seleccionados`);
  setProgress(95);

  // ── VERIFICACIÓN Y AJUSTE DE PRESUPUESTO TOTAL ───────────────────
  if (budget) {
    // Calcular precio total actual de todo el mazo (excluyendo básicas)
    const allBuilt = [
      ...S.wk.lands, ...S.wk.ramp, ...S.wk.creatures,
      ...S.wk.spells, ...S.wk.artifacts, ...S.wk.enchants
    ].filter(c => !c._basic);
    const totalPrice = allBuilt.reduce((sum, c) => sum + cardPrice(c), 0);

    if (totalPrice > budget) {
      log(`Presupuesto: ${totalPrice.toFixed(1)}€ — ajustando al límite de ${budget}€...`, false);
      // Estrategia: eliminar las cartas más caras hasta quedar dentro del presupuesto,
      // luego rellenar con cartas baratas de Scryfall (eur<=perCardCeiling*0.3)
      const cheapCap = Math.max(0.3, perCardCeiling * 0.3);
      const sections = ['creatures','ramp','spells','artifacts','enchants','lands'];
      let overBudget = totalPrice - budget;
      const removed = {creatures:0,ramp:0,spells:0,artifacts:0,enchants:0,lands:0};

      for (const sec of sections) {
        if (overBudget <= 0) break;
        S.wk[sec].sort((a,b) => cardPrice(b) - cardPrice(a));
        while (S.wk[sec].length > 2 && overBudget > 0) {
          const c = S.wk[sec][0];
          const p = cardPrice(c);
          if (p <= cheapCap) break; // ya son baratas, no quitar más
          overBudget -= p;
          usedIds.delete(c.id);
          S.wk[sec].shift();
          removed[sec]++;
        }
      }

      // Rellenar los huecos con cartas baratas (eur<=cheapCap) bien puntuadas por EDHREC
      const totalRemoved = Object.values(removed).reduce((a,b)=>a+b,0);
      if (totalRemoved > 0) {
        const cheapPool = await fetchAndScore(`legal:commander color<=${colorStr} -is:extra -is:funny -t:basic eur<=${cheapCap.toFixed(2)}`);
        for (const sec of sections) {
          const needed = removed[sec];
          if (!needed) continue;
          const typeFilter = sec==='lands' ? c=>/(land)/i.test(c.type_line||'')
            : sec==='creatures' ? c=>/(creature)/i.test(c.type_line||'')
            : sec==='spells'   ? c=>/(instant|sorcery)/i.test(c.type_line||'')
            : sec==='artifacts'? c=>/(artifact)/i.test(c.type_line||'') && !/(creature)/i.test(c.type_line||'')
            : sec==='enchants' ? c=>/(enchantment)/i.test(c.type_line||'') && !/(creature)/i.test(c.type_line||'')
            : ()=>true;
          const candidates = cheapPool.filter(typeFilter);
          const fills = addUnique(candidates, needed);
          fills.forEach(c => S.wk[sec].push(c));
        }
      }

      const newTotal = [...S.wk.lands,...S.wk.ramp,...S.wk.creatures,...S.wk.spells,...S.wk.artifacts,...S.wk.enchants]
        .filter(c=>!c._basic).reduce((s,c)=>s+cardPrice(c),0);
      updateLastLog(`✅ Presupuesto ajustado: ~${newTotal.toFixed(1)}€ / ${budget}€`);
    } else {
      log(`✅ Presupuesto: ~${totalPrice.toFixed(1)}€ / ${budget}€`, true);
    }
  }

  // ── RELLENAR HASTA 100 ────────────────────────────────────────────
  const cmdsCount = partner ? 2 : 1;
  const basicsTotal = Object.values(S.basicCounts).reduce((a,b)=>a+b,0);
  const current = cmdsCount + S.wk.lands.length + basicsTotal
    + S.wk.ramp.length + S.wk.creatures.length + S.wk.spells.length
    + S.wk.artifacts.length + S.wk.enchants.length;
  const needed = 100 - current;

  if (needed > 0) {
    log(`Rellenando ${needed} cartas restantes...`, false);
    // Añadir más criaturas del pool ya cargado hasta llegar a 100
    const extraPool = await fetchAndScore(`t:creature ${cfLegal}`);
    const extra = addUnique(extraPool, needed);
    extra.forEach(c => S.wk.creatures.push(c));
    updateLastLog(`+${extra.length} cartas extra para completar 100`);
  }

  setProgress(100);
  log(`✨ Mazo completo con datos de sinergia de EDHREC`, true);

  // Mostrar % de cartas con datos EDHREC
  const allWk = [...Object.values(S.wk).flat()];
  const withEdh = allWk.filter(c => edhByName[(c.name||'').toLowerCase()]).length;
  log(`${withEdh}/${allWk.length} cartas tienen datos de % inclusión de EDHREC`, true);

  S.pools = {}; // limpiar para el workshop por si se edita después

  setTimeout(() => {
    // Construir deck y renderizar directamente
    const deck = finalizeDeckAuto();
    if (deck) {
      S.deck = deck;
      renderDeck(deck);
    }
  }, 800);
}

function finalizeDeckAuto() {
  const cmd = S.cmdData; const partner = S.partnerData;
  const ci = S._ci || [];
  const bm = {W:'Plains',U:'Island',B:'Swamp',R:'Mountain',G:'Forest'};
  const activeCols = ci.length ? ci : ['G'];
  const basicImgMap = {
    W:'https://cards.scryfall.io/normal/front/e/0/e0c9e93d-81a3-4f2e-a7b2-c8cb3b7d7936.jpg',
    U:'https://cards.scryfall.io/normal/front/4/d/4d8edc59-ab9c-4f74-aafd-90c3a5c9b46e.jpg',
    B:'https://cards.scryfall.io/normal/front/6/1/619b2d83-0e83-4f7b-8fa4-9a8a4fa3c4b8.jpg',
    R:'https://cards.scryfall.io/normal/front/b/a/bad5dab5-7e43-4c28-9a33-66b34f8a4fd9.jpg',
    G:'https://cards.scryfall.io/normal/front/6/2/62d4b0bf-2cc2-4c17-bfe0-32b9c3cfddaf.jpg'
  };
  const usedIds = new Set([cmd.id, ...(partner?[partner.id]:[])]);
  const addU = pool => { const r=[]; for(const c of pool){ if(!usedIds.has(c.id)){usedIds.add(c.id);r.push(c);}} return r; };

  // Tierras especiales + básicas
  let landPool = addU([...S.wk.lands]);
  Object.entries(S.basicCounts).forEach(([col,count]) => {
    for(let i=0;i<count;i++) landPool.push({id:`basic-${col}-${i}`,name:bm[col]||'Forest',type_line:'Basic Land',cmc:0,mana_cost:'',_basic:true,image_uris:{normal:basicImgMap[col]||''}});
  });
  // Rellenar básicas si aún falta
  let bi=0; while(landPool.length<36){const col=activeCols[bi%activeCols.length];bi++;landPool.push({id:`bfill-${landPool.length}`,name:bm[col]||'Forest',type_line:'Basic Land',cmc:0,mana_cost:'',_basic:true,image_uris:{normal:basicImgMap[col]||''}});}
  landPool = landPool.slice(0,36);

  const deck = {
    commanders: [cmd, ...(partner?[partner]:[])],
    lands: landPool,
    sections: {
      ramp:        addU([...S.wk.ramp]),
      creatures:   addU([...S.wk.creatures]),
      spells:      addU([...S.wk.spells]),
      artifacts:   addU([...S.wk.artifacts]),
      enchants:    addU([...S.wk.enchants]),
    }
  };
  deck.total = deck.commanders.length + deck.lands.length + Object.values(deck.sections).reduce((a,b)=>a+b.length,0);
  // Rellenar hasta 100 con básicas si falta algo
  while(deck.total < 100){ const col=activeCols[deck.total%activeCols.length]; deck.lands.push({id:'fill-'+deck.total,name:bm[col]||'Forest',type_line:'Basic Land',cmc:0,mana_cost:'',_basic:true}); deck.total++; }
  return deck;
}

let _essCardData = {};  // name -> card data para poder añadirlas

async function loadEssentialsForCmd(cmdName) {
  const container = document.getElementById('ess-grid-p2');
  const addAllBtn = document.getElementById('ess-add-all');
  if (!container) return;
  container.innerHTML = '<div class="ess-loading-sm"><span class="isp"></span>Cargando de EDHREC...</div>';
  if (addAllBtn) addAllBtn.style.display = 'none';
  _essCardData = {};

  const edhList = await fetchEdhrecForCommander(cmdName);
  if (!edhList.length) {
    container.innerHTML = '<div style="font-size:11px;color:var(--text3)">Sin datos de EDHREC para este comandante.</div>';
    return;
  }

  const top = edhList
    .filter(c => c.name)
    .sort((a,b) => (b.num_decks||b.inclusion||0) - (a.num_decks||a.inclusion||0))
    .slice(0, 12);

  // Obtener imágenes de Scryfall
  for (let i = 0; i < top.length; i += 6) {
    const batch = top.slice(i, i+6);
    const q = batch.map(c => `!"${c.name}"`).join(' OR ');
    const r = await sfQ(`(${q}) -is:extra`);
    r.forEach(card => { _essCardData[card.name.toLowerCase()] = card; });
  }

  container.innerHTML = '';
  const grid = document.createElement('div');
  grid.className = 'ess-grid';

  top.forEach(item => {
    const card = _essCardData[item.name?.toLowerCase()];
    const img = card?.image_uris?.normal || card?.card_faces?.[0]?.image_uris?.normal || '';
    const pct = item.inclusion ? `${item.inclusion}%` : item.num_decks ? `${(item.num_decks/1000).toFixed(0)}k mazos` : '';
    const safeId = (item.name||'').replace(/[^a-z0-9]/gi,'_');

    const el = document.createElement('div');
    el.className = 'ess-card';
    el.id = 'ess-' + safeId;
    el.innerHTML = `
      <div class="ess-add-btn" onclick="addEssCard('${(item.name||'').replace(/'/g,"\\'")}','${safeId}')" title="Añadir al mazo">+</div>
      ${img ? `<img src="${img}" alt="${item.name}" loading="lazy">` : `<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px">🃏</div>`}
      <div class="ess-name">${item.name}</div>
      <div class="ess-pct">${pct}</div>`;
    el.addEventListener('mouseenter', e => showZ(e, img, item.name, card?.oracle_text || card?.card_faces?.[0]?.oracle_text || ''));
    el.addEventListener('mouseleave', hideZ);
    grid.appendChild(el);
  });

  container.appendChild(grid);
  if (addAllBtn) addAllBtn.style.display = 'block';
}

function addEssCard(cardName, safeId) {
  const card = _essCardData[cardName.toLowerCase()];
  if (!card) return;
  // Guardar en wk para que esté disponible cuando empiece el workshop
  if (!S._essentialsPending) S._essentialsPending = [];
  if (!S._essentialsPending.find(c => c.id === card.id)) {
    S._essentialsPending.push(card);
  }
  const el = document.getElementById('ess-' + safeId);
  if (el) {
    el.classList.add('ess-added');
    const btn = el.querySelector('.ess-add-btn');
    if (btn) { btn.textContent = '✓'; btn.style.background = 'var(--green)'; btn.style.color = '#0a2012'; }
  }
}

function addAllEssentials() {
  const cards = Object.values(_essCardData);
  cards.forEach(card => {
    if (!S._essentialsPending) S._essentialsPending = [];
    if (!S._essentialsPending.find(c => c.id === card.id)) S._essentialsPending.push(card);
    const safeId = card.name.replace(/[^a-z0-9]/gi,'_');
    const el = document.getElementById('ess-' + safeId);
    if (el) {
      el.classList.add('ess-added');
      const btn = el.querySelector('.ess-add-btn');
      if (btn) { btn.textContent = '✓'; btn.style.background = 'var(--green)'; btn.style.color = '#0a2012'; }
    }
  });
}
