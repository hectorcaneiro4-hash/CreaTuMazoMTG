<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#04030c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CMD Builder">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Constructor de mazos de Commander para Magic: The Gathering con datos de EDHREC y análisis de IA.">
<link rel="manifest" href="manifest.json">
<title>Commander Deck Builder — MTG</title>
<style>
:root{
  --bg:#04030c;--bg2:rgba(12,10,24,.88);--bg3:rgba(18,16,32,.92);--bg4:rgba(24,22,40,.95);
  --border:rgba(255,255,255,.08);--border2:rgba(255,255,255,.16);
  --text:#eeeef8;--text2:#9494b8;--text3:#5c5c80;
  --accent:#7c5cbf;--accent2:#a07de8;
  --gold:#d4a843;--gold2:#f0c860;
  --green:#4caf7d;--red:#e05555;--blue:#4a9edd;
  --radius:12px;--rsm:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}

/* ─── FONDO ANIMADO ─── */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 16px}

/* ─── HEADER ─── */
.header{text-align:center;margin-bottom:28px;padding:28px 0 14px;position:relative}
.header h1{font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--accent2),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;letter-spacing:-.5px}
.header p{color:var(--text2);font-size:13px}

/* ─── STEPPER ─── */
.stepper{display:flex;align-items:center;justify-content:center;margin-bottom:28px;gap:0;overflow-x:auto;padding-bottom:4px}
.step-item{display:flex;align-items:center;flex-shrink:0}
.sc{width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);background:var(--bg2);color:var(--text3);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.sc.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,92,191,.15)}
.sc.done{border-color:var(--green);background:var(--green);color:#fff}
.sl{width:22px;height:2px;background:var(--border);margin:0 3px;flex-shrink:0;transition:background .3s}
.sl.done{background:var(--green)}
.step-label{font-size:10px;color:var(--text3);margin-left:5px;white-space:nowrap;display:none}
@media(min-width:600px){.step-label{display:block}}

/* ─── GLASS CARD ─── */
.glass{background:rgba(8,6,20,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:var(--radius)}

/* ─── PANELS ─── */
.panel{display:none;animation:fadeUp .25s ease}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.stitle{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.09em;margin-bottom:12px}

/* ─── BUTTONS ─── */
.btn{padding:10px 20px;border-radius:var(--rsm);border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:disabled{opacity:.32;cursor:not-allowed}
.btn-p{background:var(--accent);color:#fff}
.btn-p:hover:not(:disabled){background:var(--accent2);transform:translateY(-1px)}
.btn-g{background:var(--bg3);color:var(--text2);border:1.5px solid var(--border)}
.btn-g:hover:not(:disabled){background:var(--bg4);color:var(--text)}
.btn-gold{background:linear-gradient(135deg,#b8881e,#e8c060);color:#120e00}
.btn-gold:hover:not(:disabled){filter:brightness(1.1);transform:translateY(-1px)}
.btn-sm{padding:7px 13px;font-size:12px}
.btn-xs{padding:4px 9px;font-size:11px;border-radius:6px}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;flex-wrap:wrap;gap:8px}

/* ─── MODE ─── */
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:24px}
@media(min-width:600px){.mode-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.mode-grid{grid-template-columns:1fr}}
.mode-btn{background:rgba(20,20,30,.75);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 14px;cursor:pointer;text-align:center;transition:all .2s;backdrop-filter:blur(8px);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.mode-btn:hover{border-color:var(--border2);background:rgba(14,10,30,.85)}
.mode-btn.sel{border-color:var(--accent2);background:rgba(60,30,120,.3);box-shadow:0 0 20px rgba(124,92,191,.15)}
.mode-icon{font-size:30px;margin-bottom:8px;display:block}
.mode-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.mode-desc{font-size:11px;color:var(--text2);line-height:1.5}

/* ─── APIKEY ─── */
.apikey-box{background:rgba(124,92,191,.08);border:1px solid rgba(155,125,224,.25);border-radius:var(--radius);padding:14px;margin-bottom:20px}
.apikey-box h3{font-size:13px;font-weight:600;color:var(--accent2);margin-bottom:5px}
.apikey-box p{font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.5}
.apikey-row{display:flex;gap:6px}
.apikey-row input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:8px 10px;color:var(--text);font-size:12px;font-family:monospace}
.apikey-row input:focus{outline:none;border-color:var(--accent2)}
.apikey-st{font-size:10px;margin-top:5px;color:var(--text3)}

/* ─── CMD SEARCH ─── */
.csbox{background:rgba(20,20,30,.8);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:14px}
.csbox h3{font-size:13px;font-weight:600;color:var(--text);margin-bottom:5px}
.csbox p{font-size:11px;color:var(--text2);margin-bottom:8px;line-height:1.5}
.srow{display:flex;gap:7px;margin-bottom:6px}
.srow input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:9px 12px;color:var(--text);font-size:13px}
.srow input:focus{outline:none;border-color:var(--accent2)}
.sres{display:none;border:1px solid var(--border);border-radius:var(--rsm);overflow:hidden;max-height:280px;overflow-y:auto;margin-top:4px;background:var(--bg2)}
.sri{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;transition:background .12s;border-bottom:1px solid var(--border)}
.sri:last-child{border-bottom:none}
.sri:hover{background:var(--bg3)}
.sri img{width:30px;height:42px;border-radius:3px;object-fit:cover;flex-shrink:0}
.sri-n{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sri-m{font-size:10px;color:var(--text3);margin-top:2px}
.chip{display:flex;align-items:center;gap:8px;background:rgba(124,92,191,.12);border:1px solid rgba(155,125,224,.3);border-radius:var(--rsm);padding:7px 10px;margin-top:6px}
.chip img{width:24px;height:34px;border-radius:3px;object-fit:cover}
.chip-n{font-size:12px;font-weight:600;color:var(--accent2);flex:1}
.chip-x{cursor:pointer;color:var(--text3);font-size:14px;line-height:1;margin-left:auto}
.chip-x:hover{color:var(--red)}

/* ─── STRATEGY ─── */
.strat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;margin-bottom:20px}
.strat-btn{background:rgba(6,4,16,.7);backdrop-filter:blur(10px);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px;cursor:pointer;text-align:left;transition:all .2s;-webkit-tap-highlight-color:transparent;touch-action:manipulation;position:relative}
.strat-btn:hover{border-color:var(--border2);background:rgba(14,10,30,.85)}
.strat-btn.sel{border-color:var(--accent2);background:rgba(60,30,120,.3);box-shadow:0 0 16px rgba(124,92,191,.12)}
.si{font-size:20px;margin-bottom:6px;display:block}
.sn{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.sd{font-size:11px;color:var(--text2);line-height:1.4}
/* Strategy hover tooltip */
.strat-tooltip{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:rgba(10,8,24,.97);border:1px solid var(--accent2);border-radius:var(--radius);padding:11px 13px;z-index:9990;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .18s,transform .18s;min-width:200px;max-width:260px}
.strat-btn:hover .strat-tooltip{opacity:1;transform:translateY(0)}
.strat-tooltip-title{font-size:12px;font-weight:700;color:var(--accent2);margin-bottom:5px}
.strat-tooltip-body{font-size:11px;color:var(--text2);line-height:1.6}
.strat-tooltip-kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.strat-tooltip-kw span{font-size:10px;background:rgba(124,92,191,.15);border:1px solid rgba(155,125,224,.25);border-radius:4px;padding:1px 6px;color:var(--accent2)}
/* AI strategy suggestion banner */
.strat-suggest{background:rgba(74,158,221,.07);border:1px solid rgba(74,158,221,.25);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:12px;color:#88bbdd;line-height:1.6}
.strat-suggest strong{color:var(--text)}
.strat-suggest-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.strat-suggest-pill{background:rgba(74,158,221,.12);border:1px solid rgba(74,158,221,.3);border-radius:99px;padding:4px 12px;font-size:11px;cursor:pointer;color:#88bbdd;transition:all .2s}
.strat-suggest-pill:hover{background:rgba(74,158,221,.25);color:var(--text)}
.strat-suggest-pill.applied{background:rgba(76,175,125,.15);border-color:rgba(76,175,125,.35);color:var(--green)}
/* Saved decks */
.saved-decks-panel{background:rgba(6,4,16,.85);backdrop-filter:blur(14px);border:1px solid var(--border2);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.saved-decks-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.saved-deck-row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(20,20,30,.7);border:1px solid var(--border);border-radius:var(--rsm);margin-bottom:6px;cursor:pointer;transition:all .2s}
.saved-deck-row:hover{border-color:var(--border2);background:rgba(30,24,50,.8)}
.saved-deck-img{width:32px;height:45px;border-radius:4px;object-fit:cover;flex-shrink:0;background:var(--bg3)}
.saved-deck-info{flex:1;min-width:0}
.saved-deck-name{font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-deck-meta{font-size:10px;color:var(--text3);margin-top:1px}
.saved-deck-del{padding:3px 8px;font-size:11px;border-radius:5px;border:1px solid rgba(224,85,85,.3);background:rgba(224,85,85,.07);color:#ff8888;cursor:pointer;flex-shrink:0;transition:all .2s}
.saved-deck-del:hover{background:rgba(224,85,85,.2)}
.save-deck-btn{padding:7px 14px;border-radius:var(--rsm);border:1px solid rgba(76,175,125,.35);background:rgba(76,175,125,.08);color:var(--green);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.save-deck-btn:hover{background:rgba(76,175,125,.18)}

/* ─── BRACKET ─── */
.brk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.brk-btn{background:rgba(6,4,16,.7);backdrop-filter:blur(10px);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 6px;cursor:pointer;text-align:center;transition:all .2s}
.brk-btn:hover{border-color:var(--border2);background:rgba(14,10,30,.85)}
.brk-btn.sel{border-color:var(--accent2);background:rgba(60,30,120,.3);box-shadow:0 0 16px rgba(124,92,191,.12)}
.bn{font-size:24px;font-weight:700;color:var(--gold)}
.bl{font-size:11px;font-weight:600;color:var(--text);margin:3px 0 2px}
.bd{font-size:10px;color:var(--text2);line-height:1.4}

/* ─── COLORS ─── */
.col-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.col-btn{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid var(--border);border-radius:999px;cursor:pointer;font-size:12px;color:var(--text2);background:rgba(20,20,30,.75);transition:all .2s}
.col-btn:hover{border-color:var(--border2)}
.col-btn.sel{border-color:var(--accent2);color:var(--text);background:rgba(124,92,191,.13)}
.pip{width:13px;height:13px;border-radius:50%;flex-shrink:0}
.pip-W{background:#f4f0e0;border:1px solid #ccc}.pip-U{background:#1a6eb5}
.pip-B{background:#2a1a0a;border:1px solid #555}.pip-R{background:#d4302a}.pip-G{background:#1a7a42}

/* ─── CMD CARDS (paso 2) ─── */
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.cmd-card{background:rgba(6,4,16,.80);backdrop-filter:blur(10px);border:1.5px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:all .2s;position:relative;-webkit-tap-highlight-color:transparent}
.cmd-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.cmd-card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.cmd-card img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover}
.ci{padding:8px}
.ci-name{font-size:11px;font-weight:600;color:var(--text);margin-bottom:2px;line-height:1.3}
.ci-type{font-size:9px;color:var(--text3);margin-bottom:4px}
.ci-pills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:3px}
.ci-ai{font-size:10px;color:var(--text2);line-height:1.4;border-top:1px solid var(--border);padding-top:4px;margin-top:3px;min-height:36px}
.ci-ai.ld{color:var(--text3);font-style:italic}
.chkv{display:none;position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#120e00;font-size:11px;font-weight:700;align-items:center;justify-content:center;z-index:2}
.cmd-card.sel .chkv{display:flex}
.spill{font-size:9px;padding:2px 5px;border-radius:99px;font-weight:600}
.sp-e{background:rgba(74,158,221,.15);color:#77bbee;border:1px solid rgba(74,158,221,.3)}
.sp-s{background:rgba(76,175,125,.15);color:#77ddaa;border:1px solid rgba(76,175,125,.3)}
.aib{display:inline-flex;align-items:center;gap:3px;font-size:9px;padding:1px 5px;border-radius:99px;background:rgba(124,92,191,.15);color:var(--accent2);border:1px solid rgba(155,125,224,.3);margin-bottom:3px}

/* ─── WORKSHOP ─── */
.workshop{display:flex;gap:14px;min-height:580px}
@media(max-width:720px){.workshop{flex-direction:column}}
.wk-left{width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
@media(max-width:720px){.wk-left{width:100%}}
.wsb{background:rgba(6,4,16,.72);backdrop-filter:blur(10px);border:1.5px solid var(--border);border-radius:var(--rsm);padding:10px 12px;cursor:pointer;transition:all .2s;text-align:left;width:100%}
.wsb:hover{border-color:var(--border2)}
.wsb.wk-active{border-color:var(--accent2);background:rgba(60,30,120,.28);box-shadow:0 0 14px rgba(124,92,191,.1)}
.wsb.wk-done{border-color:rgba(76,175,125,.4)}
.wsb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.wsb-name{font-size:12px;font-weight:600;color:var(--text)}
.wsb-cnt{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--bg3);color:var(--text2)}
.wsb.wk-done .wsb-cnt{background:rgba(76,175,125,.15);color:var(--green)}
.wsb-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin:4px 0 3px}
.wsb-fill{height:100%;border-radius:2px;transition:width .3s}
.wsb-hint{font-size:9px;color:var(--text3);line-height:1.3}

.wk-right{flex:1;min-width:0;overflow-x:hidden}
.wk-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:7px}
.wk-sub{font-size:11px;color:var(--text2);line-height:1.5;margin-bottom:10px}

/* slot counter */
.slot-ctr{display:flex;align-items:center;gap:8px;background:rgba(20,20,30,.7);border:1px solid var(--border);border-radius:var(--rsm);padding:8px 12px;margin-bottom:10px}
.slot-bar{flex:1;height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.slot-fill{height:100%;border-radius:3px;transition:width .3s,background .3s}
.slot-txt{font-size:12px;font-weight:600;white-space:nowrap}
.slot-tgt{font-size:10px;color:var(--text3);white-space:nowrap}

/* land slider */
.land-box{background:rgba(6,4,16,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
/* básicas */
.basics-box{background:rgba(6,4,16,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.basics-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.basic-item{display:flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:7px 10px}
.basic-item img{width:36px;border-radius:4px;display:block}
.basic-ctrl{display:flex;flex-direction:column;align-items:center;gap:3px}
.basic-name{font-size:10px;font-weight:600;color:var(--text2);text-align:center}
.basic-count{font-size:16px;font-weight:700;color:var(--gold);min-width:24px;text-align:center}
.basic-btns{display:flex;gap:4px}
.bsb{width:22px;height:22px;border-radius:5px;border:1px solid var(--border2);background:var(--bg4);color:var(--text);font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1}
.bsb:hover{background:var(--accent);border-color:var(--accent2)}
.land-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.land-row input[type=range]{flex:1;accent-color:var(--accent2)}
.land-n{font-size:22px;font-weight:700;color:var(--gold);min-width:32px;text-align:center}
.land-bd{display:flex;gap:6px;flex-wrap:wrap;font-size:10px;color:var(--text3)}
.land-bd-i{background:var(--bg3);border:1px solid var(--border);border-radius:5px;padding:2px 7px}

/* manual search */
.msbox{background:rgba(6,4,16,.72);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.msrow{display:flex;gap:6px;margin-bottom:6px}
.msrow input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rsm);padding:8px 11px;color:var(--text);font-size:12px}
.msrow input:focus{outline:none;border-color:var(--accent2)}
.msres{display:none;max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--rsm);background:var(--bg2)}

/* card pick grid */
.cpg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;max-height:420px;overflow-y:auto;padding-right:4px}
.cp{background:rgba(6,4,16,.80);backdrop-filter:blur(8px);border:1.5px solid var(--border);border-radius:var(--rsm);overflow:hidden;cursor:pointer;transition:all .15s;position:relative;-webkit-tap-highlight-color:transparent}
.cp:hover{border-color:var(--border2);transform:translateY(-1px)}
.cp.picked{border-color:var(--green);background:rgba(76,175,125,.07)}
.cp img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover}
.cp-info{padding:5px 6px}
.cp-name{font-size:9px;font-weight:600;color:var(--text);margin-bottom:1px;line-height:1.3}
.cp-meta{font-size:8px;color:var(--text3)}
.cp-ov{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.cp.picked .cp-ov{display:flex;background:var(--green);color:#0a2012}
.cp-rm{position:absolute;top:4px;left:4px;width:16px;height:16px;border-radius:50%;background:rgba(224,85,85,.85);color:#fff;font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;cursor:pointer;z-index:3}
.cp.picked .cp-rm{display:flex}

/* summary sidebar */
.wk-sum{margin-top:10px;background:rgba(6,4,16,.68);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--rsm);padding:10px}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.sum-row:last-child{border-bottom:none}

/* ─── DECK PANEL ─── */
.deck-header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.deck-header img{width:68px;border-radius:6px;flex-shrink:0}
.deck-title{font-size:18px;font-weight:700;color:var(--text);margin-bottom:3px}
.deck-meta{font-size:12px;color:var(--text2)}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.stat-box{background:rgba(6,4,16,.78);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;text-align:center}
.stn{font-size:20px;font-weight:700;color:var(--gold)}
.stl{font-size:10px;color:var(--text3);margin-top:2px}
.curve-bars{display:flex;align-items:flex-end;gap:5px;height:52px;margin-bottom:16px}
.cbw{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.cbar{width:100%;background:var(--accent);border-radius:2px 2px 0 0;min-height:2px}
.clbl{font-size:9px;color:var(--text3)}.ccnt{font-size:8px;color:var(--text2)}
.dist-bar{height:7px;border-radius:3px;overflow:hidden;display:flex;margin-bottom:7px}
.dist-legend{display:flex;gap:10px;flex-wrap:wrap;font-size:10px;color:var(--text3);margin-bottom:18px}
.dist-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:3px}
.deck-cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
@media(max-width:600px){.deck-cols{grid-template-columns:1fr}}
.dsbox{background:rgba(6,4,16,.78);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.dsh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.dcr{display:flex;align-items:center;gap:5px;padding:3px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px;cursor:default;transition:background .1s;border-radius:3px}
.dcr:last-child{border-bottom:none}
.dcr:hover{background:rgba(255,255,255,.04)}
.dcr:hover .dcr-n{color:var(--gold)}
.dcr-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dcr-q{color:var(--text3);min-width:16px}.dcr-n{color:var(--text);flex:1}.dcr-m{color:var(--text3);font-size:9px}

/* ─── ANÁLISIS ESTRATÉGICO ─── */
.strategy-analysis{background:rgba(212,168,67,.05);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.sa-title{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sa-body{font-size:12px;color:var(--text2);line-height:1.85;white-space:normal}
.sa-body br{display:block;margin-bottom:2px}
.sa-loading{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:12px}

/* ─── EXPORT ─── */
.fmt-tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.ftab{padding:5px 12px;border-radius:99px;border:1.5px solid var(--border);background:rgba(20,20,30,.75);color:var(--text2);cursor:pointer;font-size:12px;transition:all .2s}
.ftab.active{border-color:var(--accent2);color:var(--accent2);background:rgba(124,92,191,.1)}
.export-area{background:rgba(4,2,12,.88);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:14px;font-family:'Courier New',monospace;font-size:11px;color:var(--text2);white-space:pre-wrap;max-height:380px;overflow-y:auto;line-height:1.7;margin-bottom:14px;user-select:all}
.copy-ok{display:none;color:var(--green);font-size:12px;margin-top:6px}

/* ─── INFO / LOADING ─── */
.info-banner{background:rgba(74,158,221,.07);border:1px solid rgba(74,158,221,.18);border-radius:var(--rsm);padding:9px 12px;font-size:11px;color:#88bbdd;margin-bottom:14px;line-height:1.6}
.ebox{background:rgba(224,85,85,.1);border:1px solid rgba(224,85,85,.3);border-radius:var(--rsm);padding:10px 14px;color:#ff8888;font-size:12px;margin-bottom:14px}
.isp{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent2);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.ldc{text-align:center;padding:32px;color:var(--text2);font-size:13px}
.spin-big{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
.il{display:flex;align-items:center;gap:7px;color:var(--text3);font-size:11px;padding:14px 0}


/* ─── PRECIOS ─── */
.price-panel{background:rgba(20,20,30,.85);border:1px solid rgba(76,175,125,.25);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.price-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.price-title{font-size:13px;font-weight:700;color:var(--green);display:flex;align-items:center;gap:6px}
.price-total{font-size:22px;font-weight:800;color:var(--gold)}
.price-sub{font-size:10px;color:var(--text3);text-align:right}
.price-sources{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.psrc{font-size:10px;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--text3);border:1px solid var(--border)}
.psrc.active{border-color:var(--green);color:var(--green)}
.price-list{max-height:280px;overflow-y:auto;margin-top:8px}
.price-row{display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.04);font-size:11px}
.price-row:last-child{border-bottom:none}
.price-row:hover{background:rgba(255,255,255,.03)}
.price-row:hover .dcr-n{color:var(--gold)}
.pr-name{flex:1;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr-cm{min-width:52px;text-align:right;color:#4a9edd;font-weight:600}
.pr-usd{min-width:52px;text-align:right;color:#4caf7d;font-weight:600}
.pr-avg{min-width:52px;text-align:right;color:var(--gold);font-weight:700}
.pr-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.price-loading{display:flex;align-items:center;gap:8px;color:var(--text3);font-size:12px;padding:12px 0}
.budget-bar{height:5px;border-radius:3px;overflow:hidden;display:flex;margin-bottom:10px}

/* ─── INDISPENSABLES ─── */
.must-panel{background:rgba(212,168,67,.05);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.must-title{font-size:13px;font-weight:700;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.must-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.must-card{background:rgba(20,20,30,.85);border:1.5px solid rgba(212,168,67,.3);border-radius:var(--rsm);overflow:hidden;position:relative;cursor:pointer;transition:all .2s}
.must-card:hover{border-color:var(--gold);transform:translateY(-2px)}
.must-card img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover}
.must-card .mc-info{padding:6px}
.must-card .mc-name{font-size:9px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.3}
.must-card .mc-pct{font-size:9px;color:var(--gold)}
.must-add{position:absolute;bottom:44px;left:0;right:0;background:rgba(212,168,67,.92);color:#120e00;font-size:11px;font-weight:700;text-align:center;padding:5px;display:none;cursor:pointer}
.must-card:hover .must-add{display:block}
.must-card.in-deck{border-color:var(--green)}
.must-card.in-deck .must-add{display:none}
.must-in-badge{position:absolute;top:5px;right:5px;background:var(--green);color:#0a2012;font-size:9px;font-weight:700;padding:2px 5px;border-radius:4px;display:none}
.must-card.in-deck .must-in-badge{display:block}

/* ─── COMBOS ─── */
.combo-panel{background:rgba(224,85,85,.05);border:1px solid rgba(224,85,85,.2);border-radius:var(--radius);padding:16px;margin-bottom:20px}
.combo-title{font-size:13px;font-weight:700;color:#ff8888;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.combo-item{background:rgba(20,20,30,.85);border:1px solid rgba(224,85,85,.2);border-radius:var(--rsm);padding:12px;margin-bottom:10px;transition:all .2s}
.combo-item:last-child{margin-bottom:0}
.combo-item:hover{border-color:rgba(224,85,85,.4)}
.combo-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.combo-produces{font-size:11px;font-weight:700;color:#ff8888;margin-bottom:4px}
.combo-cards{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.combo-card-chip{display:flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:3px 7px;font-size:10px;color:var(--text2);cursor:pointer;transition:background .15s}
.combo-card-chip:hover{background:rgba(224,85,85,.15);color:var(--text)}
.combo-card-chip img{width:16px;height:22px;border-radius:2px;object-fit:cover;flex-shrink:0}
.combo-missing{font-size:10px;color:var(--text3);margin-bottom:6px}
.combo-missing span{color:var(--red)}
.btn-add-combo{padding:5px 12px;border-radius:var(--rsm);border:1px solid rgba(224,85,85,.4);background:rgba(224,85,85,.1);color:#ff8888;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.btn-add-combo:hover{background:rgba(224,85,85,.25)}
.btn-add-combo.added{border-color:var(--green);background:rgba(76,175,125,.1);color:var(--green)}
.combo-steps{font-size:10px;color:var(--text3);line-height:1.6;border-top:1px solid rgba(255,255,255,.06);padding-top:6px;margin-top:4px}



/* ─── BUILD MODE CHOICE ─── */
.build-choice{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:560px){.build-choice{grid-template-columns:1fr}}
.build-choice-btn{background:rgba(6,4,16,.78);backdrop-filter:blur(12px);border:2px solid var(--border);border-radius:var(--radius);padding:24px 20px;cursor:pointer;text-align:center;transition:all .25s;position:relative;overflow:hidden}
.build-choice-btn::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none}
.build-choice-btn:hover{border-color:var(--border2);transform:translateY(-2px)}
.build-choice-btn.manual-btn:hover{border-color:var(--accent2)}
.build-choice-btn.manual-btn:hover::before{background:radial-gradient(circle at 50% 0%,rgba(124,92,191,.15),transparent 70%);opacity:1}
.build-choice-btn.auto-btn:hover{border-color:var(--gold)}
.build-choice-btn.auto-btn:hover::before{background:radial-gradient(circle at 50% 0%,rgba(212,168,67,.15),transparent 70%);opacity:1}
.bc-icon{font-size:40px;margin-bottom:12px;display:block}
.bc-title{font-size:17px;font-weight:800;color:var(--text);margin-bottom:8px}
.bc-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:14px}
.bc-badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:99px;font-weight:600}
.bc-badge.manual{background:rgba(124,92,191,.15);color:var(--accent2);border:1px solid rgba(155,125,224,.3)}
.bc-badge.auto{background:rgba(212,168,67,.15);color:var(--gold);border:1px solid rgba(212,168,67,.3)}
.bc-features{text-align:left;margin-top:12px;display:flex;flex-direction:column;gap:5px}
.bc-feat{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px}
.bc-feat::before{content:'•';color:var(--accent2);font-weight:700;flex-shrink:0}
.auto-btn .bc-feat::before{color:var(--gold)}

/* ─── AUTO BUILD PROGRESS ─── */
.auto-build-panel{background:rgba(6,4,16,.85);backdrop-filter:blur(12px);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:20px;margin-bottom:20px}
.ab-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.ab-cmd-img{width:56px;border-radius:6px;flex-shrink:0}
.ab-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
.ab-sub{font-size:12px;color:var(--text2)}
.ab-progress{margin-bottom:16px}
.ab-progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px}
.ab-progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:3px;transition:width .5s ease}
.ab-progress-txt{font-size:11px;color:var(--text3);text-align:right}
.ab-sections{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
@media(max-width:560px){.ab-sections{grid-template-columns:repeat(2,1fr)}}
.ab-sec{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:10px;text-align:center;transition:all .3s}
.ab-sec.building{border-color:var(--gold);background:rgba(212,168,67,.07)}
.ab-sec.done{border-color:var(--green);background:rgba(76,175,125,.07)}
.ab-sec-icon{font-size:18px;margin-bottom:4px}
.ab-sec-name{font-size:10px;font-weight:600;color:var(--text2)}
.ab-sec-count{font-size:12px;font-weight:700;color:var(--text3)}
.ab-sec.building .ab-sec-count{color:var(--gold)}
.ab-sec.done .ab-sec-count{color:var(--green)}
.ab-log{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rsm);padding:12px;max-height:160px;overflow-y:auto;font-size:11px}
.ab-log-line{display:flex;align-items:center;gap:6px;padding:2px 0;color:var(--text2)}
.ab-log-line .check{color:var(--green);flex-shrink:0}
.ab-log-line .spin-xs{width:10px;height:10px;border:1.5px solid var(--border2);border-top-color:var(--gold);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}

/* ─── EDHREC SYNERGY DISPLAY ─── */
.syn-bar{height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:2px}
.syn-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent2),var(--gold))}

/* ─── TRIBAL MODE ─── */
.tribal-grid{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tribe-btn{display:flex;align-items:center;gap:7px;padding:7px 12px;border:1.5px solid var(--border);border-radius:999px;cursor:pointer;font-size:12px;color:var(--text2);background:rgba(6,4,16,.7);backdrop-filter:blur(8px);transition:all .2s}
.tribe-btn:hover{border-color:var(--border2);color:var(--text)}
.tribe-btn.sel{border-color:var(--accent2);color:var(--text);background:rgba(60,30,120,.3)}
.tribe-icon{font-size:16px}

/* ─── PANEL ESENCIALES EN CMD PICK ─── */
.cmd-with-essentials{display:grid;grid-template-columns:1fr 280px;gap:14px;align-items:start}
@media(max-width:780px){.cmd-with-essentials{grid-template-columns:1fr}}
.essentials-side{background:rgba(212,168,67,.05);border:1px solid rgba(212,168,67,.2);border-radius:var(--radius);padding:14px;position:sticky;top:10px}
.essentials-title{font-size:12px;font-weight:700;color:var(--gold);margin-bottom:10px;display:flex;align-items:center;gap:5px}
.essentials-hint{font-size:11px;color:var(--text3);margin-bottom:10px;line-height:1.5}
.ess-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ess-card{background:rgba(6,4,16,.75);border:1px solid rgba(212,168,67,.2);border-radius:var(--rsm);overflow:hidden;cursor:pointer;transition:all .15s;position:relative}
.ess-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.ess-card.ess-added{border-color:var(--green);opacity:.7}
.ess-card img{width:100%;display:block;aspect-ratio:5/7;object-fit:cover}
.ess-card .ess-name{font-size:8px;font-weight:600;color:var(--text2);padding:3px 4px;line-height:1.3;text-align:center}
.ess-card .ess-pct{font-size:8px;color:var(--gold);padding:0 4px 3px;text-align:center}
.ess-add-btn{position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:rgba(212,168,67,.9);color:#120e00;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;transition:all .15s}
.ess-add-btn:hover{transform:scale(1.2)}
.ess-card.ess-added .ess-add-btn{background:var(--green);color:#0a2012}
.ess-loading-sm{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:6px;padding:8px 0}
.ess-add-all{width:100%;margin-top:8px;padding:7px;border-radius:var(--rsm);border:1px solid rgba(212,168,67,.3);background:rgba(212,168,67,.08);color:var(--gold);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.ess-add-all:hover{background:rgba(212,168,67,.18)}


/* ─── MANA SYMBOL BUTTONS ─── */
.mana-btn{padding:6px 14px 6px 8px !important;border-radius:999px !important}
.mana-sym{display:inline-block;width:28px;height:28px;flex-shrink:0;vertical-align:middle;filter:drop-shadow(0 0 4px rgba(255,255,255,.2))}
.mana-btn.sel .mana-sym{filter:drop-shadow(0 0 8px rgba(255,255,255,.5))}
.mana-btn:hover .mana-sym{filter:drop-shadow(0 0 6px rgba(255,255,255,.35))}
/* Color overrides per mana type */
.mana-btn[id="cb-W"].sel,.mana-btn[id="tcb-W"].sel{border-color:#f9f0c8;background:rgba(249,240,200,.12);color:#f9f0c8}
.mana-btn[id="cb-U"].sel,.mana-btn[id="tcb-U"].sel{border-color:#4a9edd;background:rgba(74,158,221,.18);color:#7ec8f8}
.mana-btn[id="cb-B"].sel,.mana-btn[id="tcb-B"].sel{border-color:#9a5aaa;background:rgba(100,40,140,.25);color:#cc88ee}
.mana-btn[id="cb-R"].sel,.mana-btn[id="tcb-R"].sel{border-color:#e84020;background:rgba(200,50,20,.2);color:#ff8060}
.mana-btn[id="cb-G"].sel,.mana-btn[id="tcb-G"].sel{border-color:#40a840;background:rgba(40,140,50,.2);color:#80e880}

/* ─── ZOOM ─── */
#czoom{position:fixed;z-index:9999;pointer-events:none;display:none;flex-direction:column;align-items:center;filter:drop-shadow(0 8px 32px rgba(0,0,0,.95));transition:opacity .1s;opacity:0}
#czoom.vis{opacity:1}
#czoom img{width:220px;border-radius:13px;display:block}
#zoracle{margin-top:5px;font-size:10px;color:rgba(255,255,255,.8);text-align:center;max-width:220px;line-height:1.5;background:rgba(0,0,0,.75);padding:5px 9px;border-radius:7px}

/* ═══════════════════════════════════════════
   MOBILE — pulido para pantallas pequeñas
═══════════════════════════════════════════ */
@media(max-width:480px){
  /* App container */
  .app{padding:12px 10px}
  .home-grid{grid-template-columns:1fr!important}
  .home-grid>button{padding:22px 18px!important}

  /* Header más compacto */
  .header{padding:14px 0 8px;margin-bottom:16px}
  .header h1{font-size:20px}
  .header p{font-size:11px}

  /* Stepper: solo iconos numerados, sin labels */
  .stepper{gap:0;margin-bottom:16px;padding-bottom:2px}
  .sc{width:24px;height:24px;font-size:10px}
  .sl{width:14px}

  /* Modo selección: 2 col en móvil */
  .mode-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .mode-btn{padding:14px 8px}
  .mode-icon{font-size:22px;margin-bottom:5px}
  .mode-name{font-size:12px}
  .mode-desc{font-size:10px}

  /* Estrategias: 2 col ajustadas */
  .strat-grid{grid-template-columns:repeat(2,1fr);gap:6px}
  .strat-btn{padding:9px 8px}
  .si{font-size:16px;margin-bottom:4px}
  .sn{font-size:11px}
  .sd{font-size:10px;display:none} /* hide desc on small screens */

  /* Brackets: scroll horizontal */
  .brk-grid{grid-template-columns:repeat(5,1fr);gap:4px;overflow-x:auto}
  .brk-btn{padding:8px 2px;min-width:52px}
  .bn{font-size:18px}
  .bl{font-size:10px}
  .bd{display:none}

  /* Build choice: stack vertical */
  .build-choice{grid-template-columns:1fr}

  /* Workshop: stack siempre en móvil */
  .workshop{flex-direction:column;min-height:auto}
  .wk-left{width:100%;flex-direction:row;flex-wrap:wrap;gap:6px}
  .wsb{flex:1;min-width:calc(50% - 3px);padding:8px 10px}
  .wsb-hint{display:none}
  .wk-right{min-width:0}

  /* Candidate pool: 3 col en móvil */
  .cpg{grid-template-columns:repeat(3,1fr);gap:6px;max-height:340px}

  /* Commander grid: 3 col en móvil */
  .cmd-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .ci-ai{display:none} /* ocultar análisis IA en grid de móvil para ahorrar espacio */

  /* Deck final: 1 col */
  .deck-cols{grid-template-columns:1fr}
  .stats-row{grid-template-columns:repeat(2,1fr)}

  /* Must panel cards */
  .must-grid{grid-template-columns:repeat(3,1fr);gap:6px}

  /* Nav buttons: full width en móvil */
  .nav{flex-direction:column;gap:8px}
  .nav .btn{width:100%;justify-content:center}

  /* Export textarea: más pequeño en móvil */
  .export-area{font-size:10px;max-height:260px}

  /* Auto-build sections: 3 col */
  .ab-sections{grid-template-columns:repeat(3,1fr)}

  /* Zoom overlay: desactivar en móvil (usa tap en su lugar) */
  #czoom{display:none!important}

  /* Input y search más grandes para touch */
  .srow input,.msrow input{padding:11px 12px;font-size:14px}
  input[type="number"]{font-size:16px} /* evita zoom automático de iOS */
  textarea{font-size:16px}

  /* Botones más grandes para touch */
  .btn{padding:12px 20px;min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  .btn-sm{padding:10px 14px;min-height:40px}
  .btn-xs{padding:6px 10px;min-height:36px}

  /* Safe area para iPhone con notch/island */
  .app{padding-bottom:max(12px, env(safe-area-inset-bottom))}
}

@media(max-width:360px){
  .strat-grid{grid-template-columns:1fr 1fr}
  .cpg{grid-template-columns:repeat(2,1fr)}
  .cmd-grid{grid-template-columns:repeat(2,1fr)}
  .must-grid{grid-template-columns:repeat(2,1fr)}
}

/* Tablets (480-768px) */
@media(min-width:481px) and (max-width:768px){
  .app{padding:16px 14px}
  .strat-grid{grid-template-columns:repeat(3,1fr)}
  .cmd-grid{grid-template-columns:repeat(4,1fr)}
  .cpg{grid-template-columns:repeat(4,1fr)}
  .must-grid{grid-template-columns:repeat(4,1fr)}
  .stats-row{grid-template-columns:repeat(2,1fr)}
  .wk-left{width:200px}
}

/* Touch: agrandar tap targets */
@media(pointer:coarse){
  .wsb,.strat-btn,.mode-btn,.brk-btn,.col-btn{min-height:44px}
  .cp,.cmd-card{cursor:default}
  .btn,.btn-sm,.btn-xs{min-height:44px}
}
</style>
</head>

// ─── Targets dinámicos según estrategia y comandante ───────────────────
// El total siempre es 100: 1-2 comandantes + landCount + ramp + creatures + spells + artifacts + enchants
// Ajusta automáticamente según la estrategia para que todo sume exactamente 100

function calcTargets(){
  const stratIds = S.strategies?.length ? S.strategies : [S.strategy||'aggro'];
  const cmd = S.cmdData;
  const oracle = ((cmd?.oracle_text||'')+(cmd?.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  const cmdsN = S.partnerData ? 2 : 1;
  const landN = S.landCount;

  const poolMap = {
    tokens:      [9,  24, 10,  6,  7],
    aggro:       [9,  26, 10,  8,  3],
    reanimate:   [8,  22, 12,  6,  8],
    control:     [8,  12, 18,  8, 10],
    spells:      [8,  14, 20,  8,  6],
    combo:       [8,  18, 12, 12,  6],
    stax:        [8,  14, 10, 13, 11],
    ramp:        [12, 20, 10,  8,  6],
    lifegain:    [8,  18, 10,  8, 12],
    lifedrain:   [8,  16, 14,  6, 12],
    mill:        [8,  12, 18,  8, 10],
    counters:    [8,  22, 10,  8,  8],
    poison:      [9,  22, 12,  8,  5],
    sacrifice:   [8,  22, 10,  8,  8],
    aristocrats: [8,  24, 10,  6,  8],
    graveyard:   [8,  20, 14,  6,  8],
    draw:        [8,  14, 16,  8, 10],
    copy:        [8,  12, 22,  8,  6],
    theft:       [8,  12, 18,  8,  8],
    burn:        [8,  14, 20,  8,  6],
    superfriends:[8,   8, 14,  8, 18],
    lands:       [12, 14, 10,  8, 12],
    enchantress: [8,  12, 10,  6, 20],
    artifacts:   [8,  10, 10, 22,  6],
    stompy:      [12, 24,  8,  8,  4],
    attack:      [8,  24, 10,  8,  6],
    proliferate: [8,  18, 12,  8,  8],
    extraturns:  [8,  10, 22, 10,  6],
    politics:    [8,  14, 14,  8, 12],
    storm:       [8,  10, 24,  8,  6],
  };

  // Average pools across all selected strategies
  const selectedPools = stratIds.map(id => poolMap[id] || [9, 20, 12, 8, 7]);
  const avgPool = selectedPools[0].map((_, i) =>
    Math.round(selectedPools.reduce((sum, p) => sum + p[i], 0) / selectedPools.length)
  );

  let [r, cr, sp, ar, en] = avgPool;

  // Commander oracle adjustments
  if(oracle.includes('create') && oracle.includes('token')) cr = Math.max(cr, 22);
  if((cmd?.type_line||'').toLowerCase().includes('artifact') || oracle.includes('artifact')) ar = Math.max(ar, 12);
  if(oracle.includes('enchantment') || oracle.includes('aura')) en = Math.max(en, 12);
  if(oracle.includes('draw') && oracle.includes('card') && oracle.includes('whenever')) sp = Math.max(sp, 16);

  // Normalize so everything sums to 100 - cmdsN - landN
  const available = 100 - cmdsN - landN;
  const sum = r + cr + sp + ar + en;
  cr = Math.max(8, cr + (available - sum));

  const primaryId = stratIds[0];
  const hints = {
    lands:    `Objetivo: ${landN} tierras. Ajusta con el slider.`,
    ramp:     `Objetivo: ${r} piezas. Con ${landN} tierras el mazo necesita ~${r} fuentes de aceleración.`,
    creatures:`Objetivo: ${cr} criaturas. ${primaryId==='tokens'?'Priorizas generadores de tokens.':primaryId==='control'?'Solo las más impactantes.':'El núcleo de la estrategia.'}`,
    spells:   `Objetivo: ${sp} conjuros/instánt. ${primaryId==='spells'?'Tu estrategia depende de ellos.':primaryId==='control'?'Remoción, contraespeles y draw.':'Interacción y utilidad.'}`,
    artifacts:`Objetivo: ${ar} artefactos. ${primaryId==='stax'?'Las restricciones son tu motor.':primaryId==='combo'?'Piezas clave del combo.':'Equipamiento y utilidad.'}`,
    enchants: `Objetivo: ${en} encantamientos. ${primaryId==='control'?'Efectos duraderos de control.':primaryId==='spells'?'Sinergia con conjuros.':'Soporte y sinergias continuas.'}`,
  };

  S._targets = { ramp:r, creatures:cr, spells:sp, artifacts:ar, enchants:en };
  S._hints = hints;
  return S._targets;
}

// Devuelve el target para una sección (calculado dinámicamente o fallback)
function getTarget(sid){
  if(sid==='lands') return S.landCount;
  if(sid==='essentials') return 0;
  if(S._targets) return S._targets[sid] || WK_SECS.find(s=>s.id===sid)?.target || 8;
  calcTargets();
  return S._targets[sid] || WK_SECS.find(s=>s.id===sid)?.target || 8;
}

// Devuelve el hint para una sección
function getHint(sid){
  if(S._hints?.[sid]) return S._hints[sid];
  return WK_SECS.find(s=>s.id===sid)?.hint || '';
}

  function drawManaSymbol(ctx, zone, cx, cy, size, alpha) {

      // Fluffy rounded tree
      [[-s*0.01,-s*0.62,s*0.42],[-s*0.30,-s*0.22,s*0.34],[s*0.30,-s*0.22,s*0.34],
       [-s*0.18, s*0.12,s*0.30],[s*0.18, s*0.12,s*0.30],[0,-s*0.08,s*0.38]].forEach(([tx,ty,r])=>{
        ctx.beginPath(); ctx.arc(tx,ty,r,0,Math.PI*2); ctx.fill();
      });
      ctx.fillRect(-s*0.15, s*0.38, s*0.30, s*0.52);
    }
    ctx.restore();
  }

  const isMobile = window.innerWidth < 600;
  let lastFrame = 0;
  function draw(timestamp) {
    // En móvil limitamos a ~30fps para ahorrar batería
    if (isMobile && timestamp - lastFrame < 33) { requestAnimationFrame(draw); return; }
    lastFrame = timestamp;
    t += isMobile ? 0.005 : 0.007;
    ctx.clearRect(0, 0, W, H);

    // 1. Fondo oscuro base
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, '#030208'); bg.addColorStop(0.5, '#060410'); bg.addColorStop(1, '#020608');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    // 2. Orbes de color (auras grandes por zona)
    orbs.forEach((o, i) => {
      const wobX = Math.sin(t * 0.8 + o.phase) * W * 0.025;
      const wobY = Math.cos(t * 0.6 + o.phase * 1.4) * H * 0.02;
      const pulse = 1 + Math.sin(t * 1.1 + o.phase) * 0.06;
      const cx = o.x + wobX, cy = o.y + wobY;
      const gr = ctx.createRadialGradient(cx, cy, 0, cx, cy, o.r * pulse);
      gr.addColorStop(0,   `hsla(${o.zone.hue},${o.zone.sat},60%,0.20)`);
      gr.addColorStop(0.3, `hsla(${o.zone.hue},${o.zone.sat},50%,0.10)`);
      gr.addColorStop(0.7, `hsla(${o.zone.hue},${o.zone.sat},40%,0.03)`);
      gr.addColorStop(1,   `hsla(${o.zone.hue},${o.zone.sat},30%,0)`);
      ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    });

    // 3. Rayos de energía entre orbes
    for (let i = 0; i < orbs.length; i++) {
      const a = orbs[i], b = orbs[(i+1)%orbs.length];
      const alpha = 0.03 * (1 + Math.sin(t * 2.5 + i) * 0.4);
      const gr = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      gr.addColorStop(0, `hsla(${a.zone.hue},80%,60%,${alpha})`);
      gr.addColorStop(1, `hsla(${b.zone.hue},80%,60%,${alpha})`);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = gr; ctx.lineWidth = 0.7; ctx.stroke();
    }

    // 4. Arte flotante — cartas con borde de color de zona
    floaters.forEach(fa => {
      const img = imgs[fa.src];
      if (!img || !img.complete || !img.naturalWidth) return;
      fa.pulse += 0.008;
      const ap = fa.alpha * (0.85 + Math.sin(fa.pulse) * 0.15);
      const w = fa.w, h = fa.w * 1.4;
      const x = ((fa.x % W) + W) % W, y = ((fa.y % H) + H) % H;
      ctx.save();
      ctx.translate(x, y); ctx.rotate(fa.rot);
      ctx.globalAlpha = ap;
      if (ctx.roundRect) {
        ctx.beginPath(); ctx.roundRect(-w/2, -h/2, w, h, 5); ctx.clip();
      }
      ctx.drawImage(img, -w/2, -h/2, w, h);
      // Borde brillante del color de la zona
      ctx.globalAlpha = ap * 0.9;
      ctx.strokeStyle = `hsla(${fa.zone.hue},${fa.zone.sat},65%,0.7)`;
      ctx.lineWidth = 1.2;
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(-w/2,-h/2,w,h,5); ctx.stroke(); }
      else { ctx.strokeRect(-w/2,-h/2,w,h); }
      ctx.restore();
      fa.x += fa.vx; fa.y += fa.vy; fa.rot += fa.rotV;
    });

    // 5. Símbolos de mana grandes en las esquinas
    manaSyms.forEach((ms, i) => {
      const pulse = 1 + Math.sin(t * 1.3 + ms.phase) * 0.12;
      const alpha = 0.14 * (0.75 + Math.sin(t * 0.7 + ms.phase * 1.3) * 0.25);
      const cx = ms.frac[0] * W, cy = ms.frac[1] * H;
      const size = Math.min(W, H) * 0.05 * pulse;
      drawManaSymbol(ctx, ms.zone, cx, cy, size, alpha);
    });

    // 6. Partículas mágicas
    particles.forEach(p => {
      p.phase += p.pSpeed;
      const twinkle = 0.5 + Math.sin(p.phase) * 0.5;
      const alpha = p.baseAlpha * twinkle;
      const r = p.r * (0.7 + twinkle * 0.6);
      const px = ((p.x % W) + W) % W, py = ((p.y % H) + H) % H;
      const gr = ctx.createRadialGradient(px, py, 0, px, py, r * 3.5);
      gr.addColorStop(0, `hsla(${p.hue},${p.sat},80%,${alpha})`);
      gr.addColorStop(1, `hsla(${p.hue},${p.sat},60%,0)`);
      ctx.beginPath(); ctx.arc(px, py, r * 3.5, 0, Math.PI*2);
      ctx.fillStyle = gr; ctx.fill();
      p.x += p.vx; p.y += p.vy;
    });

    // 7. Viñeta oscura para legibilidad
    const vig = ctx.createRadialGradient(W/2, H/2, H*0.18, W/2, H/2, Math.max(W,H)*0.82);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(0.55,'rgba(0,0,0,0.04)');
    vig.addColorStop(1, 'rgba(0,0,0,0.78)');
    ctx.fillStyle = vig; ctx.fillRect(0, 0, W, H);

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

function canGoP0(){
  if(!S.mode) return false;
  if(S.mode==='scratch') return true;
  if(S.mode==='single') return !!S.cmdData;
  if(S.mode==='partner') return !!(S.cmdData&&S.partnerData);
  if(S.mode==='tribal') return !!(S.tribe);
  return false;
}
function saveKey(){
  const v=document.getElementById('ak').value.trim();
  if(!v.startsWith('sk-ant-')){document.getElementById('ak-st').textContent='⚠ Debe empezar por sk-ant-';document.getElementById('ak-st').style.color='var(--red)';return;}
  S.apiKey=v;
  document.getElementById('ak-st').textContent='✓ API key guardada — análisis IA activado';
  document.getElementById('ak-st').style.color='var(--green)';
}
function skipKey(){S.apiKey=null;document.querySelector('.apikey-box').style.opacity='.5';}
function selMode(m){
  S.mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('sel'));
  document.getElementById('mb-'+m).classList.add('sel');
  const csec  = document.getElementById('csec');
  const csb2  = document.getElementById('csbox2');
  const trib  = document.getElementById('tribal-sec');

  if(m==='scratch'){
    csec.style.display='none';
    trib.style.display='none';
    document.getElementById('btn0').disabled=false;
  } else if(m==='tribal'){
    csec.style.display='none';
    trib.style.display='block';
    // Solo habilitar si ya hay tribu seleccionada
    document.getElementById('btn0').disabled=!S.tribe;
  } else {
    csec.style.display='block';
    trib.style.display='none';
    csb2.style.display=m==='partner'?'block':'none';
    document.getElementById('btn0').disabled=!canGoP0();
  }
}

async function searchCmd(slot){
  const el=document.getElementById('cs'+slot);
  const q=el?.value?.trim(); if(!q||q.length<2) return;
  const sr=document.getElementById('sr'+slot);
  sr.style.display='block';
  sr.innerHTML='<div style="padding:10px;text-align:center"><span class="isp"></span></div>';
  const isP=S.mode==='partner';
  const pq=isP?' (o:partner OR o:"partner with") is:commander':' is:commander';
  let r=await sfQ(`"${q}"${pq} t:legendary t:creature -is:extra`);
  if(!r.length) r=await sfQ(`${q}${pq} t:legendary t:creature -is:extra`);
  r=r.slice(0,8); sr._r=r;
  if(!r.length){sr.innerHTML='<div style="padding:9px;color:var(--text3);font-size:11px">Sin resultados. Prueba en inglés.</div>';return;}
  sr.innerHTML=r.map((c,i)=>{
    const img=c.image_uris?.small||c.card_faces?.[0]?.image_uris?.small||'';
    const ci=(c.color_identity||[]).map(x=>`<span class="pip pip-${x}" style="width:9px;height:9px"></span>`).join('');
    const rk=c.edhrec_rank?`EDHREC #${c.edhrec_rank.toLocaleString()}`:'Nuevo';
    const hp=(c.oracle_text||'').toLowerCase().includes('partner');
    return `<div class="sri" onclick="selSR(${slot},${i})">
      ${img?`<img src="${img}" alt="${c.name}">`:'<div style="width:30px;height:42px;background:var(--bg3);border-radius:3px;flex-shrink:0"></div>'}
      <div><div class="sri-n">${c.name}</div><div class="sri-m">${ci} ${rk}${hp?' · ✅ Partner':''}</div></div>
    </div>`;
  }).join('');
}
function selSR(slot,idx){
  const sr=document.getElementById('sr'+slot);
  const card=sr._r?.[idx]; if(!card) return;
  sr.style.display='none';
  if(slot===1) S.cmdData=card; else S.partnerData=card;
  renderChip(slot,card);
  document.getElementById('btn0') && (document.getElementById('btn0').disabled=!canGoP0());
}
function renderChip(slot,card){
  const img=card.image_uris?.small||card.card_faces?.[0]?.image_uris?.small||'';
  document.getElementById('chip'+slot).innerHTML=`<div class="chip">
    ${img?`<img src="${img}" alt="${card.name}">`:''}
    <span class="chip-n">${card.name}</span>
    <span class="chip-x" onclick="clearCmd(${slot})">✕</span>
  </div>`;
}
function clearCmd(slot){
  if(slot===1) S.cmdData=null; else S.partnerData=null;
  document.getElementById('chip'+slot).innerHTML='';

function goPanel(n){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  // n can be a number (0-5) or a string ('home','optimize')
  if(typeof n === 'string'){
    document.getElementById(n).classList.add('active');
    // Hide stepper for non-wizard panels
    document.getElementById('stepper').style.display = (n==='home'||n==='optimize') ? 'none' : 'flex';
  } else {
    document.getElementById('p'+n).classList.add('active');
    document.getElementById('stepper').style.display = 'flex';
    for(let i=0;i<6;i++){
      const sc=document.getElementById('sc'+i);
      sc.className='sc'+(i<n?' done':i===n?' active':'');
      sc.innerHTML=i<n?'✓':i+1;
      if(i<5) document.getElementById('sl'+i+(i+1)).className='sl'+(i<n?' done':'');
    }
  }
  window.scrollTo({top:0,behavior:'smooth'});
}

// Analiza el texto de oráculo del comandante y sugiere estrategias
function renderStrategySuggestions(){
  const box = document.getElementById('strat-suggest-box');
  if(!box) return;
  const cmd = S.cmdData;
  const partner = S.partnerData;
  if(!cmd) return;

  const oracle1 = ((cmd.oracle_text||'')+(cmd.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  const oracle2 = partner ? ((partner.oracle_text||'')+(partner.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase() : '';
  const oracle = oracle1 + ' ' + oracle2;
  const typeLine = ((cmd.type_line||'')+(partner?partner.type_line:'')+(oracle)).toLowerCase();

  // Score each strategy based on oracle text match
  const scores = STRATEGIES.map(s => {
    const keys = {
      tokens:['token','create','populate','convoke','each creature','army'],
      ramp:['search your library for a','add','mana','landfall','land onto'],
      control:['counter target','destroy all','exile all','flash','when enters'],
      combo:['untap','whenever','each time','each combat','copies','infinite','whenever you cast'],
      aggro:['haste','double strike','first strike','menace','trample','whenever attacks','whenever deals'],
      voltron:['equipment','equip','attach','equipped','aura','enchant creature','double strike','commander damage'],
      legendary:['legendary','whenever a legendary','historic','each legendary','hero of'],
      reanimate:['graveyard','from your graveyard','graveyard to the battlefield','return from'],
      stax:["players can't",'opponents can','cost more','enter tapped','tax'],
      spells:['magecraft','whenever you cast','instant or sorcery','prowess','storm count'],
      lifegain:['you gain','lifelink','whenever you gain','life total'],
      lifedrain:['each opponent loses','drains','lose life','each opponent'],
      mill:['mill','puts cards from','library into graveyard'],
      counters:['+1/+1 counter','proliferate','put a counter','add a counter'],
      poison:['infect','poison counter','toxic','wither'],
      sacrifice:['sacrifice','whenever you sacrifice','sac outlet'],
      aristocrats:['whenever a creature','whenever you sacrifice','dies'],
      graveyard:['from your graveyard','dredge','from a graveyard'],
      draw:['draw','whenever you draw','you may draw'],
      artifacts:['artifact','whenever an artifact','metalcraft','affinity'],
      stompy:['power 5','power of','trample','eldrazi','gets +'],
      lands:['landfall','whenever a land','land enters','search your library for a land'],
      enchantress:['enchantress','whenever you cast an enchantment','enchantment enters'],
      burn:['deals damage','each opponent takes','whenever deals combat damage'],
      proliferate:['proliferate','add a counter of each type'],
    }[s.id] || [];
    const sc = keys.reduce((a, k) => oracle.includes(k) ? a + 2 : a, 0);
    return { s, sc };
  }).filter(x => x.sc >= 2).sort((a,b) => b.sc - a.sc).slice(0,4);

  if(!scores.length) { box.innerHTML = ''; return; }

  const cmdTitle = partner ? `${cmd.name} + ${partner.name}` : cmd.name;
  const pills = scores.map(({s}) => {
    const already = (S.strategies||[]).includes(s.id);
    return `<span class="strat-suggest-pill${already?' applied':''}" onclick="applySuggestedStrat('${s.id}')" title="${s.desc}">
      ${s.icon} ${s.name}${already?' ✓':''}
    </span>`;
  }).join('');

  box.innerHTML = `<div class="strat-suggest">
    <strong>💡 Sugerencias para ${cmdTitle}:</strong> Basándonos en el texto del comandante, estas estrategias encajan bien:
    <div class="strat-suggest-pills">${pills}</div>
  </div>`;
}

function applySuggestedStrat(id){
  if(!(S.strategies||[]).includes(id)){
    selStrat(id);
    // Re-render the suggestion pills
    setTimeout(()=>{
      if((S.mode==='single'||S.mode==='partner') && S.cmdData) renderStrategySuggestions();
    },50);
  }
}

function selStrat(id){

// Returns primary strategy object (first selected, or fallback)
function getPrimaryStrategy(){
  const id = (S.strategies?.[0]) || S.strategy || 'aggro';
  return STRATEGIES.find(s=>s.id===id) || STRATEGIES[0];
}

// Returns combined synQ from all selected strategies
function getCombinedSynQ(){
  const strats = (S.strategies?.length ? S.strategies : [S.strategy||'aggro'])
    .map(id=>STRATEGIES.find(s=>s.id===id)).filter(Boolean);
  const parts = [...new Set(strats.flatMap(s=>(s.synQ||'').match(/o:"[^"]+"/g)||[]))];
  return parts.join(' OR ');
}

// PANEL 2 — ELEGIR COMANDANTE (solo scratch)
// ═══════════════════════════════════════════════════════════
async function loadP2(){
  goPanel(2);
  const strat=getPrimaryStrategy();
  const allStrats=(S.strategies?.length?S.strategies:[strat.id]).map(id=>STRATEGIES.find(x=>x.id===id)).filter(Boolean);
  const isMultiStrat=allStrats.length>1;

  // color= filtra EXACTAMENTE esa combinación de colores
  // color<= filtra esa combinación O subconjuntos (más permisivo)
  const hasColors = S.colors.length > 0;
  const colorExact = hasColors ? `color=${S.colors.join('')}` : '';
  const colorMax   = hasColors ? `color<=${S.colors.join('')}` : '';

  const colorNames = {W:'Blanco',U:'Azul',B:'Negro',R:'Rojo',G:'Verde'};
  const colorDesc = hasColors
    ? S.colors.map(col => colorNames[col]||col).join(' + ')
    : 'cualquier color';

  const stratLabel=isMultiStrat?allStrats.map(s=>`${s.icon} ${s.name}`).join(' + '):`${strat.icon} ${strat.name}`;

  document.getElementById('p2c').innerHTML=`
    <div class="info-banner"><strong>${stratLabel} — Bracket ${S.bracket}</strong><br>
    Colores: <strong>${colorDesc}</strong>${hasColors ? ' — identidad de color exacta' : ''}<br>
    ${isMultiStrat?'Buscando comandantes que <strong>combinen todas las estrategias</strong>...':'Buscando los mejores comandantes en EDHREC y Scryfall...'}</div>
    <div class="ldc"><div class="spin-big"></div>Consultando fuentes de datos...</div>`;

  const rl=RANK_LIMITS[S.bracket]||6000;
  let cards=[];

  const mergeCards = (pool, extra) => {
    const seen = new Set(pool.map(c=>c.id));
    for(const c of extra) if(!seen.has(c.id)) pool.push(c);
  };

  if(hasColors){
    // Query principal con sinergia de cada estrategia seleccionada
    for(const s of allStrats){
      const q=`is:commander t:legendary t:creature ${colorExact} ${s.synQ}`;
      mergeCards(cards, await sfQ(q,1));
      mergeCards(cards, await sfQ(q,2));
    }
    // Query secundaria: identidad EXACTA sin filtro de sinergia
    const q2=`is:commander t:legendary t:creature ${colorExact} -is:extra`;
    mergeCards(cards, await sfQ(q2, 1));
    mergeCards(cards, await sfQ(q2, 2));
    // Query ampliada: subconjuntos (ej: elegiste WUG, acepta WU, WG, UG)
    if(S.colors.length >= 2){
      const q3=`is:commander t:legendary t:creature ${colorMax} -is:extra`;
      mergeCards(cards, await sfQ(q3, 1));
      mergeCards(cards, await sfQ(q3, 2));
    }
  } else {
    // Sin filtro de color — buscar con sinergia de cada estrategia
    for(const s of allStrats){
      const q=`is:commander t:legendary t:creature ${s.synQ}`;
      mergeCards(cards, await sfQ(q,1));
      mergeCards(cards, await sfQ(q,2));
    }
    const q2=`is:commander t:legendary t:creature -is:extra`;
    mergeCards(cards, await sfQ(q2, 1));
    mergeCards(cards, await sfQ(q2, 2));
  }

  // Scoring: rank EDHREC global + sinergia textual con TODAS las estrategias + bracket fit
  // En modo multi-estrategia, los comandantes que encajan con TODAS suben al top
  const scored=cards.map(c=>{
    let sc=0;
    const rank=c.edhrec_rank||9999;
    sc+=Math.max(0,5000-rank)/500;
    const txt=((c.oracle_text||'')+(c.card_faces||[]).map(f=>f.oracle_text||'').join('')).toLowerCase();
    let stratMatches=0;
    allStrats.forEach(s=>{
      let hits=0;
      s.synQ.replace(/o:"([^"]+)"/g,(_,kw)=>{if(txt.includes(kw.toLowerCase()))hits++;});
      if(hits>0){sc+=hits*4;stratMatches++;}
    });
    // Bonus clave: si encaja con TODAS las estrategias seleccionadas
    if(isMultiStrat&&stratMatches===allStrats.length) sc+=15;
    else if(isMultiStrat&&stratMatches===0) sc-=8;
    if(S.bracket<=2&&rank>500) sc+=2;
    if(S.bracket>=3&&rank<=300) sc+=5;
    if(S.bracket>=4&&rank<=100) sc+=8;
    if(S.bracket===5&&rank<=50) sc+=5;
    return{...c,_sc:sc,_rank:rank,_stratMatches:stratMatches};
  });
  scored.sort((a,b)=>b._sc-a._sc);
  const top=scored.slice(0,36);

  if(!top.length){document.getElementById('p2c').innerHTML=`<div class="ebox">Sin resultados. Prueba cambiando los filtros de color.</div>`;return;}

  const infoLine=isMultiStrat
    ?`<strong>Ordenados por:</strong> comandantes que combinan ${allStrats.map(s=>s.name).join(' + ')} · primero los que encajan con todas`
    :`<strong>Ordenados por:</strong> popularidad global EDHREC + sinergia con ${strat.name} + bracket ${S.bracket}`;

  document.getElementById('p2c').innerHTML=`
    <div class="info-banner">
      ✅ Scryfall (${top.length} comandantes) · ${S.apiKey?'🤖 Análisis IA':'⚪ Sin IA'}<br>
      ${infoLine}
    </div>
    <div class="cmd-grid" id="cmdgrid"></div>
    <div class="nav"><button class="btn btn-g" onclick="renderP1();goPanel(1)">← Atrás</button>
      <button class="btn btn-p" id="btn2" onclick="showBuildChoice()" disabled>Construir mazo →</button>
    </div>`;

  const grid=document.getElementById('cmdgrid');
  top.forEach(c=>{
    const img=c.image_uris?.normal||c.card_faces?.[0]?.image_uris?.normal||'';
    const ci=(c.color_identity||[]).map(x=>`<span class="pip pip-${x}" style="width:10px;height:10px"></span>`).join(' ');
    const rk=c._rank<9999?`#${c._rank.toLocaleString()}`:'Nuevo';
    const syn=Math.min(100,Math.round((c._sc/30)*100));
    // Badge de combinación de estrategias
    const comboBadge=isMultiStrat&&c._stratMatches===allStrats.length
      ?`<span class="spill" style="background:rgba(212,168,67,.2);color:var(--gold);border:1px solid rgba(212,168,67,.4)">⚡ Combina ${allStrats.length} estrategias</span>`
      :isMultiStrat&&c._stratMatches>0
      ?`<span class="spill" style="background:rgba(76,175,125,.1);color:var(--green);border:1px solid rgba(76,175,125,.3)">${c._stratMatches}/${allStrats.length} estrategias</span>`
      :'';
    const el=document.createElement('div');
    el.className='cmd-card'; el.id='cc-'+c.id;
    el.innerHTML=`<div class="chkv">✓</div>
      ${img?`<img src="${img}" alt="${c.name}" loading="lazy">`:`<div style="aspect-ratio:5/7;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:34px">🃏</div>`}
      <div class="ci">
        <div class="ci-name">${c.name}</div>
        <div class="ci-type">${ci} <span style="font-size:9px">${(c.type_line||'').replace('Legendary Creature — ','')}</span></div>
        <div class="ci-pills">
          <span class="spill sp-e">${rk} EDHREC</span>
          <span class="spill sp-s">Sinergia ${syn}%</span>
          ${comboBadge}
        </div>
        <div class="ci-ai ${S.apiKey?'ld':''}" id="ai-${c.id}">${S.apiKey?'<span class="isp"></span> Analizando...':fallbackAI(c,strat)}</div>
      </div>`;
    el.addEventListener('mouseenter',e=>showZ(e,img,c.name,c.oracle_text||c.card_faces?.[0]?.oracle_text||''));
    el.addEventListener('mouseleave',hideZ);
    el.onclick=()=>{
      document.querySelectorAll('.cmd-card').forEach(x=>x.classList.remove('sel'));
      el.classList.add('sel'); S.cmdData=c;
      document.getElementById('btn2').disabled=false;
    };
    grid.appendChild(el);
    if(S.apiKey) aiAnalysis(c,strat,S.bracket,null).then(t=>{
      const ae=document.getElementById('ai-'+c.id);
      if(ae){ae.classList.remove('ld');ae.innerHTML=t||fallbackAI(c,strat);}
    });
  });
}

function getTotal(){return Object.values(S.wk).reduce((a,b)=>a+b.length,0);}

function renderLeft(){
  const left=document.getElementById('wkleft'); if(!left) return;
  const cmdsN=S.partnerData?2:1; const tot=getTotal()+cmdsN;
  left.innerHTML=WK_SECS.map(sec=>{
    if(sec.id==='essentials'){
      const added=countEssentialsAdded();
      const isA=S.activeSec==='essentials';
      const isDone=S._essentialsDone||false;
      return `<button class="wsb${isA?' wk-active':''}${isDone?' wk-done':''}" onclick="swSec('essentials')">
        <div class="wsb-top"><span class="wsb-name">${sec.icon} ${sec.name}</span><span class="wsb-cnt">${added} añadidas</span></div>
        <div class="wsb-bar"><div class="wsb-fill" style="width:${isDone?100:0}%;background:${isDone?'var(--green)':'var(--gold)'}"></div></div>
        <div class="wsb-hint">${sec.hint}</div>
      </button>`;
    }
    const pk=sec.id==='lands'?getTotalLands():(S.wk[sec.id]?.length||0);
    const tgt=getTarget(sec.id);
    const pct=Math.min(100,Math.round((pk/tgt)*100));
    const isA=S.activeSec===sec.id, isDone=pk>=tgt;
    return `<button class="wsb${isA?' wk-active':''}${isDone?' wk-done':''}" onclick="swSec('${sec.id}')">
      <div class="wsb-top"><span class="wsb-name">${sec.icon} ${sec.name}</span><span class="wsb-cnt">${pk}/${tgt}</span></div>
      <div class="wsb-bar"><div class="wsb-fill" style="width:${pct}%;background:${isDone?'var(--green)':sec.col}"></div></div>
      <div class="wsb-hint">${getHint(sec.id)}</div>
    </button>`;
  }).join('');
  // Resumen
  left.innerHTML+=`<div class="wk-sum">
    <div style="font-size:10px;color:var(--text3);margin-bottom:5px">Resumen</div>
    <div class="sum-row"><span>Comandante(s)</span><span style="color:var(--gold);font-weight:700">${cmdsN}</span></div>
    ${WK_SECS.filter(s=>s.id!=='essentials').map(s=>`<div class="sum-row"><span style="color:var(--text2)">${s.name}</span><span style="color:${s.col};font-weight:600">${s.id==='lands'?getTotalLands():(S.wk[s.id]?.length||0)}</span></div>`).join('')}
    <div class="sum-row" style="padding-top:5px;margin-top:3px;border-top:1px solid var(--border)"><span style="color:var(--text);font-weight:700">Total</span><span style="color:${tot===100?'var(--green)':tot>100?'var(--red)':'var(--gold)'};font-weight:700">${tot}/100</span></div>
  </div>`;
}

function countEssentialsAdded(){
  if(!_wkEssCache) return 0;
  return _wkEssCache.filter(item=>{
    const card=_wkEssImgs[item.name?.toLowerCase()];
    if(!card) return false;
    const sid=cardToSid(card);
    return (S.wk[sid]||[]).some(c=>c.name.toLowerCase()===item.name.toLowerCase());
  }).length;
}

function cardToSid(card){
  const t=(card.type_line||'').toLowerCase();
  if(t.includes('creature')) return 'creatures';
  if(t.includes('instant')||t.includes('sorcery')) return 'spells';
  if(t.includes('artifact')) return 'artifacts';
  if(t.includes('enchantment')) return 'enchants';
  if(t.includes('land')) return 'lands';
  // ramp heuristic: si es un hechizo que busca tierras o añade mana
  const oracle=((card.oracle_text||'')+(card.card_faces||[]).map(f=>f.oracle_text||'').join(' ')).toLowerCase();
  if(oracle.includes('search your library') && oracle.includes('land')) return 'ramp';
  if(oracle.includes('add') && oracle.includes('mana')) return 'ramp';
  return 'creatures';
}

function swSec(id){S.activeSec=id;renderLeft();renderRight(id);}

async function renderRight(sid){
  const right=document.getElementById('wkright'); if(!right) return;
  const sec=WK_SECS.find(s=>s.id===sid);

  if(sid==='lands'){renderLands(right,sec,pk,tgt);return;}

  right.innerHTML=`
    <div class="wk-title"><span>${sec.icon}</span>${sec.name}</div>
    <div class="wk-sub">${getHint(sid)} Selecciona las que quieras incluir o busca cartas manualmente.</div>
    ${slotCtr(pk.length,tgt,sec.col)}

      <div class="msrow">

        <button class="btn btn-p btn-sm" onclick="manSearch('${sid}')">Buscar</button>
      </div>
      <div class="msres" id="msr-${sid}"></div>
    </div>

    </div>
    <div id="cpg-${sid}" class="cpg"><div class="il"><span class="isp"></span>Buscando cartas...</div></div>`;
